,"text":"鲸鱼","kind":"noun"},{"id":"w15","sid":"s2","start":0,"end":2,"text":"小雅","kind":"noun"},{"id":"w16","sid":"s3","start":4,"end":6,"text":"海龟","kind":"noun"},{"id":"w17","sid":"s4","start":26,"end":28,"text":"书包","kind":"noun"},{"id":"w18","sid":"s4","start":6,"end":8,"text":"书页","kind":"noun"},{"id":"w19","sid":"s4","start":23,"end":25,"text":"小雅","kind":"noun"},{"id":"w20","sid":"s5","start":15,"end":18,"text":"值日生","kind":"noun"},{"id":"w21","sid":"s5","start":2,"end":4,"text":"广播","kind":"noun"},{"id":"w22","sid":"s5","start":22,"end":26,"text":"清洁工具","kind":"noun"},{"id":"w23","sid":"s5","start":11,"end":13,"text":"走廊","kind":"noun"},{"id":"w24","sid":"s5","start":8,"end":10,"text":"音乐","kind":"noun"},{"id":"w25","sid":"s6","start":0,"end":2,"text":"小雅","kind":"noun"},{"id":"w26","sid":"s6","start":12,"end":14,"text":"操场","kind":"noun"}],"referenceEdges":[["w1","w2"],["w3","w4"]],"mode":"train","round":1,"blockId":"r1b1","level":1},{"id":"T03","title":"雨天活动记录","domain":"reading","skills":["反向审题","信息筛选"],"passage":[{"id":"s1","text":"星期六，社区准备在小广场举办故事会，工作人员提前摆好了十把椅子。"},{"id":"s2","text":"早晨下起雨来，故事会因此改到一楼的活动室举行，开始时间仍是上午九点。"},{"id":"s3","text":"小叶带来两本故事书，其中一本讲森林，另一本讲海洋。"},{"id":"s4","text":"故事会结束时，小叶把讲森林的书借给小林，把讲海洋的书带回了家。"},{"id":"s5","text":"活动室墙上挂着一张旧日历，窗台上摆着几盆绿色植物。"},{"id":"s6","text":"大家离开前擦干桌面，工作人员收好椅子，关上了活动室的门。"}],"question":"根据原文，选出所有与事实不符的说法。","targets":[{"label":"故事会开始的时间","needed":false,"steps":[{"kind":"single","prompt":"选择时间。","options":[{"id":"o0","text":"上午九点"},{"id":"o1","text":"上午十点"},{"id":"o2","text":"下午三点"}],"answer":"o0","explanation":"九点正确，但原题要求找不符说法。","id":"p1"}],"id":"t2"},{"label":"与原文事实不符的全部说法","needed":true,"steps":[{"kind":"multi","prompt":"多选，不要选正确的说法。","options":[{"id":"o0","text":"故事会最后在小广场举行。"},{"id":"o1","text":"故事会仍在上午九点开始。"},{"id":"o2","text":"小叶把讲海洋的书借给了小林。"},{"id":"o3","text":"小叶带来了两本故事书。"}],"answer":["o0","o2"],"explanation":"地点改为活动室；借出去的是森林故事书。其余两项与原文一致。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3","s4"]},"taskSpans":["所有与事实不符的说法"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b1","level":1},{"id":"T04","title":"修好的小桥","domain":"reading","skills":["整体概括","信息筛选"],"passage":[{"id":"s1","text":"小溪旁有一座小木桥，桥边长着蒲公英，清早常有小鸟停在栏杆上唱歌。"},{"id":"s2","text":"一天，孩子们发现桥上有一块木板松了，便先在桥头放上提醒大家绕行的牌子。"},{"id":"s3","text":"阿哲去找村里的木匠，小宁留在桥头，提醒过路的人不要踩松动的木板。"},{"id":"s4","text":"木匠修桥时，孩子们帮忙递工具，还把散落的钉子收进盒子，免得扎到人。"},{"id":"s5","text":"木板修好后，大家一起检查，确认可以安全通过，才撤下绕行的牌子。"},{"id":"s6","text":"傍晚，夕阳照在水面上，桥边卖豆花的老人收起小摊，慢慢走回家。"}],"question":"下面哪一个标题最能概括这段故事的主要内容？","targets":[{"label":"故事结尾是什么时候","needed":false,"steps":[{"kind":"single","prompt":"选择时间。","options":[{"id":"o0","text":"清早"},{"id":"o1","text":"中午"},{"id":"o2","text":"傍晚"}],"answer":"o2","explanation":"结尾是傍晚，不是题目所问。","id":"p1"}],"id":"t2"},{"label":"最能概括全文的标题","needed":true,"steps":[{"kind":"single","prompt":"选一个标题。","options":[{"id":"o0","text":"桥边美丽的蒲公英"},{"id":"o1","text":"大家一起解决小桥的安全问题"},{"id":"o2","text":"卖豆花老人的一天"},{"id":"o3","text":"阿哲独自建造新桥"}],"answer":"o1","explanation":"发现危险、提醒行人、找人修桥和检查安全，是文章主要事件；没有新建桥。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出描写“发现问题、采取行动、解决问题”的句子。","answers":[["s2","s3","s4","s5"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":["最能概括这段故事的主要内容"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b1","level":1},{"id":"T05","title":"文具店里的选择","domain":"math","skills":["信息筛选","多步推理","多问完整"],"passage":[{"id":"s1","text":"周日，小宁带着三十元去文具店，想给阅读记录本做一些漂亮的封面。"},{"id":"s2","text":"她最后买了一本十二元的本子和一盒彩笔，彩笔的价格是八元。"},{"id":"s3","text":"店里还有五元的橡皮和十五元的尺子套装，她看了看，但都没有买。"},{"id":"s4","text":"结账时，她没有使用优惠券，也没有得到退款，买到的东西都装进自己的布袋。"},{"id":"s5","text":"收银台旁边摆着六个玩具模型，门口的海报上写着下午有手工活动。"},{"id":"s6","text":"离店后她直接回家，没有再买东西，也没有把钱给别人。"}],"question":"小宁这次一共花了多少元，回到家时还剩多少元？","targets":[{"label":"这次一共花的钱","needed":true,"steps":[{"kind":"number","prompt":"把实际买到的两样东西相加，共花多少元？","answer":20,"explanation":"本子12元，彩笔8元。","calc":"12+8","id":"p1"}],"id":"t1"},{"label":"回到家时剩下的钱","needed":true,"steps":[{"kind":"number","prompt":"第一步：这次实际花了多少元？","answer":20,"explanation":"只算实际买到的本子和彩笔。","calc":"12+8","id":"p1"},{"kind":"number","prompt":"第二步：从带的钱里减去花的钱，还剩多少元？","answer":10,"explanation":"带30元，花20元，且没有别的收支。","calc":"30-(12+8)","id":"p2"}],"id":"t2"},{"label":"橡皮的标价","needed":false,"steps":[{"kind":"number","prompt":"填写元数。","answer":5,"explanation":"橡皮5元，但没有买。","id":"p1"}],"id":"t3"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s4","s6"]},"taskSpans":["一共花了多少元","还剩多少元"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b1","level":1},{"id":"T06","title":"上车以前","domain":"math","skills":["题意识别","信息筛选"],"passage":[{"id":"s1","text":"学校安排大家坐车去植物园，出发前老师在车旁点名，提醒同学们系好鞋带。"},{"id":"s2","text":"小航出门时在水壶里装了八百毫升水，水壶外面还贴着一张火箭贴纸。"},{"id":"s3","text":"到集合地点时，他喝掉了一百毫升，随后在车上又喝了五十毫升。"},{"id":"s4","text":"老师随身带着两瓶备用水，但小航没有从备用水瓶里加水。"},{"id":"s5","text":"植物园门口排着很长的队，大家一边看导览图，一边等待工作人员检查门票。"},{"id":"s6","text":"小航把水壶放进书包，和同学一起去看温室里的仙人掌。"}],"question":"题目只问：小航出门时，水壶里装了多少毫升水？","targets":[{"label":"两次喝水后一共喝掉的水","needed":false,"steps":[{"kind":"number","prompt":"填写毫升数。","answer":150,"explanation":"100+50=150，但不是所问。","calc":"100+50","id":"p1"}],"id":"t2"},{"label":"两次喝水后剩下的水","needed":false,"steps":[{"kind":"number","prompt":"填写毫升数。","answer":650,"explanation":"800-100-50=650，但题目问出门时。","calc":"800-100-50","id":"p1"}],"id":"t3"},{"label":"出门时水壶里的水量","needed":true,"steps":[{"kind":"number","prompt":"填写毫升数。","answer":800,"explanation":"题目问出门时，原文直接给出800毫升，不必计算后来的水量。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2"]},"taskSpans":["出门时","装了多少毫升水"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b1","level":1},{"id":"T07","title":"问题换一种说法","domain":"math","skills":["题意等价","信息筛选"],"passage":[{"id":"s1","text":"小雨带着二十元来到校园义卖摊前，摊上摆着书签、旧故事书和手工花朵。"},{"id":"s2","text":"她花六元买了一本故事书，又花四元买了一张书签，没有买别的东西。"},{"id":"s3","text":"摊主把收到的钱放进盒子，再把东西交给小雨；整个过程没有折扣或赠送钱。"},{"id":"s4","text":"她的朋友在旁边看手工花，花上有红、黄、蓝三种颜色，还有很长的绿色花茎。"},{"id":"s5","text":"小雨拿着剩余的钱离开，准备下午才读新买来的故事书。"},{"id":"s6","text":"原题的问题是：小雨买完这两样东西后，还剩下多少钱？"}],"question":"不计算答案。选出所有与原题的问题意思相同的问法。","targets":[{"label":"购买后剩余的钱数","needed":false,"steps":[{"kind":"number","prompt":"填写元数。","answer":10,"explanation":"20-6-4=10，但本题要求判断问法，不要求算答案。","calc":"20-6-4","id":"p1"}],"id":"t2"},{"label":"与原题意思相同的所有问法","needed":true,"steps":[{"kind":"multi","prompt":"选择问的是同一笔钱的问法。","options":[{"id":"o0","text":"这两样东西一共花了小雨多少钱？"},{"id":"o1","text":"小雨离开摊位时还留着多少元？"},{"id":"o2","text":"从原来的二十元中扣掉这次花的钱，还余下多少元？"},{"id":"o3","text":"小雨买了多少样东西？"}],"answer":["o1","o2"],"explanation":"原题问购买后剩余的钱，不是花费总数或物品件数。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s6"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s6"]},"taskSpans":["不计算答案","所有与原题的问题意思相同的问法"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b1","level":1},{"id":"T08","title":"一样的数量关系","domain":"math","skills":["结构等价","信息筛选"],"passage":[{"id":"s1","text":"阅读角原来有十八本故事书，同学们围着书架讨论，准备把每一层都整理整齐。"},{"id":"s2","text":"午间借出了五本，下午又收到三本新捐来的故事书，没有其他数量变化。"},{"id":"s3","text":"书架旁有两把椅子，墙上贴着阅读约定，约定提醒大家借书后及时登记。"},{"id":"s4","text":"值日生先擦干书架，再把书按大小摆好，把借书登记表放在最上面一层。"},{"id":"s5","text":"老师问：现在阅读角有多少本故事书？"},{"id":"s6","text":"这里要比较的是事情变化的先后关系，不是最后恰好算出相同的数字。"}],"question":"选出所有与原题有相同数量变化结构的问题：先有一些，拿走一部分，再添进一部分，问最后剩多少。","targets":[{"label":"阅读角现在的故事书数","needed":false,"steps":[{"kind":"number","prompt":"填写本数。","answer":16,"explanation":"18-5+3=16，但本题要求比较结构。","calc":"18-5+3","id":"p1"}],"id":"t2"},{"label":"数量变化结构相同的所有问题","needed":true,"steps":[{"kind":"multi","prompt":"只看数量如何变化。","options":[{"id":"o0","text":"盒里原有12支笔，拿走4支，又放进2支，现在有几支？"},{"id":"o1","text":"树上有12只鸟，又来了4只，随后飞走2只，现在有几只？"},{"id":"o2","text":"小兔有9个萝卜，送出3个，又收进5个，现在有几个？"},{"id":"o3","text":"小林有8张卡，小雨有3张卡，两人一共有几张？"}],"answer":["o0","o2"],"explanation":"只有第一、第三项依次是原有→减少→增加→问现有。第二项变化顺序不同，第四项是合并两人的数量。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s5"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s5"]},"taskSpans":["所有与原题有相同数量变化结构的问题"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b1","level":1},{"id":"T09","title":"把种子种下去","domain":"reasoning","skills":["多步推理","顺序整合"],"passage":[{"id":"s1","text":"科学课上，老师发给每组一个纸杯、一些土和几粒种子，桌面铺着旧报纸。"},{"id":"s2","text":"老师说明：先把土放进杯子，土面不要高过杯口，再在土里挖一个小坑。"},{"id":"s3","text":"只有小坑挖好后才能放入种子，种子放好后还要把小坑轻轻盖上土。"},{"id":"s4","text":"最后才浇少量的水，不能先把空纸杯装满水再放土。"},{"id":"s5","text":"小宁想在杯子外面画一朵花，阿哲想贴一张名字条，这些装饰晚一点做也可以。"},{"id":"s6","text":"老师要求大家暂时不画画，只把种植过程说清楚，再开始动手操作。"}],"question":"把“装土挖坑、放入种子、盖土、少量浇水”按正确先后顺序排好。","targets":[{"label":"种植步骤的正确顺序","needed":true,"steps":[{"kind":"order","prompt":"按先后点选卡片；点已选卡片可撤回。","options":[{"id":"o0","text":"少量浇水"},{"id":"o1","text":"盖土"},{"id":"o2","text":"装土挖坑"},{"id":"o3","text":"放入种子"}],"answer":["o2","o3","o1","o0"],"explanation":"先准备坑，再放种子，再盖土，最后浇水。","id":"p1"}],"id":"t1"},{"label":"纸杯外面的装饰","needed":false,"steps":[{"kind":"single","prompt":"选择一种文中提过的装饰。","options":[{"id":"o0","text":"画花"},{"id":"o1","text":"涂黑杯口"},{"id":"o2","text":"贴树叶"}],"answer":"o0","explanation":"装饰不是本题要求排序的种植步骤。","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3","s4"]},"taskSpans":["按正确先后顺序排好"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b1","level":1},{"id":"T10","title":"还不能确定","domain":"reasoning","skills":["无法确定","逻辑判断"],"passage":[{"id":"s1","text":"小航、小雨和阿哲一起参加运动会，三个人各自背着一个不同颜色的小背包。"},{"id":"s2","text":"比赛结束后，小航先走进教室，小雨第二个走进教室，阿哲最后走进教室。"},{"id":"s3","text":"老师看见小航戴着红帽子，看见阿哲手里拿着一面小旗，但没有介绍背包的颜色。"},{"id":"s4","text":"桌上摆着三瓶没有开封的水，窗边的奖牌架上挂着去年的奖牌。"},{"id":"s5","text":"三个人把背包放好就去洗手，谁也没有在教室里谈论比赛的名次。"},{"id":"s6","text":"本文只记录进教室的先后，没有介绍三个人在赛跑中谁先到终点。"}],"question":"选出所有仅凭这段话还不能确定的事情。","targets":[{"label":"从原文无法确定的所有事情","needed":true,"steps":[{"kind":"multi","prompt":"多选：不要把“没说”当作“相反”。","options":[{"id":"o0","text":"谁最后走进教室。"},{"id":"o1","text":"小航背包是什么颜色。"},{"id":"o2","text":"谁在赛跑中第一个到终点。"},{"id":"o3","text":"谁戴着红帽子。"}],"answer":["o1","o2"],"explanation":"原文给出了进教室顺序和红帽子的主人，没有给出背包颜色或赛跑名次。","id":"p1"}],"id":"t1"},{"label":"最后走进教室的人","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小雨"},{"id":"o1","text":"阿哲"},{"id":"o2","text":"小航"}],"answer":"o1","explanation":"最后进教室的是阿哲，这件事可以确定。","id":"p1"}],"id":"t2"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3","s6"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3","s5","s6"]},"taskSpans":["所有仅凭这段话还不能确定的事情"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b1","level":1},{"id":"T11","title":"借伞的小路","domain":"reading","skills":["指代追踪","信息筛选"],"passage":[{"id":"s1","text":"放学时突然下起小雨，小哲站在屋檐下，手里拿着一本还没有装进书包的练习本。"},{"id":"s2","text":"小安带着一把伞走过来，对小哲说：“我家就在对面，这把伞先借给你。”"},{"id":"s3","text":"小哲接过伞以后，把它撑开，并邀请没有带伞的小雨一起走到公交站。"},{"id":"s4","text":"小安留在校门内等家长，门卫把门边的几个纸箱搬到屋檐下面。"},{"id":"s5","text":"到了公交站，小哲把练习本装好，再把借来的伞收拢，免得碰到旁边等车的人。"},{"id":"s6","text":"三个人都没有把伞送给别人，这把伞明天还要归还给原来的主人。"}],"question":"“把它撑开”中的“它”指什么？这件物品原来的主人是谁？","targets":[{"label":"去公交站的同伴","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"门卫"},{"id":"o1","text":"小雨"},{"id":"o2","text":"小安"}],"answer":"o1","explanation":"小哲邀请小雨同行，但题目没有问同伴。","id":"p1"}],"id":"t3"},{"label":"“把它撑开”的“它”","needed":true,"steps":[{"kind":"single","prompt":"选择物品。","options":[{"id":"o0","text":"练习本"},{"id":"o1","text":"书包"},{"id":"o2","text":"伞"}],"answer":"o2","explanation":"小哲接过伞后撑开，能被撑开的是刚接到的伞。","id":"p1"}],"id":"t1"},{"label":"这件物品原来的主人","needed":true,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小安"},{"id":"o1","text":"小哲"},{"id":"o2","text":"小雨"}],"answer":"o0","explanation":"小安带来的伞借给小哲，主人仍是小安。","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3"]},"taskSpans":["“它”指什么","原来的主人是谁"],"tokens":[{"id":"w1","sid":"s2","start":6,"end":7,"text":"伞","kind":"noun"},{"id":"w2","sid":"s3","start":9,"end":10,"text":"它","kind":"pronoun"},{"id":"w3","sid":"s2","start":0,"end":2,"text":"小安","kind":"noun"},{"id":"w4","sid":"s2","start":17,"end":18,"text":"我","kind":"pronoun"},{"id":"w5","sid":"s2","start":26,"end":27,"text":"伞","kind":"noun"},{"id":"w6","sid":"s3","start":4,"end":5,"text":"伞","kind":"noun"},{"id":"w7","sid":"s3","start":19,"end":20,"text":"伞","kind":"noun"},{"id":"w8","sid":"s4","start":0,"end":2,"text":"小安","kind":"noun"},{"id":"w9","sid":"s5","start":20,"end":21,"text":"伞","kind":"noun"},{"id":"w10","sid":"s6","start":7,"end":8,"text":"伞","kind":"noun"},{"id":"w11","sid":"s6","start":15,"end":16,"text":"伞","kind":"noun"},{"id":"w12","sid":"s1","start":29,"end":31,"text":"书包","kind":"noun"},{"id":"w13","sid":"s1","start":10,"end":12,"text":"小哲","kind":"noun"},{"id":"w14","sid":"s1","start":7,"end":9,"text":"小雨","kind":"noun"},{"id":"w15","sid":"s1","start":14,"end":16,"text":"屋檐","kind":"noun"},{"id":"w16","sid":"s1","start":32,"end":35,"text":"练习本","kind":"noun"},{"id":"w17","sid":"s2","start":18,"end":19,"text":"家","kind":"noun"},{"id":"w18","sid":"s2","start":12,"end":14,"text":"小哲","kind":"noun"},{"id":"w19","sid":"s2","start":30,"end":31,"text":"你","kind":"pronoun"},{"id":"w20","sid":"s3","start":27,"end":30,"text":"公交站","kind":"noun"},{"id":"w21","sid":"s3","start":0,"end":2,"text":"小哲","kind":"noun"},{"id":"w22","sid":"s3","start":21,"end":23,"text":"小雨","kind":"noun"},{"id":"w23","sid":"s4","start":8,"end":9,"text":"家","kind":"noun"},{"id":"w24","sid":"s4","start":8,"end":10,"text":"家长","kind":"noun"},{"id":"w25","sid":"s4","start":23,"end":25,"text":"屋檐","kind":"noun"},{"id":"w26","sid":"s4","start":4,"end":6,"text":"校门","kind":"noun"},{"id":"w27","sid":"s4","start":19,"end":21,"text":"纸箱","kind":"noun"},{"id":"w28","sid":"s4","start":11,"end":13,"text":"门卫","kind":"noun"},{"id":"w29","sid":"s5","start":2,"end":5,"text":"公交站","kind":"noun"},{"id":"w30","sid":"s5","start":6,"end":8,"text":"小哲","kind":"noun"},{"id":"w31","sid":"s5","start":9,"end":12,"text":"练习本","kind":"noun"},{"id":"w32","sid":"s6","start":26,"end":28,"text":"主人","kind":"noun"}],"referenceEdges":[["w1","w2"],["w3","w4"]],"mode":"train","round":1,"blockId":"r1b3","level":1},{"id":"T12","title":"谁做了什么","domain":"reading","skills":["多问完整","跨句整合"],"passage":[{"id":"s1","text":"班级准备举办小展览，三个同学在午休时留下帮忙，其他人先到操场活动。"},{"id":"s2","text":"小木把展板上的照片按拍摄日期摆好，没有负责写展览说明。"},{"id":"s3","text":"小晴检查每张照片下面的文字，把写错的一个字擦掉后重新写好。"},{"id":"s4","text":"小禾负责把来参观的同学引到门口排队，没有参加照片和文字的整理。"},{"id":"s5","text":"门旁放着两个纸箱，箱里装着旧彩纸；窗台上的水杯被老师移到了讲台。"},{"id":"s6","text":"展览开始以后，三个人完成各自的工作，才一起看同学们带来的小作品。"}],"question":"小木、小晴和小禾分别负责什么？请分别回答。","targets":[{"label":"小木负责的工作","needed":true,"steps":[{"kind":"single","prompt":"选择工作。","options":[{"id":"o0","text":"整理照片顺序"},{"id":"o1","text":"修改说明文字"},{"id":"o2","text":"引导参观者排队"}],"answer":"o0","explanation":"小木按日期摆照片。","id":"p1"}],"id":"t1"},{"label":"小晴负责的工作","needed":true,"steps":[{"kind":"single","prompt":"选择工作。","options":[{"id":"o0","text":"引导排队"},{"id":"o1","text":"检查修改文字"},{"id":"o2","text":"搬纸箱"}],"answer":"o1","explanation":"小晴检查并修改照片下面的文字。","id":"p1"}],"id":"t2"},{"label":"小禾负责的工作","needed":true,"steps":[{"kind":"single","prompt":"选择工作。","options":[{"id":"o0","text":"写说明"},{"id":"o1","text":"整理照片"},{"id":"o2","text":"引导排队"}],"answer":"o2","explanation":"小禾引导来参观的同学排队。","id":"p1"}],"id":"t3"},{"label":"纸箱里装的物品","needed":false,"steps":[{"kind":"single","prompt":"选择物品。","options":[{"id":"o0","text":"旧彩纸"},{"id":"o1","text":"水杯"},{"id":"o2","text":"照片"}],"answer":"o0","explanation":"纸箱装旧彩纸，题目没有问。","id":"p1"}],"id":"t4"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3","s4"]},"taskSpans":["小木、小晴和小禾分别负责什么"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b3","level":1},{"id":"T13","title":"只找地点","domain":"reading","skills":["限定条件","信息筛选"],"passage":[{"id":"s1","text":"星期日的公园很热闹，小叶和爸爸沿着石板路慢慢走，树叶上还留着昨夜的雨水。"},{"id":"s2","text":"他们先在湖边看见几只白鹅，鹅一会儿低头喝水，一会儿拍打翅膀。"},{"id":"s3","text":"后来，小叶在竹林旁的长椅上停下来画画，爸爸就坐在另一端等他。"},{"id":"s4","text":"画纸上的天空很蓝，远处的山很绿，小叶还给长椅画上了长长的影子。"},{"id":"s5","text":"画完以后，他们才去公园门口买面包，随后坐公交车回家。"},{"id":"s6","text":"这篇记录写了好几个地方，但不是每一个地方都是小叶画画的地方。"}],"question":"选出小叶画画的地点。注意：要选地点，不是画面的特点。","targets":[{"label":"画面中天空的特点","needed":false,"steps":[{"kind":"single","prompt":"选择特点。","options":[{"id":"o0","text":"很蓝"},{"id":"o1","text":"很暗"},{"id":"o2","text":"很多星星"}],"answer":"o0","explanation":"天空很蓝，但题目要求的是地点。","id":"p1"}],"id":"t2"},{"label":"小叶画画的地点","needed":true,"steps":[{"kind":"single","prompt":"选择地点。","options":[{"id":"o0","text":"天空很蓝"},{"id":"o1","text":"竹林旁的长椅上"},{"id":"o2","text":"公园门口"},{"id":"o3","text":"湖里"}],"answer":"o1","explanation":"画画的动作发生在竹林旁的长椅上，天空很蓝是特点。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s3"]},"taskSpans":["小叶画画的地点","要选地点"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b3","level":1},{"id":"T14","title":"换一个也合适的标题","domain":"reading","skills":["整体概括","题意等价"],"passage":[{"id":"s1","text":"小松鼠家门前的路被大风吹落的树枝挡住了，路旁的花却还开得很鲜艳。"},{"id":"s2","text":"小松鼠试着搬一根粗树枝，怎么用力也搬不动，便去找邻居帮忙。"},{"id":"s3","text":"小兔捡走细树枝，小熊搬动粗树枝，小松鼠把碎叶扫到一起。"},{"id":"s4","text":"它们分工合作，没过多久就清理出一条能让大家安全通过的小路。"},{"id":"s5","text":"路通了以后，三位朋友检查有没有尖树枝留在地上，然后把工具放回家里。"},{"id":"s6","text":"傍晚，小松鼠又去给花浇水，这件小事发生在清理道路之后。"}],"question":"选出所有能概括故事主要事件、又没有添加原文没有发生的事情的标题。","targets":[{"label":"能概括主要事件的所有标题","needed":true,"steps":[{"kind":"multi","prompt":"标题可以有不止一个。","options":[{"id":"o0","text":"花朵的颜色"},{"id":"o1","text":"小松鼠独自搬走所有树枝"},{"id":"o2","text":"朋友们合作清理小路"},{"id":"o3","text":"一起让小路重新通畅"}],"answer":["o2","o3"],"explanation":"主要事件是伙伴分工清路；并不是小松鼠独自完成，花朵也不是主要内容。","id":"p1"}],"id":"t1"},{"label":"故事最后的小事","needed":false,"steps":[{"kind":"single","prompt":"选择小事。","options":[{"id":"o0","text":"浇花"},{"id":"o1","text":"造新房"},{"id":"o2","text":"去游泳"}],"answer":"o0","explanation":"最后浇花不是整篇主要事件。","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出介绍道路遇到的问题，以及朋友们怎样解决它的句子。","answers":[["s1","s2","s3","s4","s5"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":["所有能概括故事主要事件","没有添加原文没有发生的事情"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b3","level":1},{"id":"T15","title":"收回来的彩笔","domain":"math","skills":["跨句整合","多步推理"],"passage":[{"id":"s1","text":"美术课前，老师把彩笔盒放在讲台上，盒子外面画着太阳和一朵白云。"},{"id":"s2","text":"盒里原有二十四支彩笔，老师先借给第一组六支，再借给第二组四支。"},{"id":"s3","text":"第三组自带了彩笔，所以没有从这个盒子里取走任何彩笔。"},{"id":"s4","text":"画完画后，第一组先还回两支，第二组暂时还没有归还。"},{"id":"s5","text":"这时老师检查盒里剩下的彩笔，之后发生的归还不计入本题。"},{"id":"s6","text":"桌上还有三把尺子和一盒彩纸，这些物品都没有放进彩笔盒。"}],"question":"老师检查时，盒里有多少支彩笔？请把先借出、后还回的步骤都写出来。","targets":[{"label":"第一组一开始借走的彩笔数","needed":false,"steps":[{"kind":"number","prompt":"填写支数。","answer":6,"explanation":"第一组借6支，但题目问检查时盒里有多少。","id":"p1"}],"id":"t2"},{"label":"检查时盒里的彩笔数","needed":true,"steps":[{"kind":"number","prompt":"第一步：两组一共借走几支？","answer":10,"explanation":"借给两组6支和4支。","calc":"6+4","id":"p1"},{"kind":"number","prompt":"第二步：借出后，归还前，盒里还剩几支？","answer":14,"explanation":"原有24支，借走10支。","calc":"24-(6+4)","id":"p2"},{"kind":"number","prompt":"第三步：第一组还回2支后，盒里有几支？","answer":16,"explanation":"14支加上还回的2支。","calc":"24-6-4+2","id":"p3"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3","s4","s5"]},"taskSpans":["检查时","盒里有多少支彩笔"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b3","level":1},{"id":"T16","title":"纸船送给谁","domain":"math","skills":["多问完整","信息筛选"],"passage":[{"id":"s1","text":"手工课上，小叶和小安分别折了一些纸船，桌上放着蓝色和黄色的彩纸。"},{"id":"s2","text":"小叶一共折了九只纸船，送给妹妹三只，其余留给自己。"},{"id":"s3","text":"小安一共折了八只纸船，送给弟弟两只，其余也留给自己。"},{"id":"s4","text":"两个人没有互相交换纸船，老师也没有另外给他们纸船。"},{"id":"s5","text":"窗台上原来摆着四只旧纸船，那是上周的作品，不属于他们今天折的纸船。"},{"id":"s6","text":"下课后，他们各自把今天留下的纸船装进自己的盒子，再把桌面清理干净。"}],"question":"小叶和小安今天分别留下了多少只纸船？","targets":[{"label":"小叶留下的纸船数","needed":true,"steps":[{"kind":"number","prompt":"填写只数。","answer":6,"explanation":"小叶折9只送3只。","calc":"9-3","id":"p1"}],"id":"t1"},{"label":"窗台上的旧纸船数","needed":false,"steps":[{"kind":"number","prompt":"填写只数。","answer":4,"explanation":"旧纸船4只，与今天的数量无关。","id":"p1"}],"id":"t3"},{"label":"小安留下的纸船数","needed":true,"steps":[{"kind":"number","prompt":"填写只数。","answer":6,"explanation":"小安折8只送2只。","calc":"8-2","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3","s4"]},"taskSpans":["小叶和小安今天分别留下了多少只纸船"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b3","level":1},{"id":"T17","title":"没买的也要算吗","domain":"math","skills":["反向审题","计划实际"],"passage":[{"id":"s1","text":"小禾带着二十五元去买点心，店门口的招牌上画着一只正在烤面包的小熊。"},{"id":"s2","text":"她原本打算买两个面包，每个面包四元，再买一杯六元的牛奶。"},{"id":"s3","text":"到了柜台，她只买了两个面包，没有买牛奶，也没有买其他东西。"},{"id":"s4","text":"付款时没有优惠，也没有额外收费，剩下的钱都装回口袋。"},{"id":"s5","text":"隔壁柜台有九元的饼干，旁边还摆着装饰用的小木盘和三张卡片。"},{"id":"s6","text":"小禾拿着点心回家，把自己的实际花费写进了记录本。"}],"question":"选出所有错误的说法，只按小禾实际购买的情况判断。","targets":[{"label":"实际剩余的钱","needed":false,"steps":[{"kind":"number","prompt":"填写元数。","answer":17,"explanation":"25-4×2=17。","calc":"25-4*2","id":"p1"}],"id":"t2"},{"label":"关于实际购买情况的所有错误说法","needed":true,"steps":[{"kind":"multi","prompt":"多选：找错误。","options":[{"id":"o0","text":"小禾实际花了十四元。"},{"id":"o1","text":"小禾实际花了八元。"},{"id":"o2","text":"小禾还剩十七元。"},{"id":"o3","text":"小禾买了一杯牛奶。"}],"answer":["o0","o3"],"explanation":"实际只买两个4元的面包，花8元，剩17元；14元算进了没买的牛奶。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s4"]},"taskSpans":["所有错误的说法","实际购买的情况"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b3","level":1},{"id":"T18","title":"哪句话仍在问原来的事","domain":"math","skills":["题意等价","条件范围"],"passage":[{"id":"s1","text":"小林收集动物卡片，把卡片整齐地放在一个绿色铁盒里，盒盖画着一只小老虎。"},{"id":"s2","text":"他的盒里有十二张卡，其中五张画着鸟，其余都画着鱼，没有其他种类。"},{"id":"s3","text":"他没有把任何卡片送人，也没有在今天收到新卡，盒里的数量一直没有变化。"},{"id":"s4","text":"朋友带来一个新相册，邀请他把卡片放进去，但他决定明天再整理。"},{"id":"s5","text":"本来的问题是：盒里画着鱼的卡片有多少张？"},{"id":"s6","text":"接下来只比较问题的意思，不需要填写算出来的张数。"}],"question":"选出所有与本来的问题意思相同的问法。","targets":[{"label":"与原问题同义的所有问法","needed":true,"steps":[{"kind":"multi","prompt":"选择问同一部分卡片的问法。","options":[{"id":"o0","text":"盒里一共有多少张动物卡？"},{"id":"o1","text":"除去画鸟的卡，盒里还剩多少张卡？"},{"id":"o2","text":"十二张卡中，有多少张画的是鱼？"},{"id":"o3","text":"画鸟的卡有多少张？"}],"answer":["o1","o2"],"explanation":"文中只有鸟和鱼两类，因此除去鸟剩下的就是鱼。","id":"p1"}],"id":"t1"},{"label":"鱼卡的数量","needed":false,"steps":[{"kind":"number","prompt":"填写张数。","answer":7,"explanation":"12-5=7，但本题不要求计算。","calc":"12-5","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s5"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s5"]},"taskSpans":["所有与本来的问题意思相同的问法"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b3","level":1},{"id":"T19","title":"开门的两项条件","domain":"reasoning","skills":["逻辑条件","反向审题"],"passage":[{"id":"s1","text":"小队要借用活动室，老师把使用规则写在门旁，下面还贴了一幅花园的画。"},{"id":"s2","text":"规则说：只有预约成功，并且有老师陪同，才可以进入活动室，两项缺一不可。"},{"id":"s3","text":"甲组已经预约成功，但陪同老师还没到；乙组没有预约，老师已经到场。"},{"id":"s4","text":"丙组预约成功，陪同老师也已经到场，正在门口等待工作人员开门。"},{"id":"s5","text":"三组都带了作品，有的作品很大，有的外面包着彩纸，但这些不影响进门条件。"},{"id":"s6","text":"题目只按上面的使用规则判断，不考虑后来可能发生的变化。"}],"question":"选出所有现在还不符合进入活动室条件的小组。","targets":[{"label":"现在符合条件的小组","needed":false,"steps":[{"kind":"single","prompt":"选择小组。","options":[{"id":"o0","text":"甲组"},{"id":"o1","text":"丙组"},{"id":"o2","text":"乙组"}],"answer":"o1","explanation":"丙符合，但题目要求不符合的小组。","id":"p1"}],"id":"t2"},{"label":"现在不符合进门条件的所有小组","needed":true,"steps":[{"kind":"multi","prompt":"多选：找不符合的。","options":[{"id":"o0","text":"甲组"},{"id":"o1","text":"乙组"},{"id":"o2","text":"丙组"}],"answer":["o0","o1"],"explanation":"甲缺老师，乙缺预约；丙两项都有。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3","s4"]},"taskSpans":["现在还不符合","所有","小组"],"tokens":[],"referenceEdges":[],"mode":"train","round":1,"blockId":"r1b3","level":1},{"id":"T20","title":"四季水果卡","domain":"reasoning","skills":["多步推理","常识应用","多问完整"],"passage":[{"id":"s1","text":"木偶人要做一套四季水果卡，桌上摆着胶水、彩纸和一盒彩笔，旁边还有一个空相框。"},{"id":"s2","text":"它说：“一年有几个季节，我就准备几张卡，每个季节一张，卡不能重复使用。”"},{"id":"s3","text":"它已经做好春天卡和夏天卡，秋天卡、冬天卡还没有开始做。"},{"id":"s4","text":"每张卡只贴一张水果图片，图片长什么样不影响卡的数量，也不用判断水果的产季。"},{"id":"s5","text":"木偶人做完卡后才打算装饰相框，因此暂时不用计算相框或彩纸的数量。"},{"id":"s6","text":"题目只按通常说的春、夏、秋、冬四个季节来安排。"}],"question":"这套卡一共需要几张，还要再做几张？","targets":[{"label":"还要再做的卡片数","needed":true,"steps":[{"kind":"number","prompt":"第一步：春天卡和夏天卡合起来，已经做好几张？","answer":2,"explanation":"已经做好两张。","id":"p1"},{"kind":"number","prompt":"第二步：还要做几张？","answer":2,"explanation":"共需4张，做好2张。","calc":"4-2","i ,"s3","s4"]},"taskSpans":["为什么迟到","到教室后先做了什么"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b1","level":2},{"id":"T22","title":"纸盒和布袋","domain":"reading","skills":["指代追踪","跨句整合"],"passage":[{"id":"s1","text":"整理活动室时，小雨找到一个小纸盒，又从柜子里拿出一个布袋，准备分类收好物品。"},{"id":"s2","text":"小雨把玻璃球放进纸盒，把积木装进布袋，然后把两个容器放在同一张桌上。"},{"id":"s3","text":"小宁觉得纸盒容易被碰倒，就把它移到了书柜的第二层。"},{"id":"s4","text":"小雨拿起装着积木的布袋，把它挂在门后的挂钩上，没有再移动纸盒。"},{"id":"s5","text":"门旁还有一把扫帚和一个空水桶，小宁把地上散落的纸屑扫干净。"},{"id":"s6","text":"整理结束时，两个人一起检查窗户，确认关好以后才离开活动室。"}],"question":"“把它移到了书柜”与“把它挂在门后”中的两个“它”，分别指什么？","targets":[{"label":"纸盒里装的物品","needed":false,"steps":[{"kind":"single","prompt":"选择物品。","options":[{"id":"o0","text":"积木"},{"id":"o1","text":"玻璃球"},{"id":"o2","text":"纸屑"}],"answer":"o1","explanation":"纸盒装玻璃球，但本题问代词。","id":"p1"}],"id":"t3"},{"label":"“把它挂在门后”中的“它”","needed":true,"steps":[{"kind":"single","prompt":"选择物品。","options":[{"id":"o0","text":"布袋"},{"id":"o1","text":"纸盒"},{"id":"o2","text":"扫帚"}],"answer":"o0","explanation":"小雨检查布袋后把布袋挂起；纸盒没有再移动。","id":"p1"}],"id":"t2"},{"label":"“把它移到了书柜”中的“它”","needed":true,"steps":[{"kind":"single","prompt":"选择物品。","options":[{"id":"o0","text":"布袋"},{"id":"o1","text":"纸盒"},{"id":"o2","text":"水桶"}],"answer":"o1","explanation":"小宁觉得纸盒易倒，所以移动纸盒。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s3","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3","s4"]},"taskSpans":["两个“它”","分别指什么"],"tokens":[{"id":"w1","sid":"s3","start":4,"end":6,"text":"纸盒","kind":"noun"},{"id":"w2","sid":"s3","start":14,"end":15,"text":"它","kind":"pronoun"},{"id":"w3","sid":"s4","start":9,"end":11,"text":"布袋","kind":"noun"},{"id":"w4","sid":"s4","start":13,"end":14,"text":"它","kind":"pronoun"},{"id":"w5","sid":"s1","start":14,"end":16,"text":"纸盒","kind":"noun"},{"id":"w6","sid":"s1","start":26,"end":28,"text":"布袋","kind":"noun"},{"id":"w7","sid":"s2","start":8,"end":10,"text":"纸盒","kind":"noun"},{"id":"w8","sid":"s2","start":16,"end":18,"text":"布袋","kind":"noun"},{"id":"w9","sid":"s4","start":28,"end":30,"text":"纸盒","kind":"noun"},{"id":"w10","sid":"s1","start":19,"end":21,"text":"柜子","kind":"noun"},{"id":"w11","sid":"s1","start":2,"end":5,"text":"活动室","kind":"noun"},{"id":"w12","sid":"s1","start":35,"end":37,"text":"物品","kind":"noun"},{"id":"w13","sid":"s2","start":24,"end":26,"text":"容器","kind":"noun"},{"id":"w14","sid":"s2","start":31,"end":32,"text":"桌","kind":"noun"},{"id":"w15","sid":"s2","start":3,"end":6,"text":"玻璃球","kind":"noun"},{"id":"w16","sid":"s2","start":12,"end":14,"text":"积木","kind":"noun"},{"id":"w17","sid":"s3","start":18,"end":20,"text":"书柜","kind":"noun"},{"id":"w18","sid":"s4","start":19,"end":21,"text":"挂钩","kind":"noun"},{"id":"w19","sid":"s4","start":6,"end":8,"text":"积木","kind":"noun"},{"id":"w20","sid":"s5","start":6,"end":8,"text":"扫帚","kind":"noun"},{"id":"w21","sid":"s5","start":12,"end":14,"text":"水桶","kind":"noun"},{"id":"w22","sid":"s5","start":23,"end":25,"text":"纸屑","kind":"noun"},{"id":"w23","sid":"s6","start":6,"end":9,"text":"两个人","kind":"noun"},{"id":"w24","sid":"s6","start":25,"end":28,"text":"活动室","kind":"noun"},{"id":"w25","sid":"s6","start":13,"end":15,"text":"窗户","kind":"noun"}],"referenceEdges":[["w1","w2"],["w3","w4"]],"mode":"train","round":2,"blockId":"r2b1","level":2},{"id":"T23","title":"节目单上的变化","domain":"reading","skills":["反向审题","限定条件"],"passage":[{"id":"s1","text":"班级联欢会的节目单最初写着：先合唱，再讲故事，最后进行手工展示。"},{"id":"s2","text":"正式开始前，负责讲故事的同学嗓子不舒服，老师决定取消讲故事，其他节目的相对顺序不变。"},{"id":"s3","text":"合唱结束后，同学们直接开始手工展示，展示完就收拾教室，没有临时增加节目。"},{"id":"s4","text":"桌上有三束纸花，黑板上画着气球，讲台旁还摆着一个装道具的箱子。"},{"id":"s5","text":"小晴负责播放合唱音乐，小木负责在展示时举起作品，让后面的同学也能看清。"},{"id":"s6","text":"大家离开前把纸花收好，准备下周再用这些材料布置阅读角。"}],"question":"选出所有与实际演出情况不符的说法。一个选项的前后两部分都要看。","targets":[{"label":"原节目单的最后一项","needed":false,"steps":[{"kind":"single","prompt":"选择节目。","options":[{"id":"o0","text":"合唱"},{"id":"o1","text":"讲故事"},{"id":"o2","text":"手工展示"}],"answer":"o2","explanation":"原计划最后也是手工展示，但题目要求判断实际情况。","id":"p1"}],"id":"t2"},{"label":"与实际演出不符的所有说法","needed":true,"steps":[{"kind":"multi","prompt":"多选：找不符。","options":[{"id":"o0","text":"最先合唱，合唱后讲故事。"},{"id":"o1","text":"讲故事被取消了。"},{"id":"o2","text":"手工展示结束后又增加了舞蹈。"},{"id":"o3","text":"手工展示在合唱之后。"}],"answer":["o0","o2"],"explanation":"第一项前半正确、后半错误；故事取消，展示后也没有新增节目。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3"]},"taskSpans":["所有与实际演出情况不符的说法"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b1","level":2},{"id":"T24","title":"让大家看得见","domain":"reading","skills":["整体概括","因果理解"],"passage":[{"id":"s1","text":"班级准备展出同学们的绘画，最初把所有作品都挂在一块很高的展板上。"},{"id":"s2","text":"小叶发现，个子矮的同学只能看清最下面几张，于是把这个问题告诉了老师。"},{"id":"s3","text":"大家重新布置，把作品分到两块较低的展板上，并留出足够的走道。"},{"id":"s4","text":"他们还请几位个子不同的同学来试着观看，根据意见又调整了几张画的位置。"},{"id":"s5","text":"布置好以后，原来踮着脚的同学也能看清画面，大家不用挤在一起了。"},{"id":"s6","text":"门口的风铃被风吹得叮当响，墙边的花盆里长出了几片嫩叶。"}],"question":"哪一项最完整地概括了这段故事？","targets":[{"label":"门口发出声音的物品","needed":false,"steps":[{"kind":"single","prompt":"选择物品。","options":[{"id":"o0","text":"闹钟"},{"id":"o1","text":"风铃"},{"id":"o2","text":"小鼓"}],"answer":"o1","explanation":"风铃是环境细节，不是主要事件。","id":"p1"}],"id":"t2"},{"label":"最完整的内容概括","needed":true,"steps":[{"kind":"single","prompt":"选择最合适的一项。","options":[{"id":"o0","text":"同学们只是在画风铃和嫩叶。"},{"id":"o1","text":"大家发现展览不便观看，重新布置并检查，让更多同学看清作品。"},{"id":"o2","text":"小叶一个人画了所有作品。"},{"id":"o3","text":"老师把所有作品都收走了。"}],"answer":"o1","explanation":"主要内容包含问题、调整过程和结果；不能只抓环境细节或添加不存在的情节。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出说明“原来的问题、采取的办法、最后结果”的句子。","answers":[["s1","s2","s3","s4","s5"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":["最完整地概括"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b1","level":2},{"id":"T25","title":"彩带分两次使用","domain":"math","skills":["多步推理","多问完整"],"passage":[{"id":"s1","text":"小组准备装饰展示墙，老师拿来一条二十米长的彩带，彩带中间没有接头。"},{"id":"s2","text":"上午先剪去六米做门边装饰，下午又从剩下的部分剪去四米装饰展板。"},{"id":"s3","text":"剪下的彩带都用掉了，没有接回原来的彩带，也没有另外领到新彩带。"},{"id":"s4","text":"同学们还在展板上贴了五朵纸花，纸花大小不同，但它们不影响彩带的长度。"},{"id":"s5","text":"老师让大家收好最后剩余的整段彩带，留到下次活动再用。"},{"id":"s6","text":"收拾完毕，小组把剪刀放回盒子，并把桌上的碎纸扫进垃圾桶。"}],"question":"两次一共用了多少米彩带，最后剩下多少米？","targets":[{"label":"两次共用的彩带长度","needed":true,"steps":[{"kind":"number","prompt":"填写米数。","answer":10,"explanation":"6米加4米。","calc":"6+4","id":"p1"}],"id":"t1"},{"label":"最后剩余的彩带长度","needed":true,"steps":[{"kind":"number","prompt":"第一步：上午剪去后还剩多少米？","answer":14,"explanation":"20-6=14。","calc":"20-6","id":"p1"},{"kind":"number","prompt":"第二步：下午再剪去后，还剩多少米？","answer":10,"explanation":"14-4=10。","calc":"20-6-4","id":"p2"}],"id":"t2"},{"label":"展板上的纸花数","needed":false,"steps":[{"kind":"number","prompt":"填写朵数。","answer":5,"explanation":"五朵纸花不影响彩带长度。","id":"p1"}],"id":"t3"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3"]},"taskSpans":["一共用了多少米彩带","最后剩下多少米"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b1","level":2},{"id":"T26","title":"借书登记表","domain":"math","skills":["题意识别","限定条件"],"passage":[{"id":"s1","text":"周一，图书管理员把借书登记表放在桌上，提醒同学们借书时写清班级和姓名。"},{"id":"s2","text":"早晨书架上有三十本漫画书，午间借出七本，下午又借出五本。"},{"id":"s3","text":"放学前，有同学还回四本漫画书，管理员把它们放回原来的书架。"},{"id":"s4","text":"管理员另外清理出六本旧杂志，但杂志没有放进漫画书书架，也不算漫画书。"},{"id":"s5","text":"登记表旁边放着一支黑色钢笔，桌角贴着图书角开放时间。"},{"id":"s6","text":"本题只询问下午借书之前、午间那次借书之后的情况，不算更晚的变化。"}],"question":"午间借出七本后，下午还没有开始借书时，书架上有多少本漫画书？","targets":[{"label":"放学归还后的漫画书数","needed":false,"steps":[{"kind":"number","prompt":"填写本数。","answer":22,"explanation":"30-7-5+4=22，但不是题目指定时刻。","calc":"30-7-5+4","id":"p1"}],"id":"t2"},{"label":"午间借出后、下午借出前的漫画书数","needed":true,"steps":[{"kind":"number","prompt":"填写本数。","answer":23,"explanation":"只算30-7，下午借出和放学归还尚未发生。","calc":"30-7","id":"p1"}],"id":"t1"},{"label":"下午借出的漫画书数","needed":false,"steps":[{"kind":"number","prompt":"填写本数。","answer":5,"explanation":"下午借5本，题目问的是此前书架上的数量。","id":"p1"}],"id":"t3"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s6"]},"taskSpans":["午间借出七本后","下午还没有开始借书时"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b1","level":2},{"id":"T27","title":"“相差”怎么问","domain":"math","skills":["题意等价","数量关系"],"passage":[{"id":"s1","text":"校园收集旧纸活动中，小木交来十五张旧报纸，小晴交来九张旧报纸。"},{"id":"s2","text":"这些纸都是同样大小，老师只比较张数，不比较重量，也不把其他同学的纸算进来。"},{"id":"s3","text":"小木把报纸装在蓝袋子里，小晴用绳子捆好，两个人同时来到登记桌前。"},{"id":"s4","text":"桌上还有几张宣传画，宣传画是老师的，不属于这两位同学交来的旧报纸。"},{"id":"s5","text":"原题问：小木比小晴多交了多少张旧报纸？"},{"id":"s6","text":"这次不用计算，只要判断不同的说法有没有改变原来要比较的内容。"}],"question":"选出所有与原题意思相同的问法。","targets":[{"label":"与比较差量相同的所有问法","needed":true,"steps":[{"kind":"multi","prompt":"选出问同一个差量的问题。","options":[{"id":"o0","text":"小晴比小木少交多少张？"},{"id":"o1","text":"两人一共交了多少张？"},{"id":"o2","text":"小木和小晴交来的张数相差多少？"},{"id":"o3","text":"小木交来的张数是几张？"}],"answer":["o0","o2"],"explanation":"“甲比乙多多少”和“乙比甲少多少”都问同一差量，合计和单人数量不是。","id":"p1"}],"id":"t1"},{"label":"两人交来的总张数","needed":false,"steps":[{"kind":"number","prompt":"填写张数。","answer":24,"explanation":"15+9=24，不是原题问的差量。","calc":"15+9","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s5"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s5"]},"taskSpans":["所有与原题意思相同的问法"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b1","level":2},{"id":"T28","title":"不是数字一样就相同","domain":"math","skills":["结构等价","信息筛选"],"passage":[{"id":"s1","text":"手工比赛中，小安做了十四朵纸花，小禾做了八朵纸花，两人把作品放在不同的托盘里。"},{"id":"s2","text":"老师只问小安比小禾多做了多少朵，没有要求计算两个人总共做了多少朵。"},{"id":"s3","text":"托盘有红色和黄色两种，纸花的颜色很多，有的中间还贴着小圆点。"},{"id":"s4","text":"比赛后同学们把纸花放到窗边，但这次整理没有增加或减少纸花的数量。"},{"id":"s5","text":"比较下面的问题时，不必计算答案，要看是不是比较两个人各自的数量、询问相差多少。"},{"id":"s6","text":"某个问题即使算出的数字碰巧一样，也不一定与原题有相同的关系结构。"}],"question":"选出所有同样在比较“两方各有多少，并问相差多少”的问题。","targets":[{"label":"原题两人相差的纸花数","needed":false,"steps":[{"kind":"number","prompt":"填写朵数。","answer":6,"explanation":"14-8=6，但本题要选结构。","calc":"14-8","id":"p1"}],"id":"t2"},{"label":"比较两方差量的所有问题","needed":true,"steps":[{"kind":"multi","prompt":"多选：比较结构。","options":[{"id":"o0","text":"小雨有11颗珠子，小叶有7颗，小雨比小叶多几颗？"},{"id":"o1","text":"盒里有11颗珠子，拿走7颗，还剩几颗？"},{"id":"o2","text":"甲队得9分，乙队得6分，两队相差几分？"},{"id":"o3","text":"每袋装3颗珠子，4袋共有几颗？"}],"answer":["o0","o2"],"explanation":"第一和第三项比较两个对象的数量差；第二项是一份数量减少，第四项是等量累加。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s5"]},"taskSpans":["所有同样在比较","并问相差多少"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b1","level":2},{"id":"T29","title":"包裹最后在哪里","domain":"reasoning","skills":["多步推理","跨句整合"],"passage":[{"id":"s1","text":"班级收到一个装着种子的包裹，小林先把它放在讲台上，包裹外面写着科学课材料。"},{"id":"s2","text":"老师要用讲台做实验，请小林把包裹移到靠窗的书柜里，小林照做了。"},{"id":"s3","text":"午休前，小晴从靠窗的书柜取出这个包裹，交给了在门口等候的科学老师。"},{"id":"s4","text":"科学老师把包裹带到实验室，放在门边的储物架上，之后没有再移动。"},{"id":"s5","text":"讲台上仍放着几个烧杯，窗台上还有一盆小草，走廊里传来同学排队的声音。"},{"id":"s6","text":"题目只追踪这个装种子的包裹，不把其他盒子或实验器材算进去。"}],"question":"包裹从讲台离开后，先移到哪里，最后又放在哪里？","targets":[{"label":"包裹最早放的位置","needed":false,"steps":[{"kind":"single","prompt":"选择位置。","options":[{"id":"o0","text":"讲台"},{"id":"o1","text":"书包"},{"id":"o2","text":"楼梯"}],"answer":"o0","explanation":"最早是讲台，但第一小问问离开讲台后的位置。","id":"p1"}],"id":"t3"},{"label":"包裹最后放的位置","needed":true,"steps":[{"kind":"single","prompt":"第一步：从书柜取出后交给谁？","options":[{"id":"o0","text":"小林"},{"id":"o1","text":"科学老师"},{"id":"o2","text":"门卫"}],"answer":"o1","explanation":"小晴从书柜取出后交给科学老师。","id":"p1"},{"kind":"single","prompt":"第二步：这位老师最后把包裹放在哪里？","options":[{"id":"o0","text":"教室讲台"},{"id":"o1","text":"校门口"},{"id":"o2","text":"实验室门边的储物架"}],"answer":"o2","explanation":"科学老师带进实验室，放在门边储物架。","id":"p2"}],"id":"t2"},{"label":"离开讲台后先放的位置","needed":true,"steps":[{"kind":"single","prompt":"选择位置。","options":[{"id":"o0","text":"门口地上"},{"id":"o1","text":"靠窗的书柜"},{"id":"o2","text":"实验台上"}],"answer":"o1","explanation":"老师先让小林把包裹移进靠窗书柜。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s4"]},"taskSpans":["先移到哪里","最后又放在哪里"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b1","level":2},{"id":"T30","title":"哪件事没有说清","domain":"reasoning","skills":["无法确定","时间关系"],"passage":[{"id":"s1","text":"三个小组去观察池塘，老师只记录每组离开教室和回到教室的时间，没有记录路线。"},{"id":"s2","text":"甲组八点出发，九点返回；乙组八点半出发，九点半返回；丙组九点出发，十点返回。"},{"id":"s3","text":"三个小组都带了记录本，但记录本的颜色没有写进这张表格。"},{"id":"s4","text":"甲组先出发不代表它走得最快，因为各组可能走不同的路线，途中也可能停下观察。"},{"id":"s5","text":"教室后面的柜子里放着望远镜，老师没有说明这次哪一组使用了它。"},{"id":"s6","text":"请只根据已经说清楚的事实判断，不把自己的猜测当成记录里的内容。"}],"question":"选出所有不能根据这段记录确定的事情。","targets":[{"label":"最早出发的小组","needed":false,"steps":[{"kind":"single","prompt":"选择小组。","options":[{"id":"o0","text":"乙组"},{"id":"o1","text":"丙组"},{"id":"o2","text":"甲组"}],"answer":"o2","explanation":"甲组8点最早出发，这是已知事实。","id":"p1"}],"id":"t2"},{"label":"记录不足以确定的所有事情","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"哪一组最早出发。"},{"id":"o1","text":"哪一组走路最快。"},{"id":"o2","text":"丙组几点返回。"},{"id":"o3","text":"哪一组使用了望远镜。"}],"answer":["o1","o3"],"explanation":"时间能确定最早出发与丙返回时刻；速度需要路线等信息，望远镜使用情况也没说。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s4","s5"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s4","s5"]},"taskSpans":["所有不能根据这段记录确定的事情"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b1","level":2},{"id":"T31","title":"“我”是谁说的","domain":"reading","skills":["指代追踪","多问完整"],"passage":[{"id":"s1","text":"准备表演时，小禾找不到自己的帽子，便向旁边的小木询问，舞台后面有些拥挤。"},{"id":"s2","text":"小木对小禾说：“我看到你的帽子放在蓝椅子上，你先去那里找找。”"},{"id":"s3","text":"小禾走到蓝椅子旁，果然找到帽子，就对小木说：“谢谢你，我现在可以上台了。”"},{"id":"s4","text":"老师正在另一边整理音乐，没有参加这段对话，也没有替他们拿帽子。"},{"id":"s5","text":"幕布旁还有一张红椅子，椅子上放着几条围巾，那些围巾是下一个节目的道具。"},{"id":"s6","text":"两个人说完话，便按老师原先安排的位置站好，等候音乐开始。"}],"question":"“我看到你的帽子”中的“我”，以及“我现在可以上台了”中的“我”，分别是谁？","targets":[{"label":"“我现在可以上台了”中的“我”","needed":true,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"老师"},{"id":"o1","text":"小禾"},{"id":"o2","text":"小木"}],"answer":"o1","explanation":"第二句话由小禾说，因此我指小禾。","id":"p1"}],"id":"t2"},{"label":"“我看到你的帽子”中的“我”","needed":true,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小禾"},{"id":"o1","text":"老师"},{"id":"o2","text":"小木"}],"answer":"o2","explanation":"第一句话由小木说，因此我指小木。","id":"p1"}],"id":"t1"},{"label":"帽子所在的椅子颜色","needed":false,"steps":[{"kind":"single","prompt":"选择颜色。","options":[{"id":"o0","text":"蓝色"},{"id":"o1","text":"红色"},{"id":"o2","text":"绿色"}],"answer":"o0","explanation":"帽子在蓝椅子上，但题目问两个我的所指。","id":"p1"}],"id":"t3"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3"]},"taskSpans":["“我看到你的帽子”中的“我”","“我现在可以上台了”中的“我”"],"tokens":[{"id":"w1","sid":"s2","start":0,"end":2,"text":"小木","kind":"noun"},{"id":"w2","sid":"s2","start":8,"end":9,"text":"我","kind":"pronoun"},{"id":"w3","sid":"s3","start":0,"end":2,"text":"小禾","kind":"noun"},{"id":"w4","sid":"s3","start":27,"end":28,"text":"我","kind":"pronoun"},{"id":"w5","sid":"s1","start":6,"end":8,"text":"小禾","kind":"noun"},{"id":"w6","sid":"s1","start":22,"end":24,"text":"小木","kind":"noun"},{"id":"w7","sid":"s2","start":3,"end":5,"text":"小禾","kind":"noun"},{"id":"w8","sid":"s3","start":18,"end":20,"text":"小木","kind":"noun"},{"id":"w9","sid":"s1","start":14,"end":16,"text":"帽子","kind":"noun"},{"id":"w10","sid":"s1","start":27,"end":29,"text":"舞台","kind":"noun"},{"id":"w11","sid":"s1","start":2,"end":4,"text":"表演","kind":"noun"},{"id":"w12","sid":"s1","start":11,"end":13,"text":"自己","kind":"pronoun"},{"id":"w13","sid":"s2","start":13,"end":15,"text":"帽子","kind":"noun"},{"id":"w14","sid":"s2","start":18,"end":20,"text":"椅子","kind":"noun"},{"id":"w15","sid":"s2","start":25,"end":27,"text":"那里","kind":"pronoun"},{"id":"w16","sid":"s2","start":11,"end":12,"text":"你","kind":"pronoun"},{"id":"w17","sid":"s2","start":22,"end":23,"text":"你","kind":"pronoun"},{"id":"w18","sid":"s3","start":13,"end":15,"text":"帽子","kind":"noun"},{"id":"w19","sid":"s3","start":5,"end":7,"text":"椅子","kind":"noun"},{"id":"w20","sid":"s3","start":25,"end":26,"text":"你","kind":"pronoun"},{"id":"w21","sid":"s4","start":28,"end":30,"text":"帽子","kind":"noun"},{"id":"w22","sid":"s4","start":0,"end":2,"text":"老师","kind":"noun"},{"id":"w23","sid":"s4","start":9,"end":11,"text":"音乐","kind":"noun"},{"id":"w24","sid":"s4","start":25,"end":27,"text":"他们","kind":"pronoun"},{"id":"w25","sid":"s4","start":25,"end":26,"text":"他","kind":"pronoun"},{"id":"w26","sid":"s5","start":18,"end":20,"text":"围巾","kind":"noun"},{"id":"w27","sid":"s5","start":23,"end":25,"text":"围巾","kind":"noun"},{"id":"w28","sid":"s5","start":0,"end":2,"text":"幕布","kind":"noun"},{"id":"w29","sid":"s5","start":8,"end":10,"text":"椅子","kind":"noun"},{"id":"w30","sid":"s5","start":11,"end":13,"text":"椅子","kind":"noun"},{"id":"w31","sid":"s5","start":29,"end":31,"text":"节目","kind":"noun"},{"id":"w32","sid":"s5","start":32,"end":34,"text":"道具","kind":"noun"},{"id":"w33","sid":"s6","start":16,"end":18,"text":"位置","kind":"noun"},{"id":"w34","sid":"s6","start":9,"end":11,"text":"老师","kind":"noun"},{"id":"w35","sid":"s6","start":23,"end":25,"text":"音乐","kind":"noun"}],"referenceEdges":[["w1","w2"],["w3","w4"]],"mode":"train","round":2,"blockId":"r2b3","level":2},{"id":"T32","title":"物品和理由都要答","domain":"reading","skills":["多问完整","任务拆解"],"passage":[{"id":"s1","text":"班级要做观察记录，小安和小雨各自从材料桌上选一件工具，桌边还有许多彩色卡纸。"},{"id":"s2","text":"小安选择放大镜，因为他想看清叶片表面的细纹，而不是测量叶片长度。"},{"id":"s3","text":"小雨选择直尺，因为她想量一量叶片有多长，并把长度写在记录本上。"},{"id":"s4","text":"桌上还有胶水、剪刀和一个空纸杯，但两个人都没有选择这些物品。"},{"id":"s5","text":"老师提醒他们不要伤害植物，观察结束后把工具擦干净，放回原来的盒子。"},{"id":"s6","text":"窗外正好飞来一只蝴蝶，两个人看了一会儿，随后继续完成自己的观察任务。"}],"question":"分别说出小安选的工具及其理由，再说出小雨选的工具及其理由。","targets":[{"label":"小雨选择的理由","needed":true,"steps":[{"kind":"single","prompt":"选择理由。","options":[{"id":"o0","text":"装水"},{"id":"o1","text":"量叶片长度"},{"id":"o2","text":"观察蝴蝶"}],"answer":"o1","explanation":"她想测叶片长度。","id":"p1"}],"id":"t4"},{"label":"小安选择的理由","needed":true,"steps":[{"kind":"single","prompt":"选择理由。","options":[{"id":"o0","text":"看清叶片细纹"},{"id":"o1","text":"量叶片长度"},{"id":"o2","text":"剪下叶片"}],"answer":"o0","explanation":"他的目标是看清表面细纹。","id":"p1"}],"id":"t2"},{"label":"小安选的工具","needed":true,"steps":[{"kind":"single","prompt":"选择工具。","options":[{"id":"o0","text":"直尺"},{"id":"o1","text":"放大镜"},{"id":"o2","text":"剪刀"}],"answer":"o1","explanation":"小安选放大镜。","id":"p1"}],"id":"t1"},{"label":"窗外飞来的动物","needed":false,"steps":[{"kind":"single","prompt":"选择动物。","options":[{"id":"o0","text":"麻雀"},{"id":"o1","text":"蝴蝶"},{"id":"o2","text":"蜻蜓"}],"answer":"o1","explanation":"蝴蝶是背景细节，不在题目要求里。","id":"p1"}],"id":"t5"},{"label":"小雨选的工具","needed":true,"steps":[{"kind":"single","prompt":"选择工具。","options":[{"id":"o0","text":"纸杯"},{"id":"o1","text":"放大镜"},{"id":"o2","text":"直尺"}],"answer":"o2","explanation":"小雨选直尺。","id":"p1"}],"id":"t3"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3"]},"taskSpans":["小安选的工具","其理由","小雨选的工具"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b3","level":2},{"id":"T33","title":"两类物品的去处","domain":"reading","skills":["限定条件","多问完整"],"passage":[{"id":"s1","text":"周末整理房间时，小林发现桌上有几本书和一堆旧纸，椅子上还放着一个蓝色书包。"},{"id":"s2","text":"他先把课本按大小放进书架，再把废纸放进回收袋，没有把课本当作废纸扔掉。"},{"id":"s3","text":"他把空水杯拿到厨房清洗，又把铅笔放回笔筒，最后擦干净了桌面。"},{"id":"s4","text":"妈妈过来时，房间已经整齐了很多，小林便邀请妈妈一起看自己的手工作品。"},{"id":"s5","text":"本题只询问与课本和废纸有关的处理，不问水杯、铅笔，也不问手工是什么样的。"},{"id":"s6","text":"窗边的窗帘被风吹起来，小林走过去关小窗户，继续整理床头的物品。"}],"question":"课本放到了哪里，废纸又放到了哪里？只回答这两类物品的去处。","targets":[{"label":"水杯的去处","needed":false,"steps":[{"kind":"single","prompt":"选择位置。","options":[{"id":"o0","text":"厨房"},{"id":"o1","text":"书架"},{"id":"o2","text":"回收袋"}],"answer":"o0","explanation":"厨房属实，但水杯被明确排除在本题要求外。","id":"p1"}],"id":"t3"},{"label":"课本的去处","needed":true,"steps":[{"kind":"single","prompt":"选择位置。","options":[{"id":"o0","text":"回收袋"},{"id":"o1","text":"书架"},{"id":"o2","text":"厨房"}],"answer":"o1","explanation":"课本放进书架。","id":"p1"}],"id":"t1"},{"label":"铅笔的去处","needed":false,"steps":[{"kind":"single","prompt":"选择位置。","options":[{"id":"o0","text":"抽屉"},{"id":"o1","text":"笔筒"},{"id":"o2","text":"书架"}],"answer":"o1","explanation":"铅笔入笔筒，题目不问。","id":"p1"}],"id":"t4"},{"label":"废纸的去处","needed":true,"steps":[{"kind":"single","prompt":"选择位置。","options":[{"id":"o0","text":"笔筒"},{"id":"o1","text":"书包"},{"id":"o2","text":"回收袋"}],"answer":"o2","explanation":"废纸放进回收袋。","id":"p1"}],"id":"t2"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s5"]},"taskSpans":["课本放到了哪里","废纸又放到了哪里","只回答这两类物品"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b3","level":2},{"id":"T34","title":"发现办法再试一次","domain":"reading","skills":["整体概括","题意等价"],"passage":[{"id":"s1","text":"小禾想让纸风车转起来，第一次把纸片压得太紧，风吹过来时风车也一动不动。"},{"id":"s2","text":"他没有马上丢掉风车，而是仔细看看转轴，发现纸片和轴贴得太紧。"},{"id":"s3","text":"在老师提醒下，他把纸片稍微松开，留出可以转动的小空隙，然后重新尝试。"},{"id":"s4","text":"这一次，风一吹，风车就转起来了；小禾又试了几次，确认这个办法确实有效。"},{"id":"s5","text":"桌上还放着几张没有用完的彩纸，一张画着云，另一张画着弯弯的小路。"},{"id":"s6","text":"放学前，小禾把成功的方法记在本子上，准备下次做风车时继续使用。"}],"question":"选出所有能概括这段故事主要过程的说法。","targets":[{"label":"能概括主要过程的所有说法","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"小禾遇到问题，找出原因，调整后再次尝试并成功。"},{"id":"o1","text":"小禾看到风车不转，马上扔掉了它。"},{"id":"o2","text":"小禾通过检查和改进，让原来不转的风车转起来。"},{"id":"o3","text":"故事主要介绍两张彩纸上的图案。"}],"answer":["o0","o2"],"explanation":"主线是遇到问题→查原因→调整→验证成功；彩纸图案只是细节。","id":"p1"}],"id":"t1"},{"label":"风车最初不转的原因","needed":false,"steps":[{"kind":"single","prompt":"选择原因。","options":[{"id":"o0","text":"没有颜色"},{"id":"o1","text":"纸片贴轴太紧"},{"id":"o2","text":"纸太少"}],"answer":"o1","explanation":"原因正确，但本题要概括整个过程。","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出属于“问题、查找原因、改进、结果和记录方法”这条主线的句子。","answers":[["s1","s2","s3","s4","s6"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":["所有能概括这段故事主要过程的说法"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b3","level":2},{"id":"T35","title":"分出去又收回来","domain":"math","skills":["多步推理","跨句整合"],"passage":[{"id":"s1","text":"活动前，老师在盒里装了三十枚贴纸，盒盖上贴着一张笑脸图案，旁边放着奖状。"},{"id":"s2","text":"第一轮活动发出去十二枚，第二轮又发出去五枚，剩下的贴纸仍放在原盒里。"},{"id":"s3","text":"后来发现第二轮有两枚发重复了，同学把这两枚完整地还回盒子。"},{"id":"s4","text":"第一轮的贴纸没有归还，老师也没有从其他盒子里补充新的贴纸。"},{"id":"s5","text":"桌上另有十枚印章图案，那些是画在纸上的，不算盒里的贴纸。"},{"id":"s6","text":"现在老师要清点盒里实际剩下的贴纸，不再考虑之后还会举行的活动。"}],"question":"现在盒里还有多少枚贴纸？每一步都要完成。","targets":[{"label":"第二轮发出的贴纸数","needed":false,"steps":[{"kind":"number","prompt":"填写枚数。","answer":5,"explanation":"第二轮发5枚，不是现有数量。","id":"p1"}],"id":"t2"},{"label":"现在盒里的贴纸数","needed":true,"steps":[{"kind":"number","prompt":"第一步：两轮总共发出了多少枚？","answer":17,"explanation":"12+5=17。","calc":"12+5","id":"p1"},{"kind":"number","prompt":"第二步：归还之前还剩多少枚？","answer":13,"explanation":"30-17=13。","calc":"30-12-5","id":"p2"},{"kind":"number","prompt":"第三步：还回两枚以后有多少枚？","answer":15,"explanation":"13+2=15。","calc":"30-12-5+2","id":"p3"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s4"]},"taskSpans":["现在盒里还有多少枚贴纸"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b3","level":2},{"id":"T36","title":"两排座位","domain":"math","skills":["多问完整","数量关系"],"passage":[{"id":"s1","text":"故事角摆了两排椅子，老师想让不同年级的同学都能坐下来听故事。"},{"id":"s2","text":"前排有八把椅子，已经坐了五个人；后排有九把椅子，已经坐了六个人。"},{"id":"s3","text":"每把椅子最多坐一个人，没有人站在椅子上，也没有另外搬进或搬走椅子。"},{"id":"s4","text":"老师在两排之间留了一条走道，走道里不能放椅子，门边的凳子也不算这两排。"},{"id":"s5","text":"黑板上写着今天的故事题目，窗台上摆着纸做的小动物，很多同学正在安静等待。"},{"id":"s6","text":"题目分别询问两排的空位，不要求把它们合起来只报一个总数。"}],"question":"前排和后排分别还有多少个空位？","targets":[{"label":"前排的空位数","needed":true,"steps":[{"kind":"number","prompt":"填写个数。","answer":3,"explanation":"前排8把椅子减5人。","calc":"8-5","id":"p1"}],"id":"t1"},{"label":"后排的空位数","needed":true,"steps":[{"kind":"number","prompt":"填写个数。","answer":3,"explanation":"后排9把椅子减6人。","calc":"9-6","id":"p1"}],"id":"t2"},{"label":"两排合起来的空位数","needed":false,"steps":[{"kind":"number","prompt":"填写个数。","answer":6,"explanation":"总共6个，但题目要求分别回答，不能用合计替代。","calc":"(8-5)+(9-6)","id":"p1"}],"id":"t3"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3","s6"]},"taskSpans":["前排和后排分别还有多少个空位"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b3","level":2},{"id":"T37","title":"别把退掉的算进去","domain":"math","skills":["反向审题","多步推理"],"passage":[{"id":"s1","text":"小木带着二十元去买作业本，每本作业本三元，柜台上有很多不同颜色的封面。"},{"id":"s2","text":"他先买了四本，付款后发现其中一本封面破了，就把这一本退回，店主退还三元。"},{"id":"s3","text":"他没有换购其他东西，也没有额外得到礼物，退回的那一本不再属于他。"},{"id":"s4","text":"旁边还有每支两元的铅笔，小木只是看了看，并没有购买。"},{"id":"s5","text":"店主把好的作业本装进纸袋，提醒小木保管好找回和退回的钱。"},{"id":"s6","text":"小木回家以后，才把这次真正留下的作业本和剩下的钱放到书桌上。"}],"question":"选出所有错误的说法。","targets":[{"label":"最终剩余的钱数","needed":false,"steps":[{"kind":"number","prompt":"填写元数。","answer":11,"explanation":"20-4×3+3=11。","calc":"20-4*3+3","id":"p1"}],"id":"t2"},{"label":"关于最终购买结果的所有错误说法","needed":true,"steps":[{"kind":"multi","prompt":"多选：找错误。","options":[{"id":"o0","text":"小木最后留下四本作业本。"},{"id":"o1","text":"小木实际花了九元。"},{"id":"o2","text":"小木最后还剩八元。"},{"id":"o3","text":"小木最后留下三本作业本。"}],"answer":["o0","o2"],"explanation":"退掉1本后留下3本，净花9元，剩11元；8元是退款之前的钱。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3"]},"taskSpans":["所有错误的说法"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b3","level":2},{"id":"T38","title":"一共还是各自","domain":"math","skills":["题意等价","多问完整"],"passage":[{"id":"s1","text":"小雨和小林各做了一盒卡片，午休时把盒子放在同一张桌子上，准备登记数量。"},{"id":"s2","text":"小雨的盒里有七张，小林的盒里有九张，两人的卡片没有混在一起，也没有丢失。"},{"id":"s3","text":"盒子的颜色一红一蓝，但本题不问颜色，也不比较谁做得漂亮。"},{"id":"s4","text":"老师原本问：小雨有多少张，小林又有多少张？请分别报告两人的数量。"},{"id":"s5","text":"旁边一位同学说可以先看题目要求，再决定是把数字相加还是分别说出。"},{"id":"s6","text":"现在只判断哪些问法与老师原本的问题相同，不必重新计算卡片数量。"}],"question":"选出所有与老师原本的问题要求相同的问法。","targets":[{"label":"两人的卡片总数","needed":false,"steps":[{"kind":"number","prompt":"填写张数。","answer":16,"explanation":"7+9=16不是分别报告。","calc":"7+9","id":"p1"}],"id":"t2"},{"label":"与分别报告两人数量相同的所有问法","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"两个人的卡片合起来有多少张？"},{"id":"o1","text":"请分别填写小雨的张数和小林的张数。"},{"id":"o2","text":"请先说小雨有几张，再说小林有几张。"},{"id":"o3","text":"小林比小雨多多少张？"}],"answer":["o1","o2"],"explanation":"原题要两个人各自的数量，不是合计，也不是差量。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s4"]},"taskSpans":["所有与老师原本的问题要求相同的问法"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b3","level":2},{"id":"T39","title":"借用规则里的例外","domain":"reasoning","skills":["逻辑条件","限定条件"],"passage":[{"id":"s1","text":"阅读室借用规则写着：普通读者每次最多借两本书，参加读书展示的同学每次最多借三本。"},{"id":"s2","text":"小叶是普通读者，这次打算借三本；小安参加读书展示，这次打算借三本。"},{"id":"s3","text":"小木也是普通读者，这次打算借两本，三个人都没有其他尚未归还的书。"},{"id":"s4","text":"这项规则只比较本次借书数量和读者类别，不比较书的颜色、厚度或者故事是否有趣。"},{"id":"s5","text":"门口有一张新海报，海报上的人物手里捧着很多书，但海报不是借书规则。"},{"id":"s6","text":"请按规则判断这些计划是否允许，不把打算借的数量当成已经借到的数量。"}],"question":"哪些人的借书计划符合规则？选出全部符合的人。","targets":[{"label":"不符合规则的人","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小安"},{"id":"o1","text":"小木"},{"id":"o2","text":"小叶"}],"answer":"o2","explanation":"不符合的是小叶，但题目要求符合的人。","id":"p1"}],"id":"t2"},{"label":"借书计划符合规则的所有人","needed":true,"steps":[{"kind":"multi","prompt":"多选：这次找符合的。","options":[{"id":"o0","text":"小叶"},{"id":"o1","text":"小安"},{"id":"o2","text":"小木"}],"answer":["o1","o2"],"explanation":"普通读者上限2本，小叶想借3本不符；展示者小安可借3本，小木借2本也可。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3"]},"taskSpans":["全部符合的人"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b3","level":2},{"id":"T40","title":"路线先后不能换","domain":"reasoning","skills":["多步推理","顺序整合"],"passage":[{"id":"s1","text":"小队要先到服务台领地图，再按地图去看昆虫，最后把借用的放大镜送回服务台。"},{"id":"s2","text":"老师补充说：领到地图后，必须先去工具室借放大镜，才能进入昆虫观察区。"},{"id":"s3","text":"观察结束以后要先填写记录卡，记录卡填好才能归还放大镜，不能把顺序颠倒。"},{"id":"s4","text":"服务台旁有纪念品柜，工具室门外放着两盆花，但购物和看花都不是本次任务。"},{"id":"s5","text":"小队已经领到了地图，现在正准备执行后面的步骤，还没有去过工具室。"},{"id":"s6","text":"请只安排接下来必须完成的事情，不把已经做过的领地图再算一次。"}],"question":"从现在开始，把“借放大镜、观察昆虫、填写记录卡、归还放大镜”按顺序排好。","targets":[{"label":"小队已经完成的步骤","needed":false,"steps":[{"kind":"single","prompt":"选择步骤。","options":[{"id":"o0","text":"领地图"},{"id":"o1","text":"归还放大镜"},{"id":"o2","text":"买纪念品"}],"answer":"o0","explanation":"已领地图，不应再放进接下来的四步。","id":"p1"}],"id":"t2"},{"label":"接下来必须完成的步骤顺序","needed":true,"steps":[{"kind":"order","prompt":"按顺序点选。","options":[{"id":"o0","text":"填写记录卡"},{"id":"o1","text":"归还放大镜"},{"id":"o2","text":"借放大镜"},{"id":"o3","text":"观察昆虫"}],"answer":["o2","o3","o0","o1"],"explanation":"地图已领；后面依次借工具→观察→记录→归还。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3","s5"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s5","s6"]},"taskSpans":["从现在开始","按顺序排好"],"tokens":[],"referenceEdges":[],"mode":"train","round":2,"blockId":"r2b3","level":2},{"id":"T41","title":"不是原来的集合点","domain":"reading","skills":["跨句整合","多问完整"],"passage":[{"id":"s1","text":"班级通知原先写着：星期五下午三点在东门集合，参加校园植物观察活动。"},{"id":"s2","text":"星期四晚上，老师发出更正：东门附近施工，集合地点改为西门，集合时间不变。"},{"id":"s3","text":"活动当天午饭后又下起雨，老师把集合时间推迟半小时，地点仍按更正后的通知。"},{"id":"s4","text":"小林把两次更正都抄在便签上，贴到书包上，没有只保留最早的那张通知。"},{"id":"s5","text":"同学们可以带雨衣，但不能带零食，活动结束后家长按老师通知来接。"},{"id":"s6","text":"学校北门旁有一家文具店，南门外有公交站，这两处都没有被定为集合地点。"}],"question":"请填写最终的集合地点和集合时间。","targets":[{"label":"最终集合时间","needed":true,"steps":[{"kind":"single","prompt":"选择时间。","options":[{"id":"o0","text":"下午三点"},{"id":"o1","text":"下午两点半"},{"id":"o2","text":"下午三点半"}],"answer":"o2","explanation":"原来三点，之后推迟半小时，成为三点半。","id":"p1"}],"id":"t2"},{"label":"最终集合地点","needed":true,"steps":[{"kind":"single","prompt":"选择地点。","options":[{"id":"o0","text":"东门"},{"id":"o1","text":"西门"},{"id":"o2","text":"北门"},{"id":"o3","text":"南门"}],"answer":"o1","explanation":"第一次更正改为西门，后面没有再改地点。","id":"p1"}],"id":"t1"},{"label":"原通知的集合地点","needed":false,"steps":[{"kind":"single","prompt":"选择地点。","options":[{"id":"o0","text":"西门"},{"id":"o1","text":"东门"},{"id":"o2","text":"南门"}],"answer":"o1","explanation":"东门是旧通知，不是最终安排。","id":"p1"}],"id":"t3"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3"]},"taskSpans":["最终的集合地点","集合时间"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b1","level":3},{"id":"T42","title":"“这件事”不是一个东西","domain":"reading","skills":["指代追踪","因果理解"],"passage":[{"id":"s1","text":"午休时，小晴发现走廊地面上有水，一位低年级同学正准备跑过去，旁边没有提醒牌。"},{"id":"s2","text":"小晴先叫住那位同学，再把提醒牌放到积水旁，随后请值日生来擦干地面。"},{"id":"s3","text":"老师知道后说，小晴及时提醒同学并处理积水，这件事值得表扬。"},{"id":"s4","text":"小木听完便去找小晴，请她说明刚才的经过，而不是去找那位低年级同学。"},{"id":"s5","text":"走廊另一头的窗户开着，墙上的课程表被风吹动，门口还放着两个空花盆。"},{"id":"s6","text":"地面擦干后，提醒牌被收回值日角，大家才从这条走廊正常通过。"}],"question":"“这件事”具体指哪件事？“请她说明”中的“她”又指谁？","targets":[{"label":"提醒牌最后放的位置","needed":false,"steps":[{"kind":"single","prompt":"选择位置。","options":[{"id":"o0","text":"值日角"},{"id":"o1","text":"花盆里"},{"id":"o2","text":"窗台上"}],"answer":"o0","explanation":"牌收回值日角，题目未问。","id":"p1"}],"id":"t3"},{"label":"“请她说明”中的“她”","needed":true,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"老师"},{"id":"o1","text":"值日生"},{"id":"o2","text":"小晴"}],"answer":"o2","explanation":"小木去找小晴，请小晴说明经过。","id":"p1"}],"id":"t2"},{"label":"“这件事”指的事件","needed":true,"steps":[{"kind":"single","prompt":"选择完整的事件。","options":[{"id":"o0","text":"墙上的课程表被风吹动"},{"id":"o1","text":"小晴及时提醒同学并处理积水"},{"id":"o2","text":"低年级同学跑过积水"}],"answer":"o1","explanation":"前句所表扬的是及时提醒并处理积水，不是某个物品，也不是同学跑过水。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3","s4"]},"taskSpans":["“这件事”具体指哪件事","“她”又指谁"],"tokens":[{"id":"w1","sid":"s3","start":7,"end":20,"text":"小晴及时提醒同学并处理积水","kind":"noun"},{"id":"w2","sid":"s3","start":21,"end":24,"text":"这件事","kind":"pronoun"},{"id":"w3","sid":"s4","start":7,"end":9,"text":"小晴","kind":"noun"},{"id":"w4","sid":"s4","start":11,"end":12,"text":"她","kind":"pronoun"},{"id":"w5","sid":"s1","start":4,"end":6,"text":"小晴","kind":"noun"},{"id":"w6","sid":"s2","start":0,"end":2,"text":"小晴","kind":"noun"},{"id":"w7","sid":"s3","start":7,"end":9,"text":"小晴","kind":"noun"},{"id":"w8","sid":"s1","start":21,"end":23,"text":"同学","kind":"noun"},{"id":"w9","sid":"s1","start":10,"end":12,"text":"地面","kind":"noun"},{"id":"w10","sid":"s1","start":34,"end":37,"text":"提醒牌","kind":"noun"},{"id":"w11","sid":"s1","start":8,"end":10,"text":"走廊","kind":"noun"},{"id":"w12","sid":"s2","start":24,"end":27,"text":"值日生","kind":"noun"},{"id":"w13","sid":"s2","start":7,"end":9,"text":"同学","kind":"noun"},{"id":"w14","sid":"s2","start":30,"end":32,"text":"地面","kind":"noun"},{"id":"w15","sid":"s2","start":12,"end":15,"text":"提醒牌","kind":"noun"},{"id":"w16","sid":"s2","start":17,"end":19,"text":"积水","kind":"noun"},{"id":"w17","sid":"s3","start":13,"end":15,"text":"同学","kind":"noun"},{"id":"w18","sid":"s3","start":18,"end":20,"text":"积水","kind":"noun"},{"id":"w19","sid":"s3","start":0,"end":2,"text":"老师","kind":"noun"},{"id":"w20","sid":"s4","start":30,"end":32,"text":"同学","kind":"noun"},{"id":"w21","sid":"s4","start":17,"end":19,"text":"经过","kind":"noun"},{"id":"w22","sid":"s5","start":11,"end":21,"text":"墙上的课程表被风吹动","kind":"noun"},{"id":"w23","sid":"s5","start":6,"end":8,"text":"窗户","kind":"noun"},{"id":"w24","sid":"s5","start":30,"end":32,"text":"花盆","kind":"noun"},{"id":"w25","sid":"s5","start":14,"end":17,"text":"课程表","kind":"noun"},{"id":"w26","sid":"s5","start":0,"end":2,"text":"走廊","kind":"noun"},{"id":"w27","sid":"s5","start":18,"end":19,"text":"风","kind":"noun"},{"id":"w28","sid":"s6","start":12,"end":15,"text":"值日角","kind":"noun"},{"id":"w29","sid":"s6","start":0,"end":2,"text":"地面","kind":"noun"},{"id":"w30","sid":"s6","start":6,"end":9,"text":"提醒牌","kind":"noun"},{"id":"w31","sid":"s6","start":22,"end":24,"text":"走廊","kind":"noun"}],"referenceEdges":[["w1","w2"],["w3","w4"]],"mode":"train","round":3,"blockId":"r3b1","level":3},{"id":"T43","title":"听清“没有”","domain":"reading","skills":["反向审题","否定关系"],"passage":[{"id":"s1","text":"小组制作了一张活动海报，老师要求写上地点和时间，但没有要求写参加者的年龄。"},{"id":"s2","text":"小安负责写地点，小雨负责写时间，两个人都完成了自己的任务。"},{"id":"s3","text":"海报上没有写参加者年龄，也没有写报名费用，因为这次活动免费且不收材料费。"},{"id":"s4","text":"小木只在海报边上画了树叶，没有替小安或小雨写文字。"},{"id":"s5","text":"海报贴在二楼公告栏旁，周围还有上个月的比赛照片和一张校车时刻表。"},{"id":"s6","text":"题目只依据这次海报制作的记录判断，不把旁边其他通知的内容当作海报内容。"}],"question":"选出所有与这次海报制作记录相矛盾的说法。","targets":[{"label":"海报张贴的楼层","needed":false,"steps":[{"kind":"number","prompt":"填写楼层数字。","answer":2,"explanation":"贴在二楼，但本题不是问楼层。","id":"p1"}],"id":"t2"},{"label":"与记录相矛盾的所有说法","needed":true,"steps":[{"kind":"multi","prompt":"多选：找有明确反证的说法。","options":[{"id":"o0","text":"小安写了地点。"},{"id":"o1","text":"小木替小雨写了时间。"},{"id":"o2","text":"海报上写了参加者年龄。"},{"id":"o3","text":"这次活动不收材料费。"}],"answer":["o1","o2"],"explanation":"记录明说时间由小雨写，小木没替人写字；也明确没写年龄。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s4"]},"taskSpans":["所有与这次海报制作记录相矛盾的说法"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b1","level":3},{"id":"T44","title":"不只是一个空盒子","domain":"reading","skills":["整体概括","跨段整合"],"passage":[{"id":"s1","text":"小安做手工剩下许多短彩带和小纸片，开始想把它们都扔进垃圾桶，桌面显得很乱。"},{"id":"s2","text":"他看到同桌用旧纸盒做收纳盒，便想到可以把自己的小材料也分类保存。"},{"id":"s3","text":"他找来几个空盒子，把彩带、纸片和纽扣分别放好，还在盒外贴上物品名称。"},{"id":"s4","text":"下一次做贺卡时，他直接找到合适的材料，不用重新剪很多彩纸，也少浪费了东西。"},{"id":"s5","text":"同桌借来几颗纽扣做花心，完成后把没有用完的纽扣送回原来的盒子。"},{"id":"s6","text":"窗边的灯亮起来时，两个人把做好的贺卡放平，准备第二天送给老师。"}],"question":"选出最能概括全文主要内容的一项。","targets":[{"label":"全文主要内容","needed":true,"steps":[{"kind":"single","prompt":"选择一项。","options":[{"id":"o0","text":"小安把所有旧材料都扔掉了。"},{"id":"o1","text":"同桌只想借纽扣，不想做贺卡。"},{"id":"o2","text":"小安学会分类保存剩余材料，让它们以后还能派上用场。"},{"id":"o3","text":"文章主要介绍窗边灯的颜色。"}],"answer":"o2","explanation":"核心是改变丢弃想法，分类保存并再次使用材料；借纽扣也是复用的一部分。","id":"p1"}],"id":"t1"},{"label":"贺卡准备送给的人","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"老师"},{"id":"o1","text":"店主"},{"id":"o2","text":"门卫"}],"answer":"o0","explanation":"贺卡给老师，但这不是文章主旨。","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出说明小安如何对待剩余材料、以及这些材料后来怎样被使用的句子。","answers":[["s1","s2","s3","s4","s5"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":["最能概括全文主要内容"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b1","level":3},{"id":"T45","title":"展板上的照片","domain":"math","skills":["多步推理","多问完整"],"passage":[{"id":"s1","text":"老师准备把旅行照片贴在展板上，最初选出二十八张，放在一个透明文件袋里。"},{"id":"s2","text":"检查时发现其中四张重复，于是把这四张拿走，不再用于这次展览。"},{"id":"s3","text":"后来又补进六张不同的新照片，这六张与剩下的照片都不重复。"},{"id":"s4","text":"贴照片时，第一块展板用了十张，其他照片全部留给第二块展板，没有剩下不贴的。"},{"id":"s5","text":"展板边缘需要贴装饰条，桌上还有两卷胶带，但胶带和装饰条不算照片。"},{"id":"s6","text":"同学们只计算这次实际使用的照片，不把文件袋上的宣传图片算进去。"}],"question":"这次实际使用了多少张照片，第二块展板贴了多少张？","targets":[{"label":"最初选出的照片数","needed":false,"steps":[{"kind":"number","prompt":"填写张数。","answer":28,"explanation":"28是最初数量，不是实际用量。","id":"p1"}],"id":"t3"},{"label":"这次实际使用的照片总数","needed":true,"steps":[{"kind":"number","prompt":"第一步：去掉重复照片后剩多少张？","answer":24,"explanation":"28-4=24。","calc":"28-4","id":"p1"},{"kind":"number","prompt":"第二步：补进新照片后共多少张？","answer":30,"explanation":"24+6=30。","calc":"28-4+6","id":"p2"}],"id":"t1"},{"label":"第二块展板的照片数","needed":true,"steps":[{"kind":"number","prompt":"第一步：实际共有多少张照片？","answer":30,"explanation":"去掉4再加6。","calc":"28-4+6","id":"p1"},{"kind":"number","prompt":"第二步：除去第一块使用的10张，第二块有多少张？","answer":20,"explanation":"30-10=20。","calc":"28-4+6-10","id":"p2"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s4"]},"taskSpans":["实际使用了多少张照片","第二块展板贴了多少张"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b1","level":3},{"id":"T46","title":"只算自己的","domain":"math","skills":["限定条件","数量范围"],"passage":[{"id":"s1","text":"手工课上，小禾带来十二张彩纸，小安另外带来七张，两个人没有把彩纸混在一起。"},{"id":"s2","text":"小禾用了五张自己的彩纸，随后老师又给小禾三张彩纸，这三张归小禾使用。"},{"id":"s3","text":"小安从自己的七张中用了两张，没有把任何彩纸给小禾，也没有拿走小禾的彩纸。"},{"id":"s4","text":"桌面中间摆着一盒彩笔和四把剪刀，旁边有几张老师示范用的大纸，不属于他们。"},{"id":"s5","text":"下课前，小禾把属于自己的剩余彩纸全部放进自己的文件夹，其他人的纸不放进去。"},{"id":"s6","text":"本题问的是小禾自己的数量，不把同桌或老师示范用的纸加在一起。"}],"question":"下课前，小禾自己的文件夹里一共有多少张彩纸？","targets":[{"label":"小安剩下的彩纸数","needed":false,"steps":[{"kind":"number","prompt":"填写张数。","answer":5,"explanation":"7-2=5是小安的。","calc":"7-2","id":"p1"}],"id":"t2"},{"label":"两人剩余彩纸合计","needed":false,"steps":[{"kind":"number","prompt":"填写张数。","answer":15,"explanation":"10+5=15，但题目只问小禾。","calc":"12-5+3+7-2","id":"p1"}],"id":"t3"},{"label":"小禾文件夹里的彩纸数","needed":true,"steps":[{"kind":"number","prompt":"第一步：自己的12张用去5张后，还剩多少张？","answer":7,"explanation":"12-5=7。","calc":"12-5","id":"p1"},{"kind":"number","prompt":"第二步：再加上老师给小禾的3张，共多少张？","answer":10,"explanation":"7+3=10；同桌的纸不算。","calc":"12-5+3","id":"p2"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s5","s6"]},"taskSpans":["小禾自己的文件夹","多少张彩纸"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b1","level":3},{"id":"T47","title":"少几本也就是多几本","domain":"math","skills":["题意等价","反向表达"],"passage":[{"id":"s1","text":"阅读记录表上写着，小禾这个月读了六本书，小木读了十本，书本种类各不相同。"},{"id":"s2","text":"老师只比较读完的本数，不比较页数，也不把还没读完的书计入这次记录。"},{"id":"s3","text":"小禾的记录纸上画了小花，小木的记录纸上画了小船，这些装饰不影响本数。"},{"id":"s4","text":"原题是：小禾比小木少读了多少本书？"},{"id":"s5","text":"有人换了说话顺序，把小木放到句子前面；是否同义，要看比较的内容有没有改变。"},{"id":"s6","text":"本题只判断问法，不要求填写两个数字相加或相减的计算结果。"}],"question":"选出所有与原题问的是同一个数量的问题。","targets":[{"label":"两人读完的总本数","needed":false,"steps":[{"kind":"number","prompt":"填写本数。","answer":16,"explanation":"6+10=16，不是所问的差。","calc":"6+10","id":"p1"}],"id":"t2"},{"label":"与原题问同一差量的所有问题","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"小木比小禾多读了多少本？"},{"id":"o1","text":"小木和小禾一共读了多少本？"},{"id":"o2","text":"两人读完的本数相差多少？"},{"id":"o3","text":"小禾已经读完多少本？"}],"answer":["o0","o2"],"explanation":"多多少与反过来说少多少，问的是同一差；总数和小禾单人的本数不同。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s4"]},"taskSpans":["所有与原题问的是同一个数量的问题"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b1","level":3},{"id":"T48","title":"同样是平均分","domain":"math","skills":["结构等价","数量关系"],"passage":[{"id":"s1","text":"美术小组有十二枚纽扣，要平均分给三个同学，每个人分到的数量必须一样。"},{"id":"s2","text":"老师问每个人可以分到几枚，桌上另外的珠子和线都不参加这次分配。"},{"id":"s3","text":"纽扣中有红色和白色，但不按颜色分组，只要求每个人获得的总枚数相同。"},{"id":"s4","text":"分完之后不再留下纽扣，也没有给某位同学额外增加一枚。"},{"id":"s5","text":"比较下面的题目时，要找“已知总数和人数或组数，平均分后求每份多少”的问题。"},{"id":"s6","text":"不要因为都出现三个数字，就把不同的数量关系当作同一种题。"}],"question":"选出所有与原题有相同平均分结构的问题。","targets":[{"label":"原题每人分到的纽扣数","needed":false,"steps":[{"kind":"number","prompt":"填写枚数。","answer":4,"explanation":"12÷3=4，但本题是选结构。","calc":"12/3","id":"p1"}],"id":"t2"},{"label":"已知总数和份数、求每份多少的所有问题","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"18颗珠子平均放进3个袋子，每袋几颗？"},{"id":"o1","text":"每袋放3颗珠子，18颗需要几个袋子？"},{"id":"o2","text":"20张纸平均分给4个人，每人几张？"},{"id":"o3","text":"一人有12张纸，另一人有3张，两人一共几张？"}],"answer":["o0","o2"],"explanation":"第一第三已知总数与份数，求每份；第二已知每份，求份数；第四是合计。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s4","s5"]},"taskSpans":["所有与原题有相同平均分结构的问题"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b1","level":3},{"id":"T49","title":"书架从上往下","domain":"reasoning","skills":["多步推理","关系排序"],"passage":[{"id":"s1","text":"阅读角的一个书架共有三层，每层只放一种书，三种书是故事书、科普书和诗歌集。"},{"id":"s2","text":"老师说，故事书放在科普书上面，科普书放在诗歌集上面。"},{"id":"s3","text":"这里的“上面”指书架层数更高，不是书本叠在另一种书的封面上。"},{"id":"s4","text":"同学们必须把三种书分别放到三层，每种书只能占一层，不能把两种放在同层。"},{"id":"s5","text":"书架左边贴着一张借阅说明，右边摆着绿植，绿植的位置不参与书籍排序。"},{"id":"s6","text":"小木打算从最高一层开始检查，请你帮他按同样的方向整理顺序。"}],"question":"把三种书按从上到下的顺序排好。","targets":[{"label":"书架共有几层","needed":false,"steps":[{"kind":"number","prompt":"填写层数。","answer":3,"explanation":"三层是条件，本题要求给书籍排序。","id":"p1"}],"id":"t2"},{"label":"书架从上到下的书籍顺序","needed":true,"steps":[{"kind":"order","prompt":"按从上到下依次点选。","options":[{"id":"o0","text":"诗歌集"},{"id":"o1","text":"故事书"},{"id":"o2","text":"科普书"}],"answer":["o1","o2","o0"],"explanation":"故事书高于科普，科普高于诗歌，因此顺序唯一。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s4","s6"]},"taskSpans":["从上到下的顺序"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b1","level":3},{"id":"T50","title":"没有写，不等于没有发生","domain":"reasoning","skills":["无法确定","事实判断"],"passage":[{"id":"s1","text":"周日，小晴去社区参加手工活动，活动记录只写了她在教室里做的几件事。"},{"id":"s2","text":"记录写着，小晴做了一个纸盒，把纸盒送给小宁，自己带走了一张老师发的书签。"},{"id":"s3","text":"记录还写着，小晴离开教室时向老师道别，但没有说明她回家时走哪条路。"},{"id":"s4","text":"老师没有在记录里写当天的天气，也没有介绍小宁后来把纸盒放在哪里。"},{"id":"s5","text":"教室桌上有剪刀和胶水，窗边放着清洁用的小水桶，活动结束后有人负责整理。"},{"id":"s6","text":"不能因为记录没有提到下雨，就断定当天一定晴朗，也不能把没写的去处当作没去过。"}],"question":"选出所有仅凭记录无法判断真假的说法。","targets":[{"label":"有明确记录为真的说法","needed":false,"steps":[{"kind":"single","prompt":"选择说法。","options":[{"id":"o0","text":"小晴带走一张书签"},{"id":"o1","text":"小晴带走两个纸盒"},{"id":"o2","text":"小宁没有收到纸盒"}],"answer":"o0","explanation":"书签已明确写出，但题目要找无法判断。","id":"p1"}],"id":"t2"},{"label":"无法根据记录判断真假的所有说法","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"小晴把纸盒送给了小宁。"},{"id":"o1","text":"当天一直没有下雨。"},{"id":"o2","text":"小宁后来把纸盒放在书架上。"},{"id":"o3","text":"小晴离开教室时没有向老师道别。"}],"answer":["o1","o2"],"explanation":"天气和纸盒后来的位置没说；送盒是真的，不道别与明确记录矛盾，不属于无法判断。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3","s4"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3","s4","s6"]},"taskSpans":["所有仅凭记录无法判断真假的说法"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b1","level":3},{"id":"T51","title":"“他们”包含谁","domain":"reading","skills":["指代追踪","集合范围"],"passage":[{"id":"s1","text":"下午，小木和小禾留下修补班里的图书，小林在操场训练，没有参加这次修补。"},{"id":"s2","text":"小木把破损的书页压平，小禾递来胶带，两个人分工把几本旧书补好。"},{"id":"s3","text":"他们检查完书页后，把修好的书放回书架，然后一起去洗手。"},{"id":"s4","text":"老师向小林介绍了这件事，小林说下次也想参加，但他这一次没有帮忙修书。"},{"id":"s5","text":"书架旁的窗台摆着一只纸做的鸟，桌上还有两块没有用到的橡皮。"},{"id":"s6","text":"本文说的“他们”承接前面实际合作的两个人，不把后来听到这件事的人加进去。"}],"question":"“他们检查完书页后”中的“他们”包含哪些人？选出全部。","targets":[{"label":"没有参加这次修书的同学","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小禾"},{"id":"o1","text":"小林"},{"id":"o2","text":"小木"}],"answer":"o1","explanation":"小林没参加，但本题问他们包括谁。","id":"p1"}],"id":"t2"},{"label":"“他们”包含的所有人物","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"小木"},{"id":"o1","text":"小禾"},{"id":"o2","text":"小林"},{"id":"o3","text":"老师"}],"answer":["o0","o1"],"explanation":"前面一起修书的是小木和小禾；小林不在现场，老师只介绍事件。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s4","s6"]},"taskSpans":["“他们”包含哪些人","选出全部"],"tokens":[{"id":"w1","sid":"s2","start":18,"end":21,"text":"两个人","kind":"noun"},{"id":"w2","sid":"s3","start":0,"end":2,"text":"他们","kind":"pronoun"},{"id":"w3","sid":"s4","start":12,"end":14,"text":"小林","kind":"noun"},{"id":"w4","sid":"s4","start":23,"end":24,"text":"他","kind":"pronoun"},{"id":"w5","sid":"s1","start":18,"end":20,"text":"小林","kind":"noun"},{"id":"w6","sid":"s4","start":3,"end":5,"text":"小林","kind":"noun"},{"id":"w7","sid":"s6","start":17,"end":20,"text":"两个人","kind":"noun"},{"id":"w8","sid":"s1","start":15,"end":17,"text":"图书","kind":"noun"},{"id":"w9","sid":"s1","start":3,"end":5,"text":"小木","kind":"noun"},{"id":"w10","sid":"s1","start":6,"end":8,"text":"小禾","kind":"noun"},{"id":"w11","sid":"s1","start":12,"end":13,"text":"班","kind":"noun"},{"id":"w12","sid":"s2","start":6,"end":8,"text":"书页","kind":"noun"},{"id":"w13","sid":"s2","start":0,"end":2,"text":"小木","kind":"noun"},{"id":"w14","sid":"s2","start":11,"end":13,"text":"小禾","kind":"noun"},{"id":"w15","sid":"s2","start":26,"end":28,"text":"旧书","kind":"noun"},{"id":"w16","sid":"s2","start":15,"end":17,"text":"胶带","kind":"noun"},{"id":"w17","sid":"s3","start":16,"end":18,"text":"书架","kind":"noun"},{"id":"w18","sid":"s3","start":5,"end":7,"text":"书页","kind":"noun"},{"id":"w19","sid":"s3","start":0,"end":1,"text":"他","kind":"pronoun"},{"id":"w20","sid":"s4","start":0,"end":2,"text":"老师","kind":"noun"},{"id":"w21","sid":"s4","start":8,"end":11,"text":"这件事","kind":"pronoun"},{"id":"w22","sid":"s5","start":0,"end":2,"text":"书架","kind":"noun"},{"id":"w23","sid":"s5","start":26,"end":28,"text":"橡皮","kind":"noun"},{"id":"w24","sid":"s5","start":4,"end":6,"text":"窗台","kind":"noun"},{"id":"w25","sid":"s5","start":13,"end":14,"text":"鸟","kind":"noun"},{"id":"w26","sid":"s6","start":5,"end":7,"text":"他们","kind":"pronoun"},{"id":"w27","sid":"s6","start":27,"end":30,"text":"这件事","kind":"pronoun"},{"id":"w28","sid":"s6","start":5,"end":6,"text":"他","kind":"pronoun"}],"referenceEdges":[["w1","w2"],["w3","w4"]],"mode":"train","round":3,"blockId":"r3b3","level":3},{"id":"T52","title":"先后与原因都要回答","domain":"reading","skills":["多问完整","任务拆解"],"passage":[{"id":"s1","text":"小队去做树叶观察时，先来到大树旁，准备把看到的叶子形状画下来。"},{"id":"s2","text":"忽然刮起大风，纸张总被吹动，老师于是让大家先走进旁边的凉亭。"},{"id":"s3","text":"在凉亭里，同学们把纸压在画板下面，坐稳以后才继续观察和画图。"},{"id":"s4","text":"小晴负责分发画板，小木负责收好备用纸，小林提醒大家别踩花坛边的小苗。"},{"id":"s5","text":"风小了以后，大家仍留在凉亭完成记录，并没有再次换地方。"},{"id":"s6","text":"公园广播正在播放音乐，有人在远处跑步，这些都没有改变小队的观察安排。"}],"question":"他们原先在哪里观察，后来改到哪里，为什么要换地方？","targets":[{"label":"分发画板的人","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小木"},{"id":"o1","text":"小晴"},{"id":"o2","text":"小林"}],"answer":"o1","explanation":"小晴分画板，但不在题目所问的三项中。","id":"p1"}],"id":"t4"},{"label":"原先观察的位置","needed":true,"steps":[{"kind":"single","prompt":"选择位置。","options":[{"id":"o0","text":"大树旁"},{"id":"o1","text":"凉亭里"},{"id":"o2","text":"教室里"}],"answer":"o0","explanation":"开始来到大树旁观察。","id":"p1"}],"id":"t1"},{"label":"更换地点的原因","needed":true,"steps":[{"kind":"single","prompt":"选择原因。","options":[{"id":"o0","text":"广播太响"},{"id":"o1","text":"没有带画板"},{"id":"o2","text":"大风让纸张总被吹动"}],"answer":"o2","explanation":"换地方是避开风对纸张的影响。","id":"p1"}],"id":"t3"},{"label":"后来观察的位置","needed":true,"steps":[{"kind":"single","prompt":"选择位置。","options":[{"id":"o0","text":"操场上"},{"id":"o1","text":"凉亭里"},{"id":"o2","text":"校门口"}],"answer":"o1","explanation":"后来进凉亭，之后没再换。","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s5"]},"taskSpans":["原先在哪里观察","后来改到哪里","为什么要换地方"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b3","level":3},{"id":"T53","title":"只选做过的，不选打算的","domain":"reading","skills":["限定条件","计划实际"],"passage":[{"id":"s1","text":"周末，小雨列了一张计划表，准备整理书架、给花浇水，再做一张生日贺卡。"},{"id":"s2","text":"早晨她先整理了书架，把故事书和课本分开放好，接着给阳台的花浇了水。"},{"id":"s3","text":"刚准备做贺卡时，家里接到电话，要一起去看望外婆，她只好把这件事推迟到晚上。"},{"id":"s4","text":"离开家前，贺卡还没有开始做；她只是把彩纸放到桌上，并没有剪纸或粘贴。"},{"id":"s5","text":"妈妈整理了厨房，爸爸检查了门窗，但这些不是小雨自己完成的事情。"},{"id":"s6","text":"题目只看离家前小雨实际完成的计划，不把别人做的事或晚上的打算算进去。"}],"question":"选出离家前，小雨已经完成的所有计划事项。","targets":[{"label":"小雨离家前已经完成的所有计划","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"整理书架"},{"id":"o1","text":"制作生日贺卡"},{"id":"o2","text":"给花浇水"},{"id":"o3","text":"整理厨房"}],"answer":["o0","o2"],"explanation":"小雨完成整理书架和浇花；贺卡未做，厨房由妈妈整理。","id":"p1"}],"id":"t1"},{"label":"推迟到晚上的计划","needed":false,"steps":[{"kind":"single","prompt":"选择事项。","options":[{"id":"o0","text":"做贺卡"},{"id":"o1","text":"浇花"},{"id":"o2","text":"整理书架"}],"answer":"o0","explanation":"做贺卡是推迟事项，不是已完成事项。","id":"p1"}],"id":"t2"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s5"],["s1","s2","s4","s5"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s4","s5","s6"]},"taskSpans":["离家前","小雨已经完成的所有计划事项"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b3","level":3},{"id":"T54","title":"别被结尾带走","domain":"reading","skills":["整体概括","干扰筛选"],"passage":[{"id":"s1","text":"小林给班级植物浇水时发现，一盆植物的叶子开始发黄，其他几盆却长得很好。"},{"id":"s2","text":"他没有立刻认定是缺水，而是查看盆土，发现土一直很湿，还把情况告诉了老师。"},{"id":"s3","text":"老师帮助他调整浇水的次数，把花盆移到合适的位置，小林每天记录叶子的变化。"},{"id":"s4","text":"过了一段时间，植物长出了新的绿叶，小林把之前的观察记录整理成一张小表。"},{"id":"s5","text":"他在表格旁边画了一只小猫，小猫戴着帽子，帽子上还有一颗很大的星星。"},{"id":"s6","text":"同桌觉得这只小猫很可爱，邀请他下次帮忙画一张生日卡片。"}],"question":"哪一项最适合作为这段文章的内容概括？","targets":[{"label":"表格旁画的动物","needed":false,"steps":[{"kind":"single","prompt":"选择动物。","options":[{"id":"o0","text":"小狗"},{"id":"o1","text":"小猫"},{"id":"o2","text":"小兔"}],"answer":"o1","explanation":"小猫虽然出现在结尾，但不是主要内容。","id":"p1"}],"id":"t2"},{"label":"最合适的内容概括","needed":true,"steps":[{"kind":"single","prompt":"选择一项。","options":[{"id":"o0","text":"小林只是在练习画戴帽子的小猫。"},{"id":"o1","text":"小林发现植物异常，观察并求助，调整照料方法后记录了变化。"},{"id":"o2","text":"同桌给所有植物换了花盆。"},{"id":"o3","text":"老师让小林每天不停地给植物浇水。"}],"answer":"o1","explanation":"主要叙事是植物问题与观察照料；结尾小猫和生日卡只是附带细节。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出与“发现植物问题、调查、调整照料、观察结果”直接有关的句子。","answers":[["s1","s2","s3","s4"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":["文章的内容概括"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b3","level":3},{"id":"T55","title":"装袋以后还要留下","domain":"math","skills":["多步推理","信息筛选"],"passage":[{"id":"s1","text":"小组做了二十四块小饼干，准备送给参加活动的同学，所有饼干大小相同。"},{"id":"s2","text":"先留下四块给负责帮忙的老师，其余的平均装进五个袋子，每袋的数量一样。"},{"id":"s3","text":"包装时没有弄碎饼干，也没有再烤新饼干，留下给老师的四块不装进这五个袋子。"},{"id":"s4","text":"袋子上印着小花，有两只袋子是蓝色，另外几只是黄色，颜色不影响每袋的数量。"},{"id":"s5","text":"桌上还有六个空纸盒，那是下次活动用的，这次不往纸盒里放饼干。"},{"id":"
