t4"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s2","s3","s5","s6"]},"taskSpans":["红盒、蓝盒、绿盒里分别还剩多少张贴纸"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b3","level":3},{"id":"T57","title":"只多了一个字","domain":"math","skills":["反向审题","限定条件"],"passage":[{"id":"s1","text":"老师安排孩子们分批使用材料，每人只能领一张彩纸，已经领过的人不能再领。"},{"id":"s2","text":"小安和小禾已经各领了一张，小木还没有领，三个人都打算参加接下来的手工活动。"},{"id":"s3","text":"盒子里剩下五张彩纸，足够接待还没领到材料的孩子，但数量充足不等于允许重复领取。"},{"id":"s4","text":"小雨负责登记名字，登记表放在一张圆桌上，旁边有两支笔和一盒彩色夹子。"},{"id":"s5","text":"接下来的判断只按“每人一张，已领不能再领”的规则，不另外改变活动安排。"},{"id":"s6","text":"这里询问的是谁还可以领，不是询问谁桌上已经有彩纸。"}],"question":"选出所有错误的说法。","targets":[{"label":"按规则判断为错误的所有说法","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"小木现在可以领一张。"},{"id":"o1","text":"盒里还有五张，所以小安可以再领一张。"},{"id":"o2","text":"小禾已经领过，不能再领。"},{"id":"o3","text":"小木还没领，所以永远不能领。"}],"answer":["o1","o3"],"explanation":"小安已领不能重复；小木尚未领，现在可领，不是永远不能。","id":"p1"}],"id":"t1"},{"label":"现在还能领材料的人","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小安"},{"id":"o1","text":"小木"},{"id":"o2","text":"小禾"}],"answer":"o1","explanation":"小木可领，但本题形式是选错误说法。","id":"p1"}],"id":"t2"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s5","s6"]},"taskSpans":["所有错误的说法"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b3","level":3},{"id":"T58","title":"同一个总数","domain":"math","skills":["题意等价","条件范围"],"passage":[{"id":"s1","text":"小组把卡片分成两堆，一堆是九张动物卡，另一堆是六张植物卡，两堆没有重复的卡。"},{"id":"s2","text":"这两堆都放在桌面上，抽屉里的旧卡片不参加这次统计，也没有其他种类的卡。"},{"id":"s3","text":"老师问：桌面上这两堆卡片合起来共有多少张？"},{"id":"s4","text":"桌面旁放着一个小盒子，盒里装的是夹子，不是卡片，盒子上的图案也不是实物卡。"},{"id":"s5","text":"同学们可以把问句换个说法，但不能把统计范围从桌面偷偷改成整个教室。"},{"id":"s6","text":"本题只选择问法，不必算出九和六合起来是多少。"}],"question":"选出所有与老师的问题意思相同的问法。","targets":[{"label":"桌面动物卡与植物卡的差","needed":false,"steps":[{"kind":"number","prompt":"填写张数。","answer":3,"explanation":"9-6=3，但不是老师所问的总数。","calc":"9-6","id":"p1"}],"id":"t2"},{"label":"与桌面两堆合计同义的所有问法","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"桌上的动物卡和植物卡一共有几张？"},{"id":"o1","text":"教室里包括抽屉旧卡在内，一共有几张？"},{"id":"o2","text":"把桌面这两堆合在一起，卡片总数是多少？"},{"id":"o3","text":"动物卡比植物卡多几张？"}],"answer":["o0","o2"],"explanation":"两项都只合计桌面两堆；加抽屉改变范围，问相差改变目标。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3"]},"taskSpans":["所有与老师的问题意思相同的问法"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b3","level":3},{"id":"T59","title":"两条规则一起用","domain":"reasoning","skills":["逻辑条件","跨句整合"],"passage":[{"id":"s1","text":"科学体验区规定，参加制作的人必须带好材料包，并且已经在入口登记，两项都要满足。"},{"id":"s2","text":"甲同学带了材料包，但没有登记；乙同学已经登记，但把材料包忘在家里。"},{"id":"s3","text":"丙同学带了材料包，也登记好了；丁同学两项都没有完成，只是先来看看。"},{"id":"s4","text":"工作人员补充：观看展示不用满足这两项，但本题判断的是参加制作，不是观看。"},{"id":"s5","text":"入口旁摆着很多完成的作品，有纸桥、纸风车和小木船，作品种类不改变报名条件。"},{"id":"s6","text":"请根据现在的情况判断，不假设某位同学马上会补做登记或拿到材料包。"}],"question":"选出所有现在不能参加制作的同学。","targets":[{"label":"现在能够参加制作的同学","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"乙同学"},{"id":"o1","text":"丙同学"},{"id":"o2","text":"甲同学"},{"id":"o3","text":"丁同学"}],"answer":"o1","explanation":"丙能参加，但题目要选不能参加的。","id":"p1"}],"id":"t2"},{"label":"现在不能参加制作的所有同学","needed":true,"steps":[{"kind":"multi","prompt":"多选：找不能参加的。","options":[{"id":"o0","text":"甲同学"},{"id":"o1","text":"乙同学"},{"id":"o2","text":"丙同学"},{"id":"o3","text":"丁同学"}],"answer":["o0","o1","o3"],"explanation":"两项都满足才可参加；甲缺登记、乙缺材料、丁两项都缺，只有丙符合。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s4","s6"]},"taskSpans":["所有现在不能参加制作的同学"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b3","level":3},{"id":"T60","title":"从常识走到计算","domain":"reasoning","skills":["多步推理","常识应用","多问完整"],"passage":[{"id":"s1","text":"木偶人想给一周里的每一天做一张计划卡，一天一张，星期六和星期日也都包括在内。"},{"id":"s2","text":"它已经做好星期一、星期二和星期三的卡片，其他日子的卡片还没有做。"},{"id":"s3","text":"每张还没做好的卡都要用两张小贴纸，已经做好的三张卡不用再贴，也不再计算它们。"},{"id":"s4","text":"桌上有很多不同图案的贴纸，选择什么图案都不会改变每张卡所用的数量。"},{"id":"s5","text":"本题按一周从星期一到星期日共七天计算，不只计算上学的日子。"},{"id":"s6","text":"木偶人会先数没完成的卡，再准备贴纸，最后才考虑给卡片画边框。"}],"question":"还要做多少张计划卡，为这些没做好的卡一共需要多少张小贴纸？","targets":[{"label":"没做好的卡一共需要的小贴纸数","needed":true,"steps":[{"kind":"number","prompt":"第一步：还有多少张卡没做好？","answer":4,"explanation":"7天减去已做3张。","calc":"7-3","id":"p1"},{"kind":"number","prompt":"第二步：每张用2张贴纸，总共需要多少张贴纸？","answer":8,"explanation":"4×2=8。","calc":"(7-3)*2","id":"p2"}],"id":"t2"},{"label":"三张已经做好卡片的数量","needed":false,"steps":[{"kind":"number","prompt":"填写张数。","answer":3,"explanation":"3是已经做好的，不是还需做的。","id":"p1"}],"id":"t3"},{"label":"还没做好的计划卡数","needed":true,"steps":[{"kind":"number","prompt":"第一步：一周共需多少张卡？","answer":7,"explanation":"一周7天，每天1张。","id":"p1"},{"kind":"number","prompt":"第二步：减去已经做好的3张，还要做多少张？","answer":4,"explanation":"7-3=4。","calc":"7-3","id":"p2"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s5"]],"explanation":"核心依据要选全。重复交代同一条件、限定范围或时间的相关补充句可以选，也可以不选；无关背景不应选择。","allowed":["s1","s2","s3","s5"]},"taskSpans":["还要做多少张计划卡","一共需要多少张小贴纸"],"tokens":[],"referenceEdges":[],"mode":"train","round":3,"blockId":"r3b3","level":3},{"id":"V01","title":"博物馆的借用牌","domain":"reading","skills":["多问完整","流程理解"],"passage":[{"id":"s1","text":"博物馆为参观者准备了放大镜，借用时不用交钱，但要把一张借用牌交给服务员保管。"},{"id":"s2","text":"参观完以后，先把放大镜还到服务台，服务员检查完，再把原来的借用牌还给参观者。"},{"id":"s3","text":"小舟已经借到放大镜，现在正站在贝壳展柜前观察，还没有结束参观。"},{"id":"s4","text":"他的帽子和水杯都放在自己的背包里，服务员没有替他保管这些东西。"},{"id":"s5","text":"大厅里有两个模型展台，一边展示船只，一边展示古建筑，地上画着引导参观的箭头。"},{"id":"s6","text":"本题按借用规则和小舟现在的状态判断，不提前把参观结束后的事情当作已经发生。"}],"question":"小舟的借用牌现在由谁保管，他要拿回借用牌前应先归还什么？","targets":[{"label":"背包里没有交出去的物品","needed":false,"steps":[{"kind":"multi","prompt":"选择物品。","options":[{"id":"o0","text":"水杯"},{"id":"o1","text":"帽子"},{"id":"o2","text":"放大镜"}],"answer":["o0","o1"],"explanation":"水杯帽子在背包，但题目不问这些。","id":"p1"}],"id":"t3"},{"label":"拿回借用牌前要归还的物品","needed":true,"steps":[{"kind":"single","prompt":"选择物品。","options":[{"id":"o0","text":"水杯"},{"id":"o1","text":"帽子"},{"id":"o2","text":"放大镜"}],"answer":"o2","explanation":"先还放大镜，检查后才能拿回牌。","id":"p1"}],"id":"t2"},{"label":"借用牌现在的保管者","needed":true,"steps":[{"kind":"single","prompt":"选择保管者。","options":[{"id":"o0","text":"小舟自己"},{"id":"o1","text":"服务员"},{"id":"o2","text":"同学"}],"answer":"o1","explanation":"小舟仍在使用放大镜，借用牌由服务员保管。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s4"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":["现在由谁保管","应先归还什么"],"tokens":[],"referenceEdges":[],"mode":"validation","round":1,"blockId":"r1b2","level":1},{"id":"V02","title":"给鸟准备食物","domain":"math","skills":["多步推理","条件整合"],"passage":[{"id":"s1","text":"观察站原来准备了三十二小份鸟食，打算放进不同的喂食器，喂食器外面贴着编号。"},{"id":"s2","text":"工作人员检查时发现六份受潮，立即移走，不能用来喂鸟，也不再放回。"},{"id":"s3","text":"剩下的鸟食中，先取出八份留在室内备用，其余才放到户外喂食器里。"},{"id":"s4","text":"当天天气转凉，志愿者多穿了外套，但没有临时增加或减少户外喂食的数量。"},{"id":"s5","text":"室内还存着其他未开封的大袋鸟食，那些不属于这次的三十二小份，不计入本题。"},{"id":"s6","text":"请计算本次真正放到户外的数量，不能把坏掉的或留作备用的都算在户外。"}],"question":"这次放到户外喂食器里的鸟食有多少小份？","targets":[{"label":"本次放到户外的鸟食份数","needed":true,"steps":[{"kind":"number","prompt":"第一步：移走受潮部分后还剩多少份？","answer":26,"explanation":"32-6=26。","calc":"32-6","id":"p1"},{"kind":"number","prompt":"第二步：再留出室内备用的8份，户外有多少份？","answer":18,"explanation":"26-8=18。","calc":"32-6-8","id":"p2"}],"id":"t1"},{"label":"移走受潮部分后的总份数","needed":false,"steps":[{"kind":"number","prompt":"填写份数。","answer":26,"explanation":"26中还包括室内备用的8份，不是户外数。","calc":"32-6","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s5"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"validation","round":1,"blockId":"r1b2","level":1},{"id":"V03","title":"谁应该拿哪一张","domain":"reasoning","skills":["跨句整合","多问完整"],"passage":[{"id":"s1","text":"社区发给三位志愿者不同的任务卡，扫地卡给小桥，浇水卡给小川，擦窗卡给小湾。"},{"id":"s2","text":"发卡时工作人员拿错了：小桥实际拿到浇水卡，小川实际拿到扫地卡，小湾拿到擦窗卡。"},{"id":"s3","text":"开始工作之前，负责人发现问题，要求先把拿错的两张卡交换回来，再按正确分工行动。目前两张卡还没有交换。"},{"id":"s4","text":"三位志愿者还没有开始扫地、浇水或擦窗，因此不能用已经做了什么来猜分工。"},{"id":"s5","text":"任务卡都是白底黑字，大小相同，背面还画着活动中心的图案。"},{"id":"s6","text":"题目同时区分现在拿到的卡和本来应拿的卡，不要把两种情况混在一起。"}],"question":"小桥现在拿着什么卡，小桥本来应该拿什么卡？","targets":[{"label":"小桥本来应该拿的卡","needed":true,"steps":[{"kind":"single","prompt":"选择任务卡。","options":[{"id":"o0","text":"擦窗卡"},{"id":"o1","text":"浇水卡"},{"id":"o2","text":"扫地卡"}],"answer":"o2","explanation":"最初正确分工是扫地卡给小桥。","id":"p1"}],"id":"t2"},{"label":"不用换卡的人","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小湾"},{"id":"o1","text":"小川"},{"id":"o2","text":"小桥"}],"answer":"o0","explanation":"小湾拿对卡，但题目问小桥的两种卡。","id":"p1"}],"id":"t3"},{"label":"小桥现在实际拿到的卡","needed":true,"steps":[{"kind":"single","prompt":"选择任务卡。","options":[{"id":"o0","text":"扫地卡"},{"id":"o1","text":"浇水卡"},{"id":"o2","text":"擦窗卡"}],"answer":"o1","explanation":"发错后小桥实际拿到浇水卡，尚未换回。","id":"p1"}],"id":"t1"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s4"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"validation","round":1,"blockId":"r1b2","level":1},{"id":"V04","title":"餐桌上的名单","domain":"reading","skills":["限定条件","信息筛选"],"passage":[{"id":"s1","text":"午餐前，老师给每张桌子准备一份名单，上面分别写了今天吃米饭和吃面条的同学。"},{"id":"s2","text":"第一桌吃米饭的是小松、小竹，吃面条的是小梅；第二桌的名单放在另一张纸上。"},{"id":"s3","text":"开饭前，小梅改为吃米饭，老师只修改了第一桌这一个名字的类别，其他人的安排都没变。"},{"id":"s4","text":"今天小兰请假，她的名字虽然还在旧座位表里，但不在今天任何一份午餐名单上。"},{"id":"s5","text":"食堂窗边放着几盆花，墙上写着节约粮食，餐盘旁还放了洗净的勺子。"},{"id":"s6","text":"请按照第一桌修改后的实际名单作答，不使用旧座位表，也不把第二桌的人算进来。"}],"question":"选出今天第一桌最后吃米饭的所有同学。","targets":[{"label":"第一桌原先吃面条的同学","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小竹"},{"id":"o1","text":"小兰"},{"id":"o2","text":"小梅"}],"answer":"o2","explanation":"小梅是修改前，不是最后的面条安排。","id":"p1"}],"id":"t2"},{"label":"第一桌最后吃米饭的全部同学","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"小松"},{"id":"o1","text":"小竹"},{"id":"o2","text":"小梅"},{"id":"o3","text":"小兰"}],"answer":["o0","o1","o2"],"explanation":"小松小竹原本吃米饭，小梅后来也改为米饭；小兰请假。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s2","s3","s4","s6"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"validation","round":1,"blockId":"r1b4","level":1},{"id":"V05","title":"带伞能说明什么","domain":"reasoning","skills":["无法确定","逻辑判断"],"passage":[{"id":"s1","text":"小路早上出门时带了一把伞，伞柄上挂着一根红绳，书包里还装着一件薄外套。"},{"id":"s2","text":"他对家人说：“我把伞带着备用，至于会不会下雨，我现在还不知道。”"},{"id":"s3","text":"放学时的记录只写着他拿着伞走出校门，没有写他是否撑开伞，也没有写天气。"},{"id":"s4","text":"家人后来把伞放进门后的伞桶，但没有留下伞面是湿是干的记录。"},{"id":"s5","text":"有些同学带伞是为了防雨，有些人也会用伞遮阳，单看拿着伞这个动作还不够。"},{"id":"s6","text":"请分清原文明确写出的事实和仅凭这些事实还不能确定的事情。"}],"question":"选出所有无法根据原文确定的事情。","targets":[{"label":"原文无法确定的全部事情","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"小路出门时是否带伞。"},{"id":"o1","text":"放学时有没有下雨。"},{"id":"o2","text":"小路放学时是否撑开了伞。"},{"id":"o3","text":"伞柄上有没有红绳。"}],"answer":["o1","o2"],"explanation":"出门带伞和红绳写得明确；天气与是否撑开未写，不能由拿伞推出。","id":"p1"}],"id":"t1"},{"label":"原文明确写出的随身物品","needed":false,"steps":[{"kind":"single","prompt":"选择物品。","options":[{"id":"o0","text":"伞"},{"id":"o1","text":"足球"},{"id":"o2","text":"花盆"}],"answer":"o0","explanation":"伞明确写出，但题目要求不能确定的事情。","id":"p1"}],"id":"t2"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s4","s5"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"validation","round":1,"blockId":"r1b4","level":1},{"id":"V06","title":"免票规则以后","domain":"math","skills":["多步推理","信息筛选"],"passage":[{"id":"s1","text":"亲子参观活动共有十二位大人和八位小朋友，一起到入口领取参观票，门旁摆着地图。"},{"id":"s2","text":"规则规定每位大人一张票，小朋友中有三位符合免票条件，这三位不用领取参观票。"},{"id":"s3","text":"其余小朋友每人领一张票，所有人都只进场一次，没有人重复领票，也没有人临时离开。"},{"id":"s4","text":"工作人员准备了很多备用票，所以不必考虑票不够的情况，只要算实际要发出的张数。"},{"id":"s5","text":"旁边的导览册每组可以拿一本，但导览册不是参观票，不能混在同一个数量里计算。"},{"id":"s6","text":"请先找出需要领票的小朋友人数，再加上大人的票数。"}],"question":"这一队实际需要领取多少张参观票？","targets":[{"label":"这一队的总人数","needed":false,"steps":[{"kind":"number","prompt":"填写人数。","answer":20,"explanation":"总人数20，但3人免票。","calc":"12+8","id":"p1"}],"id":"t2"},{"label":"实际需要领取的参观票总数","needed":true,"steps":[{"kind":"number","prompt":"第一步：需要领票的小朋友有多少位？","answer":5,"explanation":"8位小朋友中3位免票。","calc":"8-3","id":"p1"},{"kind":"number","prompt":"第二步：加上12位大人的票，共多少张？","answer":17,"explanation":"12+5=17。","calc":"12+8-3","id":"p2"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"validation","round":2,"blockId":"r2b2","level":2},{"id":"V07","title":"不能只看盒子上的字","domain":"reading","skills":["多问完整","指代追踪"],"passage":[{"id":"s1","text":"美术室里有一个写着“蜡笔”的旧盒子和一个写着“胶棒”的旧盒子，标签还没来得及更换。"},{"id":"s2","text":"今天整理时，老师实际把剪刀装进写着“蜡笔”的盒子，把蜡笔装进写着“胶棒”的盒子。"},{"id":"s3","text":"小舟需要画画，老师指着写着“胶棒”的盒子说：“把它拿来，蜡笔现在放在这里。”"},{"id":"s4","text":"剪刀只允许在老师看护下使用，小舟这次没有需要剪纸，也不准备拿装剪刀的盒子。"},{"id":"s5","text":"柜子最下面还有一些空纸箱，那些箱子里没有放工具，不属于上面提到的两个盒子。"},{"id":"s6","text":"请依据今天实际装进去的东西判断，不要只根据旧标签猜里面有什么。"}],"question":"老师说的“它”指哪个盒子，这个盒子现在实际装着什么？","targets":[{"label":"这个盒子实际装的物品","needed":true,"steps":[{"kind":"single","prompt":"选择物品。","options":[{"id":"o0","text":"剪刀"},{"id":"o1","text":"胶棒"},{"id":"o2","text":"蜡笔"}],"answer":"o2","explanation":"今天蜡笔实际装在写胶棒的盒子。","id":"p1"}],"id":"t2"},{"label":"写着“蜡笔”的盒子实际装的物品","needed":false,"steps":[{"kind":"single","prompt":"选择物品。","options":[{"id":"o0","text":"剪刀"},{"id":"o1","text":"蜡笔"},{"id":"o2","text":"橡皮"}],"answer":"o0","explanation":"这个盒子装剪刀，但不是代词所指。","id":"p1"}],"id":"t3"},{"label":"“它”指的盒子","needed":true,"steps":[{"kind":"single","prompt":"选择盒子。","options":[{"id":"o0","text":"写着“蜡笔”的盒子"},{"id":"o1","text":"写着“胶棒”的盒子"},{"id":"o2","text":"最下面的空纸箱"}],"answer":"o1","explanation":"老师指着写胶棒的盒子说把它拿来。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s4"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[{"id":"w1","sid":"s3","start":11,"end":20,"text":"写着“胶棒”的盒子","kind":"noun"},{"id":"w2","sid":"s3","start":24,"end":25,"text":"它","kind":"pronoun"},{"id":"w3","sid":"s2","start":30,"end":39,"text":"写着“胶棒”的盒子","kind":"noun"},{"id":"w4","sid":"s1","start":23,"end":25,"text":"胶棒","kind":"noun"},{"id":"w5","sid":"s1","start":10,"end":12,"text":"蜡笔","kind":"noun"},{"id":"w6","sid":"s2","start":15,"end":24,"text":"写着“蜡笔”的盒子","kind":"noun"},{"id":"w7","sid":"s2","start":11,"end":13,"text":"剪刀","kind":"noun"},{"id":"w8","sid":"s2","start":33,"end":35,"text":"胶棒","kind":"noun"},{"id":"w9","sid":"s2","start":18,"end":20,"text":"蜡笔","kind":"noun"},{"id":"w10","sid":"s2","start":26,"end":28,"text":"蜡笔","kind":"noun"},{"id":"w11","sid":"s3","start":14,"end":16,"text":"胶棒","kind":"noun"},{"id":"w12","sid":"s3","start":28,"end":30,"text":"蜡笔","kind":"noun"},{"id":"w13","sid":"s3","start":34,"end":36,"text":"这里","kind":"pronoun"},{"id":"w14","sid":"s4","start":0,"end":2,"text":"剪刀","kind":"noun"},{"id":"w15","sid":"s4","start":31,"end":33,"text":"剪刀","kind":"noun"}],"referenceEdges":[["w1","w2"]],"mode":"validation","round":2,"blockId":"r2b2","level":2},{"id":"V08","title":"午餐后的观察","domain":"reading","skills":["整体概括","证据整合"],"passage":[{"id":"s1","text":"午餐后，值日生发现有些同学的餐盘里留下了不少饭菜，收餐时常常倒掉很多。"},{"id":"s2","text":"小队没有马上批评谁，而是观察几天，询问大家为什么吃不完，把原因记下来。"},{"id":"s3","text":"他们发现有的人第一次盛得太多，便建议先盛适量，吃完仍饿可以再添。"},{"id":"s4","text":"老师同意试一周，小队每天记录剩饭情况，一周后发现倒掉的饭菜减少了。"},{"id":"s5","text":"大家把观察和尝试的过程做成小展板，提醒其他班也可以根据情况调整盛饭方式。"},{"id":"s6","text":"展板边上画着青菜和小碗，其中一只小碗有蓝色花纹，看起来十分漂亮。"}],"question":"哪个标题最能概括文章的主要内容？","targets":[{"label":"最合适的文章标题","needed":true,"steps":[{"kind":"single","prompt":"选择标题。","options":[{"id":"o0","text":"一只漂亮的蓝花碗"},{"id":"o1","text":"先观察再尝试，让午餐少浪费"},{"id":"o2","text":"同学们再也不吃午饭"},{"id":"o3","text":"值日生每天只负责画菜"}],"answer":"o1","explanation":"主要是发现浪费、调查原因、尝试办法、记录结果，花碗是细节。","id":"p1"}],"id":"t1"},{"label":"展板上小碗的花纹颜色","needed":false,"steps":[{"kind":"single","prompt":"选择颜色。","options":[{"id":"o0","text":"红色"},{"id":"o1","text":"蓝色"},{"id":"o2","text":"绿色"}],"answer":"o1","explanation":"蓝色是细节，不能代表主旨。","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出描述小队发现问题、调查、尝试办法和结果的句子。","answers":[["s1","s2","s3","s4","s5"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"validation","round":2,"blockId":"r2b2","level":2},{"id":"V09","title":"订好了还没有取走","domain":"math","skills":["题意识别","计划实际"],"passage":[{"id":"s1","text":"班级义卖做了二十个手工徽章，摆在桌上，老师给每个徽章贴了统一的价格标签。"},{"id":"s2","text":"上午有六个徽章已经卖出并被买走，还有四个只是被预约，仍留在桌上，尚未付款取走。"},{"id":"s3","text":"工作人员把这四个预约徽章放在桌子右边的小盘里，其余未卖出的放在桌子左边。"},{"id":"s4","text":"桌下还有一盒没有做完的材料，那些不是成品徽章，不加入二十个成品的统计。"},{"id":"s5","text":"午间盘点的时候，预约的人还没有到，没有新的销售，也没有徽章丢失。"},{"id":"s6","text":"本题问桌上实际还在的成品，不是问现在还可以自由出售的数量。"}],"question":"午间盘点时，桌上实际还有多少个成品徽章？","targets":[{"label":"桌上实际还在的成品徽章数","needed":true,"steps":[{"kind":"number","prompt":"填写个数。","answer":14,"explanation":"20个中只有6个被拿走，预约4个仍在桌上。","calc":"20-6","id":"p1"}],"id":"t1"},{"label":"未卖出也未被预约的徽章数","needed":false,"steps":[{"kind":"number","prompt":"填写个数。","answer":10,"explanation":"20-6-4=10是可继续预约的，不是桌上所有。","calc":"20-6-4","id":"p1"}],"id":"t2"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s5","s6"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"validation","round":2,"blockId":"r2b4","level":2},{"id":"V10","title":"通知换说法","domain":"reading","skills":["题意等价","多项任务"],"passage":[{"id":"s1","text":"社区通知参加者：“请把姓名写在卡片正面，把联系电话写在卡片背面，两项都要填写。”"},{"id":"s2","text":"卡片正面上方画着一只纸鹤，背面下方印着活动日期，印好的内容不用再抄写。"},{"id":"s3","text":"工作人员提醒，写了姓名不能代替写电话，写了电话也不能代替写姓名，位置也不能交换。"},{"id":"s4","text":"小禾拿到一支黑笔，坐在靠窗的位置，准备先读清要求再开始填写。"},{"id":"s5","text":"门口的宣传栏有另一场活动的通知，但那不是本次填写卡片的规则。"},{"id":"s6","text":"下面要判断哪些改写保留了原通知全部的填写要求，不用真的写个人姓名或电话号码。"}],"question":"选出所有完整保留原通知要求的说法。","targets":[{"label":"完整保留原通知要求的所有说法","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"正面写姓名，背面写联系电话。"},{"id":"o1","text":"只要在正面写上姓名就可以。"},{"id":"o2","text":"卡片两面都要填写：姓名放正面，联系电话放背面。"},{"id":"o3","text":"正面写联系电话，背面写姓名。"}],"answer":["o0","o2"],"explanation":"必须两项齐全且位置正确；只填一项和调换位置均不等价。","id":"p1"}],"id":"t1"},{"label":"卡片印着的图案","needed":false,"steps":[{"kind":"single","prompt":"选择图案。","options":[{"id":"o0","text":"纸鹤"},{"id":"o1","text":"风车"},{"id":"o2","text":"星星"}],"answer":"o0","explanation":"图案是背景信息，题目问通知要求。","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s3","s6"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"validation","round":2,"blockId":"r2b4","level":2},{"id":"V11","title":"还缺多少份","domain":"math","skills":["多步推理","数量目标"],"passage":[{"id":"s1","text":"科学活动需要给十八个小组各准备一份材料，每组一份，不能两组共用同一份。"},{"id":"s2","text":"工作人员已经准备好十三份，检查时又发现其中两份少了零件，暂时不能使用。"},{"id":"s3","text":"暂时不能使用的两份被移到维修台，本题中不算已经准备好的可用材料，也没有马上修好。"},{"id":"s4","text":"仓库里还有一些纸盒和绳子，但它们还没有组成完整材料包，不能当作现成的一份。"},{"id":"s5","text":"所有十八个小组都会按时参加，没有小组退出，也不会临时增加小组。"},{"id":"s6","text":"请计算还需要补齐多少份完整可用的材料，而不是只看桌上原来有多少个盒子。"}],"question":"还需要补齐多少份可用材料？","targets":[{"label":"还需要补齐的可用材料份数","needed":true,"steps":[{"kind":"number","prompt":"第一步：目前真正可用的有多少份？","answer":11,"explanation":"13-2=11。","calc":"13-2","id":"p1"},{"kind":"number","prompt":"第二步：十八组共需18份，还缺多少份？","answer":7,"explanation":"18-11=7。","calc":"18-(13-2)","id":"p2"}],"id":"t1"},{"label":"目前真正可用的材料数","needed":false,"steps":[{"kind":"number","prompt":"填写份数。","answer":11,"explanation":"11是现有可用，不是还缺。","calc":"13-2","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s5"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"validation","round":3,"blockId":"r3b2","level":3},{"id":"V12","title":"跟着说话人走","domain":"reading","skills":["指代追踪","多问完整"],"passage":[{"id":"s1","text":"摄影活动结束后，小湾发现自己的相机套还在小桥的背包里，便走过去提醒他。"},{"id":"s2","text":"小桥对小湾说：“我先把相机套还给你，等我整理好背包，我们再一起去还三脚架。”"},{"id":"s3","text":"小湾接过相机套，说：“谢谢，我去门边等你。”随后小湾走到了门旁。"},{"id":"s4","text":"三脚架是活动中心借给他们的，需要一起归还；相机套则一直是小湾自己的。"},{"id":"s5","text":"老师在走廊里收别的小组的记录纸，没有替这两位同学拿相机套或三脚架。"},{"id":"s6","text":"此时背包还在整理，三脚架也没有归还，不能把准备做的事当成已经完成。"}],"question":"“我先把相机套还给你”中的“我”是谁，“我们再一起去”中的“我们”包括哪些人？","targets":[{"label":"“我们再一起去”的“我们”","needed":true,"steps":[{"kind":"multi","prompt":"选出包含的所有人物。","options":[{"id":"o0","text":"小桥"},{"id":"o1","text":"小湾"},{"id":"o2","text":"老师"}],"answer":["o0","o1"],"explanation":"小桥对小湾说我们，指一起借用器材的两人，不含老师。","id":"p1"}],"id":"t2"},{"label":"“我先把相机套还给你”的“我”","needed":true,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小湾"},{"id":"o1","text":"老师"},{"id":"o2","text":"小桥"}],"answer":"o2","explanation":"这段话由小桥说。","id":"p1"}],"id":"t1"},{"label":"相机套原来的主人","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小湾"},{"id":"o1","text":"老师"},{"id":"o2","text":"小桥"}],"answer":"o0","explanation":"主人是小湾，但第一问问的是说我的人。","id":"p1"}],"id":"t3"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s4","s6"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[{"id":"w1","sid":"s2","start":0,"end":2,"text":"小桥","kind":"noun"},{"id":"w2","sid":"s2","start":8,"end":9,"text":"我","kind":"pronoun"},{"id":"w3","sid":"s2","start":0,"end":5,"text":"小桥对小湾","kind":"noun"},{"id":"w4","sid":"s2","start":26,"end":28,"text":"我们","kind":"pronoun"},{"id":"w5","sid":"s1","start":20,"end":22,"text":"小桥","kind":"noun"},{"id":"w6","sid":"s1","start":8,"end":10,"text":"小湾","kind":"noun"},{"id":"w7","sid":"s1","start":12,"end":14,"text":"自己","kind":"pronoun"},{"id":"w8","sid":"s1","start":33,"end":34,"text":"他","kind":"pronoun"},{"id":"w9","sid":"s2","start":3,"end":5,"text":"小湾","kind":"noun"},{"id":"w10","sid":"s2","start":16,"end":17,"text":"你","kind":"pronoun"},{"id":"w11","sid":"s2","start":19,"end":20,"text":"我","kind":"pronoun"},{"id":"w12","sid":"s2","start":26,"end":27,"text":"我","kind":"pronoun"},{"id":"w13","sid":"s3","start":0,"end":2,"text":"小湾","kind":"noun"},{"id":"w14","sid":"s3","start":24,"end":26,"text":"小湾","kind":"noun"},{"id":"w15","sid":"s3","start":19,"end":20,"text":"你","kind":"pronoun"},{"id":"w16","sid":"s3","start":14,"end":15,"text":"我","kind":"pronoun"},{"id":"w17","sid":"s4","start":28,"end":30,"text":"小湾","kind":"noun"},{"id":"w18","sid":"s4","start":10,"end":12,"text":"他们","kind":"pronoun"},{"id":"w19","sid":"s4","start":30,"end":32,"text":"自己","kind":"pronoun"},{"id":"w20","sid":"s4","start":10,"end":11,"text":"他","kind":"pronoun"},{"id":"w21","sid":"s5","start":0,"end":2,"text":"老师","kind":"noun"}],"referenceEdges":[["w1","w2"],["w3","w4"]],"mode":"validation","round":3,"blockId":"r3b2","level":3},{"id":"V13","title":"一张表问两件事","domain":"reading","skills":["多问完整","事实提取"],"passage":[{"id":"s1","text":"班级劳动记录写着，周一由小川擦黑板，周二由小桥擦黑板，周三由小湾擦黑板。"},{"id":"s2","text":"这周周二，小桥需要参加合唱排练，老师临时请小川代替小桥完成擦黑板的任务。"},{"id":"s3","text":"周一和周三的安排没有改变，老师也没有增加第四天的记录，劳动表只讨论这三天。"},{"id":"s4","text":"合唱排练在音乐教室，小桥带去了水杯和歌谱，但没有在排练后回班补擦黑板。"},{"id":"s5","text":"班里还有浇花和摆桌椅的任务，它们由其他同学负责，不出现在这张擦黑板表里。"},{"id":"s6","text":"题目要把原安排和实际执行区分开，不能只照抄最早写好的名单。"}],"question":"周二原先安排谁擦黑板，周二实际又是谁擦的？","targets":[{"label":"周二原先安排的人","needed":true,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小川"},{"id":"o1","text":"小桥"},{"id":"o2","text":"小湾"}],"answer":"o1","explanation":"原表周二是小桥。","id":"p1"}],"id":"t1"},{"label":"周二实际擦黑板的人","needed":true,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小川"},{"id":"o1","text":"小桥"},{"id":"o2","text":"小湾"}],"answer":"o0","explanation":"临时请小川代替，小桥未补擦。","id":"p1"}],"id":"t2"},{"label":"周三安排的人","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小川"},{"id":"o1","text":"小桥"},{"id":"o2","text":"小湾"}],"answer":"o2","explanation":"周三是小湾，但题目只问周二。","id":"p1"}],"id":"t3"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s4"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"validation","round":3,"blockId":"r3b2","level":3},{"id":"V14","title":"四张照片没有编号","domain":"reasoning","skills":["多步推理","时间排序"],"passage":[{"id":"s1","text":"种植记录的四张照片被打乱了，分别拍到播种、长出小芽、长出花苞和花朵开放。"},{"id":"s2","text":"记录本上写着，先播种，过几天长出小芽；小芽继续生长后，才出现花苞。"},{"id":"s3","text":"花朵开放发生在出现花苞以后，照片都来自同一株植物的同一轮生长记录，没有跳回过去。"},{"id":"s4","text":"有一张照片拍在早晨，另几张拍在下午，但拍摄时段不能替代生长阶段的先后。"},{"id":"s5","text":"照片背面贴着不同颜色的纸，颜色只是为了装饰，不是时间编号，也不表示拍摄顺序。"},{"id":"s6","text":"请根据记录本中阶段之间的关系来排序，不根据照片的颜色或摆放位置猜测。"}],"question":"把这四个生长阶段按记录中的先后顺序排好。","targets":[{"label":"记录中生长阶段的先后顺序","needed":true,"steps":[{"kind":"order","prompt":"依次点选。","options":[{"id":"o0","text":"花朵开放"},{"id":"o1","text":"长出小芽"},{"id":"o2","text":"播种"},{"id":"o3","text":"长出花苞"}],"answer":["o2","o1","o3","o0"],"explanation":"记录给出的关系是播种→芽→花苞→开放。","id":"p1"}],"id":"t1"},{"label":"四张照片来自几株植物","needed":false,"steps":[{"kind":"number","prompt":"填写株数。","answer":1,"explanation":"同一株，但题目要求排序。","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"validation","round":3,"blockId":"r3b4","level":3},{"id":"V15","title":"正好相反还是没提到","domain":"reasoning","skills":["反向审题","无法确定"],"passage":[{"id":"s1","text":"一份活动记录写着：小桥带来了竹蜻蜓，小湾带来了纸风车，两件作品都能转动。"},{"id":"s2","text":"小桥的竹蜻蜓是昨天做的，小湾的纸风车是今天早晨做的，制作时间写得很清楚。"},{"id":"s3","text":"记录没有写两件作品分别花了多少钱，也没有写是谁教他们做的。"},{"id":"s4","text":"展示时，两个人轮流介绍自己的作品，介绍完才一起整理桌面，没有交换作品。"},{"id":"s5","text":"桌边放着两杯水，墙上的钟指向下午三点，这些背景不说明作品的材料价格。"},{"id":"s6","text":"这次题目要找与记录明确相反的说法，不把缺少信息、无法判断的说法也算作相反。"}],"question":"选出所有与记录明确矛盾的说法。","targets":[{"label":"与记录明确矛盾的所有说法","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"小桥的竹蜻蜓是今天早晨做的。"},{"id":"o1","text":"小湾的纸风车花了五元。"},{"id":"o2","text":"两个人介绍完以后交换了作品。"},{"id":"o3","text":"两件作品都能转动。"}],"answer":["o0","o2"],"explanation":"竹蜻蜓昨天做；没有交换。五元没记录，属于未知而非已知矛盾；都能转动为真。","id":"p1"}],"id":"t1"},{"label":"无法确定的材料价格","needed":false,"steps":[{"kind":"single","prompt":"选择目前能给出的判断。","options":[{"id":"o0","text":"一定是五元"},{"id":"o1","text":"记录没有说明"},{"id":"o2","text":"一定免费"}],"answer":"o1","explanation":"价格未知，但原题要选明确矛盾的说法。","id":"p1"}],"id":"t2"}],"trap":true,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s4","s6"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"validation","round":3,"blockId":"r3b4","level":3},{"id":"X01","title":"背包里的活动用品","domain":"reading","skills":["多问完整","限定条件"],"passage":[{"id":"s1","text":"自然观察营的通知要求每人带记录本、铅笔和水壶，雨衣由营地统一提供，不用自己带。"},{"id":"s2","text":"小鹿已经把记录本和水壶放进背包，又放进一个自己喜欢的小布偶，但还没有放铅笔。"},{"id":"s3","text":"她看了看天气预报，考虑带一把雨伞，不过通知没有要求必须带雨伞，是否携带由个人决定。"},{"id":"s4","text":"背包侧面还挂着一枚旧徽章，那不是本次活动要求的用品，也不能替代铅笔。"},{"id":"s5","text":"题目中的“缺少”只比较通知明确要求自带的物品，不把可选物品算作必须缺少的东西。"},{"id":"s6","text":"出门前她准备再次核对，以免因为包里看起来装了很多东西，就误以为要求都已满足。"}],"question":"通知要求自带的物品中，小鹿已经带了哪些，还缺哪一种？","targets":[{"label":"由营地统一提供的物品","needed":false,"steps":[{"kind":"single","prompt":"选择物品。","options":[{"id":"o0","text":"铅笔"},{"id":"o1","text":"雨衣"},{"id":"o2","text":"记录本"}],"answer":"o1","explanation":"雨衣由营地提供，但题目问自带物品的已带与缺少。","id":"p1"}],"id":"t3"},{"label":"必须自带且已经放进背包的所有物品","needed":true,"steps":[{"kind":"multi","prompt":"选择全部。","options":[{"id":"o0","text":"记录本"},{"id":"o1","text":"铅笔"},{"id":"o2","text":"水壶"},{"id":"o3","text":"小布偶"}],"answer":["o0","o2"],"explanation":"已放入且属于必带的，是记录本和水壶；布偶不是必带。","id":"p1"}],"id":"t1"},{"label":"必带物品中还缺少的那一种","needed":true,"steps":[{"kind":"single","prompt":"选择物品。","options":[{"id":"o0","text":"雨衣"},{"id":"o1","text":"雨伞"},{"id":"o2","text":"铅笔"}],"answer":"o2","explanation":"铅笔必须带且没放入，雨衣统一提供，雨伞可选。","id":"p1"}],"id":"t2"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s5"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"test","round":4,"blockId":"final","level":3},{"id":"X02","title":"储物柜钥匙的记录","domain":"math","skills":["多步推理","跨句整合"],"passage":[{"id":"s1","text":"体育馆有三十把可借用的储物柜钥匙，开门时全部放在服务台的盒子里。"},{"id":"s2","text":"上午借给来运动的人十一把，午间其中四把归还，服务员把归还的钥匙放回原盒。"},{"id":"s3","text":"下午又从盒里借出六把，之后到这次清点之前没有任何归还或新借出。"},{"id":"s4","text":"门边有一串工作人员办公室的钥匙，但它们不是储物柜钥匙，不在三十把的总数里。"},{"id":"s5","text":"服务员还登记了毛巾借用情况，不过毛巾和钥匙是分开统计的，不能合在一个数量里。"},{"id":"s6","text":"现在要清点盒里现有多少把，也要知道还有多少把储物柜钥匙在外面尚未归还。"}],"question":"盒里现在有多少把储物柜钥匙，外面还有多少把没有归还？","targets":[{"label":"外面尚未归还的储物柜钥匙数","needed":true,"steps":[{"kind":"number","prompt":"第一步：上午借出去的11把中，还有多少把未还？","answer":7,"explanation":"11-4=7。","calc":"11-4","id":"p1"},{"kind":"number","prompt":"第二步：再算下午借出去的6把，外面共有多少把？","answer":13,"explanation":"7+6=13；与盒里17把合计30。","calc":"11-4+6","id":"p2"}],"id":"t2"},{"label":"全部储物柜钥匙总数","needed":false,"steps":[{"kind":"number","prompt":"填写把数。","answer":30,"explanation":"总量30保持不变，但题目分别问内外。","id":"p1"}],"id":"t3"},{"label":"盒里现在的储物柜钥匙数","needed":true,"steps":[{"kind":"number","prompt":"第一步：上午借出并归还4把后，盒里有多少把？","answer":23,"explanation":"30-11+4=23。","calc":"30-11+4","id":"p1"},{"kind":"number","prompt":"第二步：下午又借出6把后，盒里有多少把？","answer":17,"explanation":"23-6=17。","calc":"30-11+4-6","id":"p2"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s4","s6"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"test","round":4,"blockId":"final","level":3},{"id":"X03","title":"两个人说的“你”","domain":"reading","skills":["指代追踪","多问完整"],"passage":[{"id":"s1","text":"小河和小山一起准备演出，小河负责拿灯，小山负责搬道具箱，两人正在讨论先后。"},{"id":"s2","text":"小河对小山说：“你先把箱子放到门边，我把灯接好以后就过去帮你。”"},{"id":"s3","text":"小山照做后回答小河：“你接灯时小心一些，我会在这里等你，不会先把箱子搬上台。”"},{"id":"s4","text":"这段对话中没有第三个人插话，老师正在别的房间检查音乐，暂时没有到门边。"},{"id":"s5","text":"箱子里装着纸做的山和树，灯上有一条长电线，但题目不询问这些物品的数量。"},{"id":"s6","text":"说话人和听话人在两句话之间发生了交换，同一个字在不同句子中可能指不同的人。"}],"question":"“你先把箱子放到门边”的“你”和“你接灯时小心一些”的“你”，分别指谁？","targets":[{"label":"“你接灯时小心一些”的“你”","needed":true,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小山"},{"id":"o1","text":"老师"},{"id":"o2","text":"小河"}],"answer":"o2","explanation":"小山回答小河，听话人换成小河。","id":"p1"}],"id":"t2"},{"label":"“你先把箱子放到门边”的“你”","needed":true,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小河"},{"id":"o1","text":"小山"},{"id":"o2","text":"老师"}],"answer":"o1","explanation":"小河对小山说，听话人是小山。","id":"p1"}],"id":"t1"},{"label":"负责拿灯的人","needed":false,"steps":[{"kind":"single","prompt":"选择人物。","options":[{"id":"o0","text":"小河"},{"id":"o1","text":"小山"},{"id":"o2","text":"老师"}],"answer":"o0","explanation":"小河负责灯，但第一处你并不是小河。","id":"p1"}],"id":"t3"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s4"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[{"id":"w1","sid":"s2","start":3,"end":5,"text":"小山","kind":"noun"},{"id":" 何袋子。"},{"id":"o2","text":"大家先了解实际需要，再尝试减少多余包装。"},{"id":"o3","text":"文章主要介绍海报上小熊的礼物。"}],"answer":["o0","o2"],"explanation":"关键是按需要发袋并验证效果，不是一律禁用；海报不是主线。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出讲“发现包装问题、了解需要、改进办法、观察结果”的句子。","answers":[["s1","s2","s3","s4","s5"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"test","round":4,"blockId":"final","level":3},{"id":"X05","title":"换情境不换关系","domain":"math","skills":["结构等价","数量关系"],"passage":[{"id":"s1","text":"小河要把十五张明信片平均放进三个相册，每本相册放的张数相同，全部放完。"},{"id":"s2","text":"老师问每本相册应放多少张，既没有问需要几本相册，也没有问一共买了多少张明信片。"},{"id":"s3","text":"明信片有山景和海景，两类可以放在同一本相册里，不要求按图片类别分开。"},{"id":"s4","text":"相册封面分别是红色、绿色和蓝色，颜色不改变平均分配的数量关系。"},{"id":"s5","text":"下面的问题换成了不同的物品，判断时要看已知什么、求什么，而不是只看数字或物品名称。"},{"id":"s6","text":"本题不要求算出每本几张，只选择关系结构相同的所有问题。"}],"question":"选出所有同样已知总数和份数、平均分后求每份多少的问题。","targets":[{"label":"原题每本相册的明信片数","needed":false,"steps":[{"kind":"number","prompt":"填写张数。","answer":5,"explanation":"15÷3=5，但本题要选结构。","calc":"15/3","id":"p1"}],"id":"t2"},{"label":"关系结构相同的所有问题","needed":true,"steps":[{"kind":"multi","prompt":"多选。","options":[{"id":"o0","text":"把24瓶水平均分到4个桌子，每桌几瓶？"},{"id":"o1","text":"每桌放4瓶水，24瓶够放几桌？"},{"id":"o2","text":"把18块积木平均放进6个盒子，每盒几块？"},{"id":"o3","text":"原有15张卡，用掉3张，还剩几张？"}],"answer":["o0","o2"],"explanation":"第一第三都是总量÷份数求每份；第二求份数，第四是剩余。","id":"p1"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s5","s6"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"test","round":4,"blockId":"final","level":3},{"id":"X06","title":"先看够不够","domain":"math","skills":["多步推理","数量目标"],"passage":[{"id":"s1","text":"制作活动需要二十根木棒，老师让小组先检查现有材料，不够再去材料台领取。"},{"id":"s2","text":"小组原有十三根木棒，检查时发现三根断裂不能使用，其余都完好。"},{"id":"s3","text":"隔壁小组送来四根完好的木棒，这四根已经放进本组材料盒，可以用于这次制作。"},{"id":"s4","text":"桌上另有几根吸管，吸管不是木棒，不能按这个设计替代木棒，也不算进木棒数量。"},{"id":"s5","text":"断裂的三根不会在本次活动中修好，所以要从可用数量里扣除。"},{"id":"s6","text":"题目问还需要领取多少根，不是问已经拥有的完好木棒有多少根。"}],"question":"为了达到二十根可用木棒，还需要领取多少根？","targets":[{"label":"现在可用木棒的数量","needed":false,"steps":[{"kind":"number","prompt":"填写根数。","answer":14,"explanation":"14是现有量，题目问还需领取的量。","calc":"13-3+4","id":"p1"}],"id":"t2"},{"label":"还需要领取的木棒数","needed":true,"steps":[{"kind":"number","prompt":"第一步：原有木棒中完好的有多少根？","answer":10,"explanation":"13-3=10。","calc":"13-3","id":"p1"},{"kind":"number","prompt":"第二步：加上送来的4根，现在可用多少根？","answer":14,"explanation":"10+4=14。","calc":"13-3+4","id":"p2"},{"kind":"number","prompt":"第三步：达到20根，还需要领取多少根？","answer":6,"explanation":"20-14=6。","calc":"20-(13-3+4)","id":"p3"}],"id":"t1"}],"trap":false,"evidence":{"prompt":"选出直接帮助完成题目要求的句子。可多选，选好后再答题。","answers":[["s1","s2","s3","s4","s5","s6"]],"explanation":"这些句子提供了题目所需的事实；其余句子只交代背景或未被询问的细节。"},"taskSpans":[],"tokens":[],"referenceEdges":[],"mode":"test","round":4,"blockId":"final","level":3},{"id":"X07","title":"同一句话里的多项要求","domain":"reading","skills":["多问完整","任务拆解"],"passage":[{"id":"s1","text":"社区工作坊请两位同学介绍自己的小制作，桌上放着纸桥、小船和几张介绍卡。"},{"id":"s2","text":"小河展示的是纸桥，因为他想试一试纸折起来后能承受多大的重量。"},{"id":"s3","text":"小山展示的是小船，因为他想观察船在水面上能不能保持平稳，而不是测试纸桥重量。"},{"id":"s4","text":"两个人使用的材料都经过老师检查，桌上的介绍卡分别放在自己的作品旁，没有互换。"},{"id":"s5","text":"主持人先让他们观察自己的作品，再请他们把作品名称和选择这个作品的理由说清楚。"},{"id":"s6","text":"现场还有彩灯和背景音乐，但题目只问这两位同学的作品及其理由。"}],"question":"分别说出小河的作品和理由，以及小山的作品和理由。","targets":[{"label":"工作坊里播放的声音","needed":false,"steps":[{"kind":"single","prompt":"选择声音。","options":[{"id":"o0","text":"背景音乐"},{"id":"o1","text":"广播体操口令"},{"id":"o2","text":"火车鸣笛"}],"answer":"o0","explanation":"背景音乐不是被询问内容。","id":"p1"}],"id":"t5"},{"label":"小河选择的理由","needed":true,"steps":[{"kind":"single","prompt":"选择理由。","options":[{"id":"o0","text":"观察水面平稳性"},{"id":"o1","text":"测试折纸桥承重"},{"id":"o2","text":"让风车转动"}],"answer":"o1","explanation":"想试折纸后承受多大重量。","id":"p1"}],"id":"t2"},{"label":"小山展示的作品","needed":true,"steps":[{"kind":"single","prompt":"选择作品。","options":[{"id":"o0","text":"纸桥"},{"id":"o   const allowed=q.evidence.allowed||expectedEvidence;
  evidenceCorrect=q.evidence.allowed ? variants.some(a=>a.every(v=>chosen.includes(v)))&&chosen.every(v=>allowed.includes(v)) : variants.some(a=>sameSet(chosen,a));

 }

 const finalCountCorrect=training?(r.finalCount??r.initialCount)===needed.length:null;
 return {qid:q.id,mode:r.mode,neededCount:needed.length,missingTargets,extraTargets,steps,correctSteps:steps.filter(s=>s.correct).length,totalSteps:steps.length,answersCorrect,evidenceCorrect,missingEvidence,extraEvidence,expectedEvidence,initialCountCorrect,finalCountCorrect,
 allCorrect:answersCorrect&&(!training||(evidenceCorrect&&initialCountCorrect&&finalCountCorrect)),
 finalCorrect:answersCorrect&&(!training||(evidenceCorrect&&finalCountCorrect))};
}
function makePlan(){const plan=[];for(let round=1;round<=3;round++){

function summarize(bank,records){

 if(g.evidenceCorrect!==null){m.evidenceQuestions++;m.evidenceCorrect+=+g.evidenceCorrect;m.evidenceNeeded+=g.expectedEvidence.length;m.evidenceMissing+=g.missingEvidence.length;m.evidenceExtra+=g.extraEvidence.length;}
 if(g.initialCountCorrect!==null){m.countQuestions++;m.countCorrect+=+g.initialCountCorrect;m.selfCorrectedCount+=+(!g.initialCountCorrect&&g.finalCountCorrect);}
 m.assistedQuestions+=+(Array.isArray(r.toolsUsed)&&r.toolsUsed.length>0);
 for(const skill of q.skills||[]){m.skills[skill]??={total:0,correct:0};m.skills[skill].total++;m.skills[skill].correct+=+g.answersCorrect;}
 }return out;
}
function validateImportedState(data,bank){
 if(!data||data.version!==1||!Array.isArray(data.records)||data.records.length>bank.length)throw Error('记录格式或版本不正确。');
 const map=new Map(bank.map(q=>[q.id,q])),seen=new Set();
 for(const r of data.records){
  const q=map.get(r.qid);if(!q||seen.has(r.qid))throw Error('记录含未知或重复题号。');seen.add(r.qid);
  if(!['train','validation','test'].includes(r.mode)||q.mode&&q.mode!==r.mode||q.blockId&&r.blockId!==q.blockId)throw Error('题目分组不匹配。');
  if(!r.responses||typeof r.responses!=='object'||Array.isArray(r.responses))throw Error('作答内容格式不正确。');
  for(const [tid,answers] of Object.entries(r.responses)){
   const t=q.targets.find(t=>t.id===tid);if(!t||!answers||typeof answers!=='object'||Array.isArray(answers))throw Error('含未知回答对象。');
   for(const [sid,value] of Object.entries(answers)){
    const s=t.steps.find(s=>s.id===sid);if(!s)throw Error('含未知步骤。');
    if(['multi','order'].includes(s.kind)){if(!Array.isArray(value)||value.length>30||!value.every(v=>typeof v==='string'&&(s.options||[]).some(o=>o.id===v))||new Set(value).size!==value.length)throw Error('选项格式不正确。');}
    else if(typeof value!=='string'&&typeof value!=='number')throw Error('答案格式不正确。');
   }
  }
  if(r.mode==='train'&&(!Number.isInteger(r.initialCount)||r.initialCount<1||r.initialCount>6||!Number.isInteger(r.finalCount)||r.finalCount<1||r.finalCount>6))throw Error('内容项数不正确。');
  if(r.evidence&&(!Array.isArray(r.evidence)||!r.evidence.every(id=>(q.passage||[]).some(s=>s.id===id))))throw Error('信息标记格式不正确。');
 }
 const plan=makePlan(),validBlocks=new Set(plan.map(x=>x.id));
 const closed=Array.isArray(data.closedBlocks)?data.closedBlocks:[];
 if(!closed.every(id=>validBlocks.has(id)))throw Error('包含未知训练分组。');
 for(const id of closed){const expected=bank.filter(q=>q.blockId===id);if(expected.some(q=>!seen.has(q.id)))throw Error('分组尚未答完，不能标记为已交卷。');}
 return {version:1,bankVersion:data.bankVersion||'1.0',records:data.records,closedBlocks:[...new Set(closed)],draft:null};
}
return {sameSet,isStepCorrect,scoreQuestion,makePlan,summarize,validateImportedState};
});

function skillRows(sum){const keys=new Set([...Object.keys(sum.train.skills),...Object.keys(sum.validation.skills),...Object.keys(sum.test.skills)]);if(!keys.size)return '<tr><td colspan="3" class="muted">尚无已计分的作答记录。</td></tr>';return [...keys].sort((a,b)=>a.localeCompare(b,'zh-CN')).map(k=>{const t=sum.train.skills[k]||{correct:0,total:0},v=sum.validation.skills[k]||{correct:0,total:0},x=sum.test.skills[k]||{correct:0,total:0};return `<tr><td>${esc(k)}</td><td>${t.total?`${t.correct} / ${t.total}`:'—'}</td><td>${v.total+x.total?`${v.correct+x.correct} / ${v.total+x.total}`:'—'}</td></tr>`;}).join('');}
function showModal(kind){modal=kind;previousFocus=document.activeElement;let content='';
 if(kind==='help'||kind==='count-help')content=`<h2>${kind==='count-help'?'“一项内容”怎么数？':'把阅读变成几个清楚的动作'}</h2><p>数的是原题要求分别报告的内容，不是问号、选项或计算步骤。</p><div class="example">“甲和乙分别有多少张卡？” → <strong>2 项</strong>：甲的数量、乙的数量。<br>“选出所有错误的说法。” → <strong>1 项</strong>判断任务，即使要勾选多个选项。<br>“还剩多少张？写出计算步骤。” → <strong>1 项</strong>所求内容，过程中的每一步另行检查。</div><h3>训练时</h3><p>先判断有几项，再从原文点选依据。选择题目要求的作答内容。每次保存后，固定问你是否还有没答完的内容，最后统一核对。</p><h3>验证与综合测试时</h3><p>不强制数项，不提示标信息，也不能打开阅读草稿。仍可反复阅读原文。逐题提交后不显示对错，整组交卷后才看解析。</p><h3>阅读草稿</h3><p>需要时按按钮开启。指代题可以从名称拖到代词，也可以依次点击或用键盘选择。线条只表示你自己的想法，不会自动给正确配对，也不计分。</p><div class="modal-actions">${btn('知道了','close-modal','primary full')}</div>`;
 if(kind==='settings')content=`<h2>本练习记录</h2><p>这个程序不上传作答数据。记录保存在当前浏览器里；换设备、清理浏览器或换一个文件位置时，记录可能不会跟着移动。</p><div class="notice info mt18">关闭页面前可导出 JSON 备份。导入时保留已提交记录；未提交的半题草稿不导入，避免恢复到不一致的状态。</div><div class="modal-actions">${btn(icon('download')+'导出备份','export','primary')}${btn('导入备份','import','')}<input class="file-input" id="import-file" type="file" accept=".json,application/json"></div>${damagedRaw?`<div class="modal-actions">${btn('导出故障原始数据','export-damaged','')}</div>`:''}<div class="divider"></div><h3>重新开始</h3><p>会删除本浏览器内的全部作答记录，包括未交卷的验证。建议先导出备份。再次做同样的题目，不应当作首次独立验证。</p><div class="modal-actions">${btn('清理本练习进度…','reset-confirm','danger')}${btn('返回','close-modal','')}</div><p class="small mt24">MVP 1.0 · 90 道固定题 · 纯前端离线程序。代码中含标准答案，不提供考试防作弊保护。</p>`;
 if(kind==='reset')content=`<h2>确定清理本练习进度…？</h2><p>将删除已提交的 ${state.records.length} 道题记录和当前草稿。这个操作不能直接撤销；已经导出的备份文件不会删除。</p><div class="modal-actions">${btn('先导出备份','export','')}${btn('确认清理','reset-now','danger')}${btn('取消','close-modal','')}</div>`;
 modalRoot.innerHTML=`<div class="modal-shade" data-modal-backdrop><section class="modal" role="dialog" aria-modal="true" aria-label="${kind==='settings'?'本练习记录':'训练说明'}"><div class="modal-top"><span class="eyebrow">读懂再答</span><button class="iconbtn" data-action="close-modal" aria-label="关闭">${icon('close')}</button></div>${content}</section></div>`;
 document.body.style.overflow='hidden';modalRoot.querySelector('button')?.focus();
}
function closeModal(){modal=null;modalRoot.innerHTML='';document.body.style.overflow='';previousFocus?.focus?.();}
function download(text,name,mime='application/json'){const url=URL.createObjectURL(new Blob([text],{type:mime+';charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function exportData(){download(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),`读懂再答-记录-${new Date().toISOString().slice(0,10)}.json`);toast('备份文件已生成。');}
async function importFile(file){
 if(!file)return;if(file.size>5*1024*1024){toast('文件过大，请选择本程序导出的 JSON 备份。');return;}
 try{
  const text=await file.text(),data=JSON.parse(text),clean=C.validateImportedState(data,BANK);
  if(state.records.length&&!window.confirm('导入会替换本页当前记录。请确认已经导出需要保留的备份。'))return;
  state=clean;damagedRaw=null;canPersist=true;storageWarning='';save();closeModal();view='home';render();top();toast('已导入提交记录；未提交草稿不导入。');
 }catch(e){toast('没有导入：'+(e.message||'文件格式不正确。'));}
}
function resetNow(){if(window.ProgressBridge?.invalidated){toast('请到顶部“进度管理”清理保留的记录，再刷新练习。');return;}state={version:1,bankVersion:'1.0',records:[],closedBlocks:[],draft:null};damagedRaw=null;canPersist=true;storageWarning='';save();closeModal();view='home';render();top();toast('本练习进度已清理。');}
function handleAction(action,el){
 const d=state.draft,q=getQ();
 switch(action){
  case 'home':save();view='home';render();top();break;
  case 'report':save();view='report';render();top();break;
  case 'start':start();break;
  case 'help':showModal('help');break;
  case 'count-help':showModal('count-help');break;
  case 'settings':showModal('settings');break;
  case 'close-modal':closeModal();break;
  case 'reset-confirm':showModal('reset');break;
  case 'reset-now':resetNow();break;
  case 'export':exportData();break;
  case 'export-damaged':download(damagedRaw||'','读懂再答-故障原始记录.txt','text/plain');break;
  case 'import':document.getElementById('import-file')?.click();break;
  case 'count':if(d&&d.stage==='count'){d.countChoice=Number(el.dataset.value);save();render();}break;
  case 'final-count':if(d&&d.stage==='check'){d.finalCount=Number(el.dataset.value);save();render();focusTask();}break;
  case 'count-next':if(d&&d.countChoice!==null){d.initialCount=d.countChoice;d.finalCount=d.countChoice;d.stage='evidence';save();render();focusTask();}break;
  case 'evidence-next':if(d){d.stage='answer';save();render();focusTask();}break;
  case 'edit-evidence':if(d&&q.mode==='train'){d.stage='evidence';save();render();focusTask();}break;
  case 'assist':if(d&&q.mode==='train'&&d.stage!=='count'){d.assistOpen=!d.assistOpen;if(d.assistOpen&&!d.toolsUsed.includes('reading-notes'))d.toolsUsed.push('reading-notes');save();render();}break;
  case 'clear-links':if(d){d.links=[];pendingSource=null;save();refreshLinks();}break;
  case 'remove-link':if(d){d.links.splice(Number(el.dataset.index),1);save();refreshLinks();}break;
  case 'option':if(d){const t=q.targets.find(t=>t.id===d.currentTarget),s=t?.steps.find(s=>s.id===el.dataset.step);if(!s)break;const v=el.dataset.option;if(s.kind==='single')d.currentValues[s.id]=v;else{const a=Array.isArray(d.currentValues[s.id])?d.currentValues[s.id]:[];d.currentValues[s.id]=s.kind==='multi'&&a.includes(v)?a.filter(x=>x!==v):a.includes(v)?a:[...a,v];}d.buffers[t.id]=clone(d.currentValues);save();rerenderEditor();}break;
  case 'order-remove':if(d){const a=d.currentValues[el.dataset.step]||[];d.currentValues[el.dataset.step]=a.filter(x=>x!==el.dataset.option);d.buffers[d.currentTarget]=clone(d.currentValues);save();rerenderEditor();}break;
  case 'save-answer':if(d&&d.currentTarget){saveCurrentAnswer();d.stage='more';save();render();focusTask();}break;
  case 'more-yes':if(d){d.checkHistory.push({answer:'continue',at:new Date().toISOString(),savedTargets:Object.keys(d.responses).length});d.stage='answer';d.currentTarget='';d.currentValues={};save();render();focusTask();}break;
  case 'more-no':case 'finish-answers':if(d)enterCheck();break;
  case 'edit-target':if(d){d.currentTarget=el.dataset.target;d.currentValues=clone(d.responses[d.currentTarget]||{});d.stage='answer';save();render();focusTask();}break;
  case 'delete-target':if(d){delete d.responses[el.dataset.target];delete d.buffers[el.dataset.target];if(d.currentTarget===el.dataset.target){d.currentTarget='';d.currentValues={};}save();render();focusTask();}break;
  case 'submit':submit();break;
  case 'next-question':nextQuestion();break;
  case 'close-block':closeBlock();break;
  case 'review-block':if(state.closedBlocks.includes(el.dataset.block)){currentReviewBlock=el.dataset.block;view='block';render();top();}break;
  case 'jump-reading':document.getElementById('reading-col')?.scrollIntoView({behavior:'smooth',block:'start'});break;
  case 'jump-task':document.getElementById('task-panel')?.scrollIntoView({behavior:'smooth',block:'start'});break;
 }
}
function rerenderEditor(){const editor=document.querySelector('.response-editor'),q=getQ(),d=state.draft;if(!editor||!q||!d)return;const t=q.targets.find(t=>t.id===d.currentTarget);editor.innerHTML=t.steps.map(s=>stepHTML(s,d.currentValues[s.id])).join('');}
function selectSentence(id){const d=state.draft,q=getQ();if(!d||d.stage!=='evidence'||q.mode!=='train')return;d.evidence=d.evidence.includes(id)?d.evidence.filter(x=>x!==id):[...d.evidence,id];save();const el=app.querySelector(`[data-sentence="${id}"]`);if(el){el.classList.toggle('selected',d.evidence.includes(id));el.setAttribute('aria-pressed',String(d.evidence.includes(id)));}const note=app.querySelector('.selection-note strong');if(note)note.textContent=d.evidence.length;}
app.addEventListener('click',e=>{
 const tok=e.target.closest('[data-token]');if(tok){if(Date.now()<ignoreTokenClickUntil)return;const t=getQ()?.tokens.find(t=>t.id===tok.dataset.token);if(t?.kind==='pronoun'&&pendingSource)addLink(pendingSource,t.id);return;}
 const el=e.target.closest('[data-action]');if(el){handleAction(el.dataset.action,el);return;}
 const s=e.target.closest('[data-sentence]');if(s)selectSentence(s.dataset.sentence);
});
modalRoot.addEventListener('click',e=>{if(e.target.matches('[data-modal-backdrop]'))closeModal();const el=e.target.closest('[data-action]');if(el)handleAction(el.dataset.action,el);});
modalRoot.addEventListener('change',e=>{if(e.target.id==='import-file')importFile(e.target.files?.[0]);});
app.addEventListener('change',e=>{
 if(e.target.id==='target-select'&&state.draft){const d=state.draft;d.currentTarget=e.target.value;d.currentValues=clone(d.responses[d.currentTarget]||d.buffers[d.currentTarget]||{});save();render();focusTask();}
});
app.addEventListener('input',e=>{
 if(e.target.dataset.numeric&&state.draft){const d=state.draft;d.currentValues[e.target.dataset.numeric]=e.target.value;d.buffers[d.currentTarget]=clone(d.currentValues);save();}
});
document.addEventListener('keydown',e=>{
 if(modal){
  if(e.key==='Escape'){e.preventDefault();closeModal();return;}
  if(e.key==='Tab'){const els=[...modalRoot.querySelectorAll('button,input,select,a[href],[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent!==null);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}return;
 }
 const tok=e.target.closest?.('[data-token]');if(tok&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const t=getQ()?.tokens.find(t=>t.id===tok.dataset.token);if(t?.kind==='noun')setPending(t.id);else if(pendingSource)addLink(pendingSource,t.id);return;}
 const s=e.target.closest?.('[data-sentence][role="button"]');if(s&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectSentence(s.dataset.sentence);}
});
/* Reference drawing: learner-created annotations, never auto-matched or graded. */
function setPending(id){pendingSource=id;document.querySelectorAll('.token.pending').forEach(x=>x.classList.remove('pending'));app.querySelector(`[data-token="${id}"]`)?.classList.add('pending');}
function addLink(from,to){
 const q=getQ(),d=state.draft;if(!q||!d||!d.assistOpen||q.mode!=='train')return;const a=q.tokens.find(t=>t.id===from),b=q.tokens.find(t=>t.id===to);if(a?.kind!=='noun'||b?.kind!=='pronoun')return;
 if(!d.links.some(l=>l.from===from&&l.to===to))d.links.push({from,to});pendingSource=null;document.querySelectorAll('.token.pending').forEach(x=>x.classList.remove('pending'));save();refreshLinks();
}
function refreshLinks(){const el=document.getElementById('link-list'),q=getQ(),d=state.draft;if(el&&q&&d)el.innerHTML=linkChips(q,d);drawLinks();}
function endpoint(id,box){const el=app.querySelector(`[data-token="${id}"]`);if(!el)return null;const r=el.getClientRects()[0]||el.getBoundingClientRect();return {x:r.left-box.left+r.width/2,y:r.top-box.top-2};}
function drawLinks(live=null){
 const svg=document.getElementById('link-overlay'),wrap=document.getElementById('passage-wrap'),d=state.draft,q=getQ();if(!svg||!wrap||!d||!q)return;
 const box=wrap.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${Math.max(1,box.width)} ${Math.max(1,box.height)}`);
 if(!d.assistOpen||q.mode!=='train'){svg.innerHTML='';return;}
 const colors=['#397e6a','#8661a4','#ba8440','#497baf','#ad6575'];let defs='',paths='';
 d.links.forEach((l,i)=>{const a=endpoint(l.from,box),b=endpoint(l.to,box);if(!a||!b)return;const color=colors[i%colors.length],mid=Math.min(a.y,b.y)-11-(i%3)*4;
  const path=Math.abs(a.y-b.y)<12?`M ${a.x} ${a.y} V ${mid} H ${b.x} V ${b.y}`:`M ${a.x} ${a.y} V ${a.y-10} H ${box.width-2-(i%3)*4} V ${b.y-10} H ${b.x} V ${b.y}`;
  defs+=`<marker id="link-arrow-${i}" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M 0 0 L 6 3.5 L 0 7 Z" fill="${color}"/></marker>`;
  paths+=`<path data-link-path="${i}" d="${path}" stroke="${color}" stroke-width="1.7" opacity=".86" fill="none" stroke-linejoin="round" marker-end="url(#link-arrow-${i})"/>`;
 });
 if(live){const a=endpoint(live.from,box);if(a)paths+=`<path d="M ${a.x} ${a.y} L ${live.x-box.left} ${live.y-box.top}" fill="none" stroke="#476e5e" stroke-width="2" stroke-dasharray="5 4"/>`;}
 svg.innerHTML=`<defs>${defs}</defs>${paths}`;
}
app.addEventListener('pointerdown',e=>{
 const el=e.target.closest('[data-token]'),q=getQ(),d=state.draft;if(!el||!q||!d||!d.assistOpen||q.mode!=='train'||e.button!==0)return;
 const t=q.tokens.find(t=>t.id===el.dataset.token);if(t?.kind!=='noun')return;e.preventDefault();e.stopPropagation();
 drag={from:t.id,x:e.clientX,y:e.clientY,moved:false,pointerId:e.pointerId,el};try{el.setPointerCapture(e.pointerId);}catch{}
});
window.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointerId)return;e.preventDefault();if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5)drag.moved=true;if(drag.moved)drawLinks({from:drag.from,x:e.clientX,y:e.clientY});},{passive:false});
window.addEventListener('pointerup',e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;const old=drag;drag=null;try{old.el.releasePointerCapture(e.pointerId);}catch{}
 const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-token]');ignoreTokenClickUntil=Date.now()+150;
 if(old.moved&&target)addLink(old.from,target.dataset.token);else if(!old.moved)setPending(old.from);drawLinks();
});
window.addEventListener('pointercancel',()=>{drag=null;drawLinks();});
window.addEventListener('resize',()=>requestAnimationFrame(drawLinks));
window.addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});
load();render();
})();
</script>
</body>
