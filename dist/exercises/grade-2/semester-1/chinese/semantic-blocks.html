      "池塘边上住着一条蛇，它成天横行霸道，见了青蛙就不放过。青蛙们被它吃怕了，听到一点动静就马上钻进水里藏起来，连大气也不敢出。",

    "paragraphs": [
      "有一次，一只狮子正在树下睡觉。一只小老鼠在它身上跑上跑下，很快把它吵醒了。狮子睁开眼睛，伸出大爪子，一把按住老鼠，张开大嘴，要把它吞下去。",
      "“饶了我吧，大王！”小老鼠叫道，“这一次请您放过我，我永远不会忘记。谁知道呢，也许哪一天，我也能帮您一个忙。”",
      "想到这么小的老鼠竟说能帮助自己，狮子觉得十分好笑。不过，它还是抬起爪子，把老鼠放走了。老鼠赶紧跑进草丛里，没有忘记自己的话。",
      "过了一些日子，狮子落进了猎人的圈套。猎人想把它活着献给国王，就把它绑在一棵树上，然后去找一辆车，好把它运走。狮子用力挣扎，绳子却越勒越紧。",
      "恰巧，小老鼠从这里经过。看见狮子被困，它马上走上前，低下头，用牙齿一点一点地咬断捆住这位百兽之王的绳子。狮子终于得救了。",
      "“我说得没错吧？”小老鼠说。狮子望着这个小小的朋友，再也不觉得它的话可笑了。",
      "小小的朋友，也能帮上大忙。"

    "paragraphs": [
      "一个炎热的夏日，一只狐狸在果园里闲逛。它又累又渴，忽然看见一串快要成熟的葡萄。葡萄藤攀在高高的树枝上，那串葡萄也挂得很高。",
      "“这正好可以给我解渴。”狐狸舔了舔嘴，站在藤架下面，仰起头看了又看。它觉得，只要跳得高一些，就能吃到葡萄了。",
      "它向后退了几步，接着助跑、起跳。它张开嘴巴，努力去够那串葡萄，可还是差了一点。落到地上后，它并不服气。",
      "狐狸转过身，又数着“一、二、三”跳了起来。这一次仍然没有成功。“再来一次，总会够着的。”它对自己说。",
      "它一次又一次地跑、一次又一次地跳，最后累得直喘气。可是，那串葡萄还好好地挂在树枝上，它连一颗也没有碰到，更没有尝过是什么味道。",
      "狐狸不得不放弃。它仰着鼻子走开，嘴里却说：“我敢说，这些葡萄一定是酸的。”说完，它不再回头，装作自己一点儿也不想吃。",
      "得不到的东西，人往往容易说它不好。"

      "风和太阳争论起来，都说自己更有力量。风吹得树枝摇晃，得意地说：“看见了吗？我能让树都弯下腰。”太阳没有争吵，只是照着大地。",

      "过了几天，男孩又喊了一次“狼来了”，骗得大家白跑了一趟。后来，真的有一只狼从林子里跑了出来。一只狼突然扑向羊群，男孩拼命地再次呼喊村里人帮忙。",

<script id="rules">
var TrainingRules = Object.freeze({
  sameSet(a,b){return a.length===b.length&&new Set(a).size===a.length&&b.every(x=>a.includes(x));},
  mask(answer,n){if(!Array.isArray(answer)||new Set(answer).size!==answer.length||answer.some(i=>!Number.isInteger(i)||i<0||i>=n))return null;return answer.reduce((m,i)=>m|(1<<i),0);},
  accepts(answer,event){const m=this.mask(answer,event.tokens.length);return m!==null&&event.answerMasks.includes(m);},
  inspect(answer,event){const mask=this.mask(answer,event.tokens.length);if(mask===null)return {status:'incomplete',missing:event.proof.required,fragments:[]};const selected=new Set(answer),units=event.proof.units.filter(u=>u.indices.every(i=>selected.has(i))),claims=new Set(units.flatMap(u=>u.gives)),covered=new Set(units.flatMap(u=>u.indices));for(const d of event.proof.details)if(selected.has(d.index)&&d.after.every(f=>claims.has(f)))covered.add(d.index);const missing=event.proof.required.filter(r=>!claims.has(r.id)),fragments=answer.filter(i=>!covered.has(i)),faithful=[...claims].every(f=>event.proof.sourceFacts.includes(f));const status=this.accepts(answer,event)?'correct':faithful&&!missing.length&&!fragments.length&&answer.length===event.tokens.length?'uncompressed':'incomplete';return {status,missing,fragments};},
  validOrder(a,n){return Array.isArray(a)&&a.length===n&&new Set(a).size===n&&a.every(x=>Number.isInteger(x)&&x>=0&&x<n);},
  orderCorrect(a,model){return this.validOrder(a,4)&&model.before.every(([x,y])=>a.indexOf(x)<a.indexOf(y));},
  permutations(a){return a.length?a.flatMap((v,i)=>this.permutations(a.filter((_,j)=>i!==j)).map(p=>[v,...p])):[[]];},
  record(records,key,correct){if(!records[key])records[key]={tries:0,firstCorrect:!!correct,solved:false,hints:0};const r=records[key];if(!r.tries)r.firstCorrect=!!correct;r.tries++;r.solved=!!correct;return r;},
  stats(records){const a=Object.values(records).filter(r=>r.tries>0);const correct=a.filter(r=>r.firstCorrect).length;return {attempted:a.length,correct,percent:a.length?Math.round(correct/a.length*100):null,hints:Object.values(records).filter(r=>r.hints>0).length};}
});
</script>

function ordering(){const p=progress(),s=story(),solved=p.records.order?.solved;return `<div class="cardtop"><span class="smallcap">第 2 关 · 排列事件</span><span class="smallcap">共 4 件事</span></div><div class="cardbody"><h2 class="questiontitle">把故事的经过排出来</h2><p class="instruction">${s.orderModel.overlap.length?esc(s.orderModel.note)+' ':''}用 ↑ ↓ 调整，也可以拖动卡片。</p><ol class="orderlist">${p.order.map((v,i)=>`<li class="eventcard" data-pos="${i}" draggable="${!solved}"><span class="rank" aria-label="第${i+1}件事">${i+1}</span><span class="eventtext">${esc(s.events[v].core)}</span><div class="movebuttons"><button class="move" data-action="up" data-index="${i}" data-key="up${i}" aria-label="上移：${esc(s.events[v].core)}" ${solved||i===0?'disabled':''}>↑</button><button class="move" data-action="down" data-index="${i}" data-key="down${i}" aria-label="下移：${esc(s.events[v].core)}" ${solved||i===3?'disabled':''}>↓</button></div></li>`).join('')}</ol>${tools()}${feedbackBox()}</div><div class="actions">${solved?primary('选择标题','next'):primary('检查事件顺序','check')}</div>`;}
function titleChoice(){const p=progress(),s=story(),solved=p.records.title?.solved;return `<div class="cardtop"><span class="smallcap">第 3 关 · 选择标题</span><span class="smallcap">四选一</span></div><div class="cardbody"><h2 class="questiontitle">哪个标题最能概括整个故事？</h2><div class="summarybox" style="font-size:14px">${s.events.map((e,i)=>`${i+1}. ${esc(e.core)}`).join('　；　')}${s.orderModel.overlap.length?'<br><b>第2、3项有时间重叠，中间两张可以互换。</b>':''}</div><div class="choices" role="group" aria-label="四个标题选项">${p.titleOrder.map((i,displayIndex)=>{const t=s.titles[i];return `<button class="choice" data-action="choice" data-index="${i}" data-key="choice${i}" aria-pressed="${p.choice===i}" ${solved?'disabled':''}><span class="letter">${'ABCD'[displayIndex]}</span>${esc(t.text)}</button>`;}).join('')}</div>${tools()}${feedbackBox()}</div><div class="actions">${solved?primary('查看结果','next'):primary('确定这个标题','check',p.choice===null)}</div>`;}
function results(){const p=progress(),s=story(),st=R.stats(p.records),next=BANK.findIndex((x,i)=>i>state.current&&!state.stories[x.id].everDone);return `<div class="cardtop"><span class="smallcap">第 ${state.current+1} 篇 · 训练完成</span><span class="smallcap">已完成 6 题</span></div><div class="cardbody"><div class="celebrate"><h2 class="title-reveal">《${esc(s.title)}》</h2></div><div class="stats"><div class="stat"><strong>${st.percent??0}<span style="font-size:15px"> 分</span></strong><small>首次表现得分</small></div><div class="stat"><strong>${st.correct} / ${st.attempted}</strong><small>第一次就答对</small></div><div class="stat"><strong>${st.hints}</strong><small>使用提示的题数</small></div></div><div class="resultlist">${['e0','e1','e2','e3','order','title'].map((k,i)=>`<span class="resultbadge ${p.records[k]?.firstCorrect?'':'miss'}">${i<4?'积木 '+(i+1):i===4?'排序':'标题'} · ${p.records[k]?.firstCorrect?'首答正确':'练习后完成'}</span>`).join('')}</div><h3>故事概要</h3><div class="summarybox">${esc(s.summary)}</div><div class="sourcebox"><b>故事从哪里来？</b><p>${esc(s.source.note)}</p>${sourceLinks(s)}</div></div><div class="actions"><button class="secondary" data-action="replay">再练一次</button>${primary(next>=0?'下一篇故事':'再选一篇故事','nextStory')}</div>`;}
function annotateText(root){window.PinyinAid?.annotate(root,{selector:'.storytext p,.words,.sentence,.eventtext,.summarybox,.choice,.hintbox,.feedback,.questiontitle,.dialogbody blockquote,.dialogbody summary,.dialogbody p'});}
function render(){const s=story(),p=progress(),stats=statsAll(),done=BANK.filter(s=>state.stories[s.id].everDone).length;
 $('storynav').innerHTML=BANK.map((x,i)=>{const p=state.stories[x.id];return `<button class="storybutton ${i===state.current?'active':''}" data-story="${i}" ${i===state.current?'aria-current="true"':''}><span class="storyicon" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><span><strong>第 ${i+1} 篇 · ${esc(x.navLabel)}</strong><small>${p.everDone?'已完成 · 可再练':i===state.current?'正在练习':'尚未完成'}</small></span>${p.everDone?'<span class="check" aria-label="已完成">✓</span>':''}</button>`;}).join('');
 $('sidecard').innerHTML=`<h3>已完成篇数 <span style="float:right">${done} / ${BANK.length}</span></h3><div class="totalbar" role="progressbar" aria-label="已完成的篇数" aria-valuemin="0" aria-valuemax="${BANK.length}" aria-valuenow="${done}"><span style="width:${done/BANK.length*100}%"></span></div><p>首次正确率 <b style="float:right">${stats.percent===null?'—':stats.percent+'%'}</b><br>已首次作答 ${stats.attempted} 题 · 提示 ${stats.hints} 题</p>`;
 const phase=Math.min(p.phase,3),phaseProgress=p.phase===0?0:p.phase===1?1+p.q/4:p.phase===2?2:p.phase===3?3:4;
 $('main').innerHTML=`<div class="intro"><div><p class="eyebrow">第 ${String(state.current+1).padStart(2,'0')} 篇</p><h1 id="stageHeading" tabindex="-1">${['阅读故事','提炼事件','排列事件','选择标题','练习结果'][p.phase]}</h1></div></div><ol class="steps" aria-label="训练步骤">${labels.map((l,i)=>`<li class="step ${p.phase===4||i<phase?'past':i===phase?'current':''}" ${i===phase&&p.phase!==4?'aria-current="step"':''}><span class="stepnum">${p.phase===4||i<phase?'✓':i+1}</span><span>${l}</span></li>`).join('')}</ol><section class="card" aria-label="${labels[phase]}">${[reading,shrink,ordering,titleChoice,results][p.phase]()}</section><div class="footerline"><span>全篇进度 ${Math.round(phaseProgress/4*100)}% · ${stats.percent===null?'首次正确率待记录':'总首次正确率 '+stats.percent+'%'}</span></div>`;
 annotateText($('main'));$('savewarning').hidden=canSave;
}
function check(){const p=progress(),s=story(),k=key();if(p.records[k]?.solved)return;
 let correct=false;feedbackKind='wrong';
 if(p.phase===1){const e=s.events[p.q],sel=p.selected[p.q];if(!sel.length)return;const result=R.inspect(sel,e);if(result.status==='uncompressed'){feedbackKind='coach';feedback='这句话仍是完整练习句。请删去一处不影响关键意思的细节；这次不记作答错。';render();announce(feedback);return;}correct=result.status==='correct';feedback=result.missing.length?e.missingFeedback+' 还需要表达：'+result.missing.map(r=>r.fact).join('；')+'。':'有词块没有连成完整的意思，请检查人物、动作、对象与连接词。';}
 else if(p.phase===2){correct=R.orderCorrect(p.order,s.orderModel);feedback=s.orderModel.overlap.length?'这两件中段行动可互换，但比赛起因要在前，结局要在后。':'有些事情的先后或因果颠倒了。请按原文调整。';}
 else if(p.phase===3){if(p.choice===null)return;correct=s.titles[p.choice].correct;feedback=s.titles[p.choice].explanation;}
 else return;
 R.record(p.records,k,correct);save();render();announce(correct?'答对了！可以进入下一步。':feedback);}
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;annotateText($('modalBody'));if(!$('modal').open)$('modal').showModal();}
function showEvidence(){const p=progress(),s=story(),k=key();if(!p.records[k]?.solved){p.records[k]??={tries:0,firstCorrect:false,solved:false,hints:0};p.records[k].hints=1;save();render();}if(p.phase===2){openModal('排序的原文依据',`<p>${esc(s.orderModel.note)}</p>${s.orderModel.overlap.length?'<p>同时进行的事情不强制排成唯一顺序。</p>':''}${s.orderModel.anchors.map(a=>`<blockquote>第${a.paragraph+1}段：${esc(a.quote)}</blockquote>`).join('')}<p>需保留的先后关系：${s.orderModel.before.map(([a,b])=>`“${esc(s.events[a].core)}”<br>在“${esc(s.events[b].core)}”之前`).join('。<br><br>')}。</p>`);return;}const e=s.events[p.q];openModal('这块积木的原文依据',`<p><b>本题要抓住：${esc(e.goal)}</b></p>${e.proof.required.map((r,i)=>`<details ${i===0?'open':''} style="border-bottom:1px solid var(--line);padding:12px 0"><summary><b>${esc(r.fact)}</b></summary><p>${esc(r.reason)}</p><p class="smallcap">${r.kind==='explicit'?'原文直接写明':'结合上下文作出的解释'}</p>${r.anchors.map(a=>`<blockquote style="margin:10px 0;padding:10px 14px;background:#f0f3e8;border-radius:10px">第${a.paragraph+1}段：${esc(a.quote)}</blockquote>`).join('')}</details>`).join('')}<p><b>可以省去什么？</b><br>${esc(e.proof.omitReason)}</p><p class="note">未答对前查看依据，会计入本题提示记录。</p>`);}
function showRead(){openModal(progress().everDone?'故事回顾：'+story().title:'原文',`<article class="storytext">${story().paragraphs.map(t=>`<p>${esc(t)}</p>`).join('')}</article>`);}
function showAbout(){openModal('使用说明',`<h3>操作步骤</h3><ol><li>阅读故事。</li><li>根据完整正文点击词块，保留核心事件及关键的原因、办法、转折和结果；四块都搭对后继续。</li><li>拖动事件卡片，或点击上下按钮排顺序。</li><li>从四个标题里选出最能概括全文的一个，并看解释。</li></ol><h3>怎样记录？</h3><p>每篇 4 道提炼题、1 道排序题、1 道标题题，共 6 道。本关训练故事事件提炼，不以越短越好为标准；关键因果与必要结果不能丢，可由上下文交代的细节允许省略。判分接受经证据核对、意思完整并省去至少一处细节的词块组合。全选原句会提示继续提炼，不记作答错。首次正确率 = 第一次提交就正确的题数 ÷ 已第一次提交的题数。未提交的题不进入分母；空答案无法提交。百分制得分与首次正确率相同。用提示后首次答对仍计为首次正确，提示题数单独显示。</p><p>可以反复修改到正确为止。重复点击、刷新和“再练一次”都保留首次结果。进度只存于当前浏览器和当前文件位置；移动或改名后，部分浏览器可能无法读取原记录。隐私模式或存储受限时会提示使用临时进度。</p><p>按 <span class="key">Tab</span> 移动焦点，按空格或回车选择。排序可完全使用上下按钮。</p><h3>素材与来源</h3><p>阅读页展示完整正文，提炼练习句单独编写。第一篇保留原站完整正文，原有其余五篇依据公版底本译写并扩写；新增十四篇为古典或公版寓言自行改写。扩写的场景和对话不冒充底本原文。以下来源页可能显示原标题。</p>${BANK.map((s,i)=>`<div class="sourceitem"><b>第 ${i+1} 篇 · ${state.stories[s.id].everDone?esc(s.title):'标题通关后揭晓'}</b><p>${esc(s.source.note)}</p>${sourceLinks(s)}</div>`).join('')}<p>本文件新增代码、中文译写及改编练习按 <a href="https://creativecommons.org/licenses/by-nc-sa/3.0/cn/" target="_blank" rel="noopener noreferrer">CC BY-NC-SA 3.0 CN</a> 提供，署名及原素材说明见上。用于非商业阅读练习，分享改编时保留署名并采用同一许可。</p><h3>本练习记录</h3><p>清空后，本版全部20篇的进度、首次答题记录和提示记录都会删除，无法撤销。</p><button class="danger" id="requestReset">清理本版练习进度…</button>`);}
function move(from,to){const p=progress();if(p.phase!==2||p.records.order?.solved||to<0||to>3||from===to)return;const moved=p.order.splice(from,1)[0];p.order.splice(to,0,moved);feedback='';save();render();announce('已移动到第 '+(to+1)+' 个位置。');}
$('main').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,p=progress(),idx=Number(b.dataset.index),focus=b.dataset.key;
 if(a==='start'){p.phase=1;nextRender();}
 else if(a==='word'){if(p.phase!==1||p.records[key()]?.solved)return;const sel=p.selected[p.q];p.selected[p.q]=sel.includes(idx)?sel.filter(v=>v!==idx):[...sel,idx].sort((a,b)=>a-b);feedback='';save();render();}
 else if(a==='choice'){p.choice=idx;feedback='';save();render();}
 else if(a==='check')check();
 else if(a==='next'){if(!p.records[key()]?.solved)return;if(p.phase===1&&p.q<3)p.q++;else p.phase++;if(p.phase===4)p.everDone=true;nextRender();}
 else if(a==='hint'){hintVisible=!hintVisible;const k=key();if(hintVisible){p.records[k]??={tries:0,firstCorrect:false,solved:false,hints:0};p.records[k].hints=1;}save();render();announce(hintVisible?'提示已展开。':'提示已收起。');}
 else if(a==='read')showRead();
 else if(a==='evidence')showEvidence();
 else if(a==='up'||a==='down')move(idx,idx+(a==='up'?-1:1));
 else if(a==='replay'){const old=p;state.stories[story().id]={...fresh(story()),records:Object.fromEntries(Object.entries(old.records).map(([k,v])=>[k,{...v,solved:false}])),everDone:true};nextRender();}
 else if(a==='nextStory'){let n=BANK.findIndex((s,i)=>i>state.current&&!state.stories[s.id].everDone);if(n<0)n=BANK.findIndex(s=>!state.stories[s.id].everDone);state.current=n<0?0:n;nextRender();}
 if(focus)$('main').querySelector(`[data-key="${focus}"]`)?.focus({preventScroll:true});
});
$('storynav').addEventListener('click',e=>{const b=e.target.closest('[data-story]');if(!b)return;state.current=Number(b.dataset.story);nextRender();});
$('about').onclick=showAbout;$('closeModal').onclick=()=>$('modal').close();
$('modalBody').addEventListener('click',e=>{if(e.target.id==='requestReset')openModal('确定清理本版练习进度？','<p>本版全部20篇故事的进度、首次答题记录和提示记录都会被删除，无法恢复。</p><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="secondary" id="cancelReset">保留记录</button><button class="danger" id="confirmReset">确认清理</button></div>');else if(e.target.id==='cancelReset')$('modal').close();else if(e.target.id==='confirmReset'){if(window.ProgressBridge?.invalidated){location.href='../../../../progress.html';return;}state={current:0,stories:Object.fromEntries(BANK.map(s=>[s.id,fresh(s)]))};$('modal').close();nextRender();announce('学习记录已清空，从第一篇重新开始。');}});
$('main').addEventListener('dragstart',e=>{const row=e.target.closest('.eventcard');if(!row||progress().records.order?.solved)return;dragIndex=Number(row.dataset.pos);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragIndex));row.classList.add('dragging');});
$('main').addEventListener('dragover',e=>{const row=e.target.closest('.eventcard');if(row&&dragIndex!==null){e.preventDefault();e.dataTransfer.dropEffect='move';row.classList.add('dragover');}});
$('main').addEventListener('dragleave',e=>e.target.closest('.eventcard')?.classList.remove('dragover'));
$('main').addEventListener('drop',e=>{const row=e.target.closest('.eventcard');if(!row||dragIndex===null)return;e.preventDefault();move(dragIndex,Number(row.dataset.pos));dragIndex=null;});
$('main').addEventListener('dragend',()=>{dragIndex=null;document.querySelectorAll('.dragging,.dragover').forEach(e=>e.classList.remove('dragging','dragover'));});
save();render();
})();
</script>
</body></html>
