<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#256657">
<meta name="description" content="Brison 的练习书架，按年级、上下册和学科查找训练。">
<title>Brison 的练习书架</title>
<style>
:root{--ink:#253c35;--muted:#687970;--green:#256657;--paper:#fffefa;--line:#e2e7de;--bg:#f4f5ee;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,a,select,input{-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button,select{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d48739;outline-offset:5px}.skip{position:absolute;top:-80px;left:16px;padding:12px;background:white;z-index:2}.skip:focus{top:12px}header{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:28px 24px;border-bottom:1px solid var(--line)}.brand{font-weight:750;display:flex;align-items:center;gap:10px;text-decoration:none}.brand-icon{width:34px;height:34px;display:grid;place-items:center;background:var(--green);color:white;border-radius:11px}.header-note{color:var(--muted);font-size:13px}main{max-width:1120px;margin:auto;padding:48px 24px 32px}.hero{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:38px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:700}.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.3;letter-spacing:-1.5px;margin:14px 0}.hero p{color:var(--muted);line-height:1.8;font-size:16px;margin:0}.stamp{flex-shrink:0;border:1px solid #d6dfcf;background:#eaf0e0;border-radius:50%;width:116px;height:116px;display:grid;place-content:center;text-align:center;transform:rotate(8deg);color:var(--green);font-size:12px;line-height:1.8}.stamp strong{font-size:26px}.layout{display:grid;grid-template-columns:214px 1fr;gap:32px}.shelf{background:#e9ede2;border:1px solid #dfe4d7;border-radius:20px;padding:20px;height:fit-content}.shelf h2{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 14px}.grades{display:grid;gap:7px}.grade{width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;border:0;border-radius:10px;color:var(--muted);padding:12px;text-align:left}.grade[aria-pressed=true]{background:var(--paper);color:var(--green);font-weight:700;box-shadow:0 2px 6px #253c3505}.count{font-size:11px;border:1px solid #cfd8c8;padding:1px 6px;border-radius:20px}.shelf-note{font-size:12px;color:var(--muted);line-height:1.8;margin:20px 4px 0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}.semesters{display:flex;padding:4px;background:#e9ede2;border-radius:12px;gap:4px}.semester{border:0;background:transparent;color:var(--muted);padding:9px 22px;border-radius:9px}.semester[aria-pressed=true]{background:var(--green);color:white}.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);padding:10px 12px;border-radius:11px;color:var(--muted);max-width:260px}.search input{border:0;outline:none;background:transparent;min-width:0;width:100%;font-size:14px}.search:focus-within{outline:2px solid var(--green);outline-offset:2px}.subjects{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:24px}.subject{border:1px solid var(--line);background:transparent;padding:9px 17px;border-radius:25px;color:var(--muted);font-size:14px}.subject[aria-pressed=true]{background:#e3eee7;border-color:#acc7b4;color:var(--green);font-weight:700}.results-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.results-heading h2{font-size:19px;margin:0}.results-heading span{font-size:13px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:25px;display:flex;flex-direction:column;min-width:0;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px #253c350a}.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.tile{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:25px;font-weight:700;background:#e5eee9;color:var(--green)}.card[data-subject=math] .tile{background:#f5e9d8;color:#986124}.label{font-size:12px;color:var(--muted)}.card h3{font-size:24px;letter-spacing:-.5px;margin:22px 0 8px}.subtitle{font-size:14px;color:var(--green);margin:0}.description{font-size:14px;line-height:1.85;color:var(--muted);margin:16px 0 20px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.tag{font-size:11px;background:#f1f3ec;color:var(--muted);padding:5px 8px;border-radius:6px}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:26px}.start{display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;font-weight:600;font-size:14px;color:white;background:var(--green);padding:12px 16px;border-radius:10px;flex:1}.empty{grid-column:1/-1;border:1px dashed #cad5c5;border-radius:18px;text-align:center;padding:50px 20px;color:var(--muted)}.empty strong{display:block;font-size:18px;color:var(--ink);margin-bottom:12px}.empty p{font-size:14px;line-height:1.7}.reset{border:1px solid var(--line);background:white;padding:10px 16px;border-radius:10px;color:var(--green);margin-top:8px}footer{max-width:1120px;margin:24px auto 0;padding:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--muted);line-height:1.8}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:760px){header{padding:20px}.header-note{display:none}main{padding:30px 20px}.hero{margin-bottom:28px}.stamp{display:none}.layout{grid-template-columns:1fr;gap:24px}.shelf{padding:14px;border-radius:15px}.shelf h2,.shelf-note{display:none}.grades{grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.grade{padding:10px 2px;justify-content:center;font-size:12px}.grade .count{display:none}.toolbar{gap:12px}.search{max-width:none;flex:1;min-width:130px}.semester{padding:9px 14px}.cards{gap:14px}.card{padding:20px}.actions{flex-wrap:wrap}.start{flex-basis:100%}.subjects{gap:6px}.subject{padding:8px 14px}footer{margin-top:10px;flex-direction:column;gap:4px}}@media(max-width:520px){.cards{grid-template-columns:1fr}.card{padding:24px}.actions{flex-wrap:nowrap}.start{flex-basis:auto}.hero h1{letter-spacing:-.8px}.results-heading h2{font-size:17px}}@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
<link rel="stylesheet" href="project.css">
<style>main{padding-top:28px}.hero{margin-bottom:24px}.hero h1{font-size:28px;letter-spacing:0;margin:0 0 8px}</style>
</head>
<body>
<a class="skip" href="#results">跳到练习列表</a>
<header><a class="brand" href="./"><span class="brand-icon" aria-hidden="true">▤</span>Brison 的练习书架</a><div class="project-header-actions"><a href="progress.html">进度管理</a></div></header>
<main>
  <section class="hero" aria-labelledby="page-title"><div><h1 id="page-title">练习索引</h1><p>按年级、册别和学科选择练习。</p></div></section>
  <div class="layout">
    <aside class="shelf" aria-label="选择年级"><h2>选择年级</h2><div id="grades" class="grades"></div></aside>
    <section aria-label="练习索引">
      <div class="toolbar"><div id="semesters" class="semesters" role="group" aria-label="选择册别"></div><label class="search"><span aria-hidden="true">⌕</span><span class="sr-only">搜索练习名称或内容</span><input id="search" type="search" placeholder="找一份练习…" autocomplete="off"></label></div>
      <div id="subjects" class="subjects" role="group" aria-label="选择学科"></div>
      <div class="results-heading"><h2 id="category"></h2><span id="count" role="status" aria-live="polite"></span></div>
      <div id="results" class="cards" tabindex="-1"></div>
    </section>
  </div>
</main>
<footer><span>练习进度保存在当前浏览器。</span></footer>
<script src="catalog.js"></script>
<script>
(() => {
  const names = ['一年级','二年级','三年级','四年级','五年级','六年级'];
  const subjects = {all:'全部学科',chinese:'语文',math:'数学',english:'英语'};
  const params = new URLSearchParams(location.hash.slice(1));
  const state = {
    grade: /^[1-6]$/.test(params.get('grade')) ? Number(params.get('grade')) : 2,
    semester: ['1','2'].includes(params.get('semester')) ? Number(params.get('semester')) : 1,
    subject: Object.hasOwn(subjects,params.get('subject')) ? params.get('subject') : 'all',
    query: params.get('q') || ''
  };
  const bank = window.EXERCISES;
  const el = id => document.getElementById(id);
  const escape = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function buttons(){
    el('grades').innerHTML = names.map((name,i) => `<button type="button" class="grade" data-grade="${i+1}" aria-pressed="${state.grade===i+1}"><span>${name}</span><span class="count">${bank.filter(x=>x.grade===i+1).length}</span></button>`).join('');
    el('semesters').innerHTML = [1,2].map(n => `<button type="button" class="semester" data-semester="${n}" aria-pressed="${state.semester===n}">${n===1?'上':'下'}册</button>`).join('');
    el('subjects').innerHTML = Object.entries(subjects).map(([id,name]) => `<button type="button" class="subject" data-subject="${id}" aria-pressed="${state.subject===id}">${name}</button>`).join('');
  }
  function render(){
    buttons();
    const query = state.query.trim().toLocaleLowerCase();
    const items = bank.filter(x => x.grade===state.grade && x.semester===state.semester && (state.subject==='all'||x.subject===state.subject) && [x.title,x.subtitle,x.description,...x.tags].join(' ').toLocaleLowerCase().includes(query));
    el('category').textContent = `${names[state.grade-1]} · ${state.semester===1?'上':'下'}册 · ${subjects[state.subject]}`;
    el('count').textContent = `${items.length} 份练习`;
    el('results').innerHTML = items.length ? items.map(x=>`<article class="card" data-subject="${escape(x.subject)}"><div class="card-top"><span class="tile" aria-hidden="true">${x.subject==='math'?'＋':'文'}</span><span class="label">${subjects[x.subject]} · ${names[x.grade-1]}${x.semester===1?'上':'下'}册</span></div><h3>${escape(x.title)}</h3><p class="description">${escape(x.description)}</p><div class="tags">${x.tags.map(t=>`<span class="tag">${escape(t)}</span>`).join('')}</div><div class="actions"><a class="start" href="${escape(x.path)}" aria-label="打开练习：${escape(x.title)}">打开练习 <span aria-hidden="true">↗</span></a></div></article>`).join('') : `<div class="empty"><strong>${query?'没有找到匹配的练习':'暂无练习'}</strong><p>${query?'请更换关键词或分类。':'此分类暂无练习。'}</p><button type="button" class="reset" id="reset">查看二年级上册全部练习</button></div>`;
    const hash = new URLSearchParams({grade:state.grade,semester:state.semester,subject:state.subject});
    if(state.query) hash.set('q',state.query);
    // file:// 下也可使用，不依赖服务器。
    try { history.replaceState(null,'','#'+hash); } catch { /* 筛选仍正常工作 */ }
  }
  document.addEventListener('click', event => {
    const button = event.target.closest('button'); if(!button) return;
    const key = ['grade','semester','subject'].find(k => button.dataset[k]!==undefined);
    if(key){ state[key] = key==='subject'?button.dataset[key]:Number(button.dataset[key]); render(); document.querySelector(`[data-${key}="${state[key]}"]`).focus(); }
    if(button.id==='reset'){Object.assign(state,{grade:2,semester:1,subject:'all',query:''});el('search').value='';render();el('results').focus();}
  });
  el('search').value=state.query;
  el('search').addEventListener('input',event=>{state.query=event.target.value;render();});
  render();
})();
</script>
</body>
</html>
