name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ format('github-pages-{0}', github.run_attempt) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ format('github-pages-{0}', github.run_attempt) }}
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: ${{ needs.build.outputs.artifact_name }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" \
              --jq '[.artifacts[] | select(.expired == false)] | length' | grep -qx 1; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded Pages artifact did not become available."
          exit 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
